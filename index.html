  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    header button { white-space: nowrap; }
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    /* Telas menores (tablet, celular deitado): botões do topo só com ícone */
    @media (max-width: 1180px), (max-height: 560px) {
      header button > span:not(#diag-badge) { display: none; }
      header button { padding-left: 0.55rem !important; padding-right: 0.55rem !important; min-height: 2rem; }
      #brand-sub { display: none; }
    }
    /* Pouca altura (celular deitado): topo, dock e painel mais enxutos */
    @media (max-height: 560px) {
      header { height: 2.75rem !important; padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
      header svg { height: 1.75rem !important; }
      #dock.h-44 { height: 8.25rem !important; }
      #properties-panel { width: 15.5rem !important; padding: 0.5rem !important; }
      #zoom-controls { right: 0.5rem !important; bottom: 0.5rem !important; }
      #zoom-controls span:not(#zoom-label) { display: none; }
    }
    /* Janela do equipamento: abas */
    .dev-tabs { display: flex; gap: 0.25rem; background: #020617; border: 1px solid #1e293b; border-radius: 0.6rem; padding: 0.2rem; }
    .dev-tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.4rem 0.2rem; border-radius: 0.45rem; font-size: 11px; font-weight: 700; color: #94a3b8; }
    .dev-tabs button:hover { color: #e2e8f0; background: #1e293b; }
    .dev-tabs button.on { background: #0c4a6e; color: #e0f2fe; }
    .dev-val { display: flex; flex-direction: column; align-items: center; padding: 0.3rem 0.1rem; border-radius: 0.5rem; background: #020617; border: 1px solid #1e293b; }
    .dev-val span { font-size: 10px; color: #94a3b8; font-weight: 700; } .dev-val b { font-size: 13px; }
    .dev-main { width: 100%; font-size: 12px; font-weight: 700; border-radius: 0.5rem; padding: 0.5rem; color: #0f172a; background: #38bdf8; }
    .dev-main:hover { background: #7dd3fc; }
    .dev-link { font-size: 11px; font-weight: 700; color: #7dd3fc; }
    html.light .dev-tabs { background: #f1f5f9; border-color: #cbd5e1; } html.light .dev-tabs button { color: #475569; }
    html.light .dev-tabs button.on { background: #0369a1; color: #fff; } html.light .dev-val { background: #f8fafc; border-color: #cbd5e1; }
    html.light .dev-val span { color: #475569; } html.light .dev-link { color: #0369a1; }
    /* Botão de diagnóstico no cartão do equipamento */
    .card-diag { position: absolute; top: -12px; right: 14px; width: 24px; height: 24px; border-radius: 9999px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; background: #0f172a; border: 1.5px solid #34d399; color: #34d399; z-index: 6; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    .card-diag.warn { border-color: #f59e0b; color: #fbbf24; } .card-diag.bad { border-color: #f43f5e; color: #fb7185; }
    .card-diag:hover { transform: scale(1.15); }
    html.light .card-diag { background: #fff; }
    @media (pointer: coarse) { .card-diag { width: 30px; height: 30px; top: -15px; font-size: 13px; } }
    /* Menu ⋯ (só no celular deitado) */
    #more-wrap { display: none; }
    .mm-i { width: 100%; display: flex; align-items: center; gap: 0.6rem; text-align: left; padding: 0.55rem 0.7rem; border-radius: 0.5rem; font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .mm-i:hover { background: #1e293b; } .mm-i i { width: 1rem; text-align: center; }
    html.light .mm-i { color: #0f172a; } html.light .mm-i:hover { background: #e2e8f0; }
    /* Celular deitado (pouca altura): cabeçalho em uma linha, painel na altura toda do mapa, dock baixo */
    @media (max-height: 500px) {
      header { flex-wrap: nowrap !important; height: 2.6rem !important; min-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; gap: 0.5rem !important; }
      header > div:first-child { display: none !important; }
      header > div:last-child { flex-wrap: nowrap !important; gap: 0.3rem !important; }
      header [data-hx] { display: none !important; }
      #more-wrap { display: block; }
      header button { min-height: 2.1rem; }
      header .w-8 { width: 2.1rem; height: 2.1rem; }
      #mode-switch button { padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
      #properties-panel { top: 0 !important; right: 0 !important; bottom: 0 !important; max-height: none !important; width: min(23rem, 60vw) !important;
        border-radius: 0 !important; border-top: none !important; border-bottom: none !important; border-right: none !important; padding: 0.6rem 0.7rem !important; }
      body.panel-open #zoom-controls, body.panel-open #minimap, body.panel-open #dock { display: none !important; }
      #zoom-controls { left: 0.5rem !important; right: auto !important; bottom: 0.5rem !important; }
      #zoom-controls #snap-btn, #zoom-controls #labels-btn, #zoom-controls #minimap-btn, #zoom-controls > span { display: none !important; }

    .nap-cordoalha .nap-strand { position: absolute; left: -30px; right: -30px; top: -20px; height: 5px; border-radius: 3px; background: #111827; box-shadow: 0 7px 0 -2px #1f2937; }
    .nap-cordoalha .nap-hanger { position: absolute; top: -22px; width: 10px; height: 26px; border-radius: 3px; background: #374151; border: 1px solid #111827; }
    .nap-cordoalha .nap-grille { position: absolute; top: 10%; bottom: 10%; width: 14px; border-radius: 4px;
      background: repeating-linear-gradient(180deg, #0f2a52 0 3px, #16365f 3px 7px); }
    .nap-grille-l { left: 4px; } .nap-grille-r { right: 4px; }
    .nap-split { position: absolute; z-index: 6; pointer-events: none; bottom: -10px; width: 3px; height: 26px; background: #facc15; border-radius: 2px; opacity: .85; }
    /* Janela "Novo projeto" */
    #new-project { position: fixed; inset: 0; z-index: 60; background: rgba(2, 6, 23, 0.6); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    #new-project.hidden { display: none; }
    .np-card { width: 100%; max-width: 24rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.9rem; padding: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .np-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .np-head h2 { font-size: 15px; font-weight: 800; color: #f1f5f9; }
    .np-list { display: grid; gap: 0.5rem; }
    .np-opt { display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; text-align: left; padding: 0.65rem 0.8rem; border-radius: 0.65rem;
      background: #020617; border: 1px solid #1e293b; transition: background .15s, border-color .15s; }
    .np-opt:hover { background: #1e293b; border-color: #475569; }
    .np-opt.np-main { border: 2px solid #8b5cf6; }
    .np-opt i { font-size: 1.1rem; width: 1.3rem; text-align: center; margin-top: 0.1rem; }
    .np-opt b { display: block; font-size: 13px; color: #f1f5f9; }
    .np-opt span { display: block; font-size: 11px; color: #94a3b8; line-height: 1.35; margin-top: 0.1rem; }
    html.light .np-card { background: #ffffff; border-color: #c3ccd8; box-shadow: 0 20px 50px rgba(15,23,42,.2); }
    html.light .np-head h2, html.light .np-opt b { color: #0f172a; }
    html.light .np-opt { background: #f8fafc; border-color: #d5dde7; }
    html.light .np-opt:hover { background: #eef2f7; border-color: #94a3b8; }
    html.light .np-opt span { color: #475569; }
    html.light .np-opt.np-main { border-color: #7c3aed; }
    /* Níveis padrão recolhíveis */
    details.niveis > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.35rem 0; }
    details.niveis > summary::-webkit-details-marker { display: none; }
    details.niveis > summary .chev { transition: transform .15s; margin-right: 0.35rem; font-size: 9px; }
    details.niveis[open] > summary .chev { transform: rotate(90deg); }
    @media (max-height: 560px) { #status-bar { height: 1.5rem; } #dock-hint { visibility: hidden; } }
    /* Telas estreitas: título em 2 linhas e, se ainda faltar espaço, os botões do topo quebram para a linha de baixo (nada fica fora da tela) */
    @media (max-width: 1100px) {
      header { height: auto !important; min-height: 2.75rem; column-gap: 0.75rem !important; padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
      header > div:last-child { flex: 1 1 0; min-width: 0; flex-wrap: wrap; row-gap: 0.35rem; }
      header > div:first-child { flex-shrink: 0; }
      header h1 { font-size: 11.5px; white-space: normal !important; width: min-content; line-height: 1.15; }
      #mode-switch button { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
    }
    .canvas-grid {
      background-size: 24px 24px;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }
    .node-selected {
      outline: 2px solid #38bdf8;
      outline-offset: 3px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .node-target {
      outline: 2px dashed #34d399;
      outline-offset: 3px;
    }
    /* Portas (conectores F clicáveis) */
    .port {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      border: 2px solid;
      cursor: crosshair;
      z-index: 5;
      padding: 0;
      transition: transform .12s, box-shadow .12s;
    }
    .port:hover { transform: scale(1.35); }
    /* Alça de rotação dos passivos */
    .rot-handle {
      position: absolute; left: 50%; top: -34px; width: 22px; height: 22px; margin-left: -11px;
      border-radius: 9999px; background: #0ea5e9; border: 2px solid #e0f2fe; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 10px;
      cursor: grab; z-index: 6; box-shadow: 0 0 10px rgba(56, 189, 248, .7);
    }
    .rot-handle::after {
      content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 12px; margin-left: -1px; background: #38bdf8;
    }
    .rot-handle:active { cursor: grabbing; }
    .port-free { background: #022c22; border-color: #34d399; }
    .port-free:hover { box-shadow: 0 0 10px rgba(52, 211, 153, .8); }
    .port-used { background: #0ea5e9; border-color: #e0f2fe; cursor: pointer; }
    .port-in   { background: #1e293b; border-color: #94a3b8; cursor: pointer; }
    .port-in.port-open { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, .8); cursor: crosshair; }
    .equip-img { filter: drop-shadow(0 0 1px rgba(203,213,225,.55)) drop-shadow(0 1px 2px rgba(0,0,0,.4)); user-select: none; -webkit-user-drag: none; }
    html.light .equip-img { filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .port-warn { background: #451a03; border-color: #f59e0b; animation: portwarn 1.2s ease-in-out infinite; }
    @keyframes portwarn { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .8); } 50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); } }
    .port-src  { background: #f59e0b; border-color: #ffffff; box-shadow: 0 0 12px rgba(245, 158, 11, .9); }

    /* Estilização de Impressão */
    @media print {
      body * {
        visibility: hidden;
      }
      #report-modal, #report-modal * {
        visibility: visible;
      }
      #report-modal {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
      .report-map { break-inside: avoid; }
    }
  </style>
</head>

    let currentActions = [];        // ações "Aplicar" das sugestões visíveis no painel

    let selection = new Set();      // seleção múltipla (2+ componentes)
    let marquee = null;             // seleção por área em andamento
    let pinch = null;               // zoom com dois dedos
    let mmDrag = false;             // arrasto no minimapa
    let mm = null;                  // transformação atual do minimapa
    let clipboard = null, pasteCount = 0;
    let snapOn = true, showMinimap = false, showCableLabels = true, theme = 'dark';
    const GRID = 12;
    let history = [], histIndex = -1, commitTimer = null, restoring = false;
    const AUTOSAVE_KEY = 'simuladorHFC.autosave.v1';
    let autosaveKey = AUTOSAVE_KEY;   // cada HTML salvo com projeto tem o seu próprio salvamento automático
    const PREFS_KEY = 'simuladorHFC.prefs.v1';
    let uidSeq = 0;
    const uid = p => `${p}_${Date.now().toString(36)}_${(++uidSeq).toString(36)}${Math.floor(Math.random() * 1000)}`;
    let pan = null;                 // arrasto do fundo (mover o mapa)
    const ZOOM_MIN = 0.25, ZOOM_MAX = 3;

      'RG6 Preto': { CA: 0.16, CB: 0.05, RX: 0.16, TX: 0.02 },
      'RG11':      { CA: 0.10, CB: 0.03, RX: 0.10, TX: 0.01 }

    const passiveLosses = {
      'div12':  { out: 4.0 },
      'div13':  { out: 6.0 },
      'div13d': { outMain: 4.0, outSec: 7.5 },
      'div14':  { out: 7.5 },
      'div18':  { out: 11.0 },
      'dc6':    { tap: 6.0,  out: 2.5 },
      'dc9':    { tap: 9.0,  out: 1.5 },

        </div>`;
    }
    // Desenho de um cabo óptico (mesmo visual no mapa, no dock e no relatório)
    // Wi-Fi: pontilhado azul na rede 5 GHz e amarelo na rede 2,4 GHz
    const WIFI_COL = { '5': { color: '#60a5fa', light: '#2563eb' }, '2.4': { color: '#facc15', light: '#ca8a04' } };
    function gponStrokeParts(type, light, band) {
      let g = GPON_CABLES[type] || GPON_CABLES.Drop;

      const parts = [];
      if (g.halo) parts.push({ stroke: g.halo, w: g.width + 6, op: light ? 0.30 : 0.22 });            // brilho do transparente
      if (g.outline) parts.push({ stroke: light ? g.outline : '#94a3b8', w: g.width + 2.5, op: 1 });   // contorno do branco
      parts.push({ stroke: light ? g.light : g.color, w: g.width, op: 1, dash: g.dash });

    }
    const gponPathSVG = (type, d, light, band) => gponStrokeParts(type, light, band).map(pt =>

    const isGponCable = t => !!GPON_CABLES[t];
    const fmt2 = v => (v == null || isNaN(v)) ? '--' : Number(v).toFixed(2);

    // Atenuação de uma ligação óptica: drop = metros de fibra + conectores; cordão = perda fixa
    function gponCableLoss(c) {
      if (c.cableType === 'Cordão óptico') return { min: GPON.cordao.min, max: GPON.cordao.max };
      const km = (Number(c.length) || 0) / 1000, k = Math.max(0, Math.round(Number(c.conectores) || 0));

    function gponCableLabel(c) {

    }
    function gponMetrics(n) {
      const lv = n.lv, L = GPON_LIMITS;
      return [
        { key: 'min', short: 'MÍN', label: 'MÍN (perda mínima)', val: lv ? lv.min : null, min: L.min, max: L.max, unit: 'dBm' },
        { key: 'max', short: 'MÁX', label: 'MÁX (perda máxima)', val: lv ? lv.max : null, min: L.min, max: L.max, unit: 'dBm' }
      ];
    }
    function diagnoseGpon(n) {
      const metrics = gponMetrics(n), L = GPON_LIMITS;
      if (!n.lv) {
        metrics.forEach(m => m.st = 'none');
        return { status: 'none', metrics, notes: ['Sem caminho de sinal até o DIO/NAP. Ligue esta ONT a uma porta do DIO/NAP ou do divisor.'], suggestions: [], summary: '' };
      }
      if (metrics.some(m => m.val == null)) {
        metrics.forEach(m => m.st = 'none');
        return { status: 'none', metrics, notes: ['Potência do DIO/NAP ainda não informada: preencha no painel da origem (ex.: −20 dBm).'], suggestions: [], summary: '' };
      }
      let status = 'ok';
      metrics.forEach(m => { m.st = evalMetric(m.val, m.min, m.max, m.warnBelow); if (ST_RANK[m.st] > ST_RANK[status]) status = m.st; });
      const notes = [], best = n.lv.min, worst = n.lv.max;
      if (worst < L.min) notes.push(`MÁX (perda máxima) em ${fmt(worst)} dBm: ${fmtDb(L.min - worst)} dB abaixo do limite (${L.min} dBm).`);
      if (best < L.min) notes.push(`Até com a perda mínima o sinal fica em ${fmt(best)} dBm, abaixo de ${L.min} dBm.`);
      if (best > L.max) notes.push(`MÍN (perda mínima) em ${fmt(best)} dBm: acima de ${L.max} dBm, risco de saturar a ONT.`);
      let summary = '';
      if (worst < L.min) {
        const need = L.min - worst;
        summary = `Para ficar dentro da faixa (${L.max} a ${L.min} dBm) no pior caso é preciso tirar ${fmtDb(need)} dB do caminho: use menos conectores (cada um soma 0,5 a 0,8 dB), encurte o drop, evite divisor a mais ou confira a potência na porta da CTO.`;
      } else if (best > L.max) {
        summary = `Sinal forte demais: acrescente pelo menos ${fmtDb(best - L.max)} dB de atenuação (atenuador óptico) antes da ONT.`;

      return { status, metrics, notes, suggestions: [], summary };

    // --- Desenhos do modo GPON ---

    function gponCablePanelHTML(c) {

    // --- Edições do modo GPON ---
    function updateCtoPot(val, key) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n)) return;
      const v = parseFloat(String(val).replace(',', '.'));
      n.signals = { ...(n.signals || {}), [key === 'pot2' ? 'pot2' : 'pot']: isNaN(v) ? '' : v };
      refresh();
    }
    function swapDCPorts(id) {
      const n = byId(id);
      if (!n || !isDC(n.type)) return;
      const out = portConn(n.id, 'out'), tap = portConn(n.id, 'tap');
      if (!out && !tap) { showToast('Ligue um cabo no DC antes de inverter.', 'info'); return; }
      if (out) out.fromPort = 'tap';
      if (tap) tap.fromPort = 'out';
      refresh();
      showToast(`${n.name}: saídas OUT e TAP invertidas.`, 'success');
    }
    function updateNapMount(mt) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n) || isDIO(n)) return;
      n.mount = mt === 'cordoalha' ? 'cordoalha' : 'poste';
      refresh();
    }
    // Etiquetas: DIO sempre começa com MM; NAP nunca começa com MM
    const NAP_TAG_PADRAO = 'SNCAB 001.01.01', DIO_TAG_PADRAO = 'MM.A195.03.03';
    const NAP_TAG_ANTIGA = ['MMS 010101', 'MMS 010102', 'MMS 010103', 'MMS 010104'];   // padrões da 0.37 (trocados ao abrir)
    function nextTag(tag) {
      const m = /(\d+)(\D*)$/.exec(tag || '');
      if (!m) return tag ? tag + ' 2' : '';
      const nx = String(Number(m[1]) + 1).padStart(m[1].length, '0');
      return tag.slice(0, m.index) + nx + m[2];
    }
    // NAP já nasce com etiqueta; a NAP 16 com as duas (a segunda na sequência, editável)
    function ensureNapTags(n) {
      if (isDIO(n)) { if (!napTag(n, 0)) n.tags = [DIO_TAG_PADRAO]; return; }
      if (!isCTO(n)) return;
      const t = (n.tags || []).slice(0, 2);
      if (!t[0]) t[0] = NAP_TAG_PADRAO;
      if (tapVias(n) === 16 && !t[1]) t[1] = nextTag(t[0]);
      n.tags = tapVias(n) === 16 ? t.slice(0, 2) : t.slice(0, 1).concat(t[1] ? [t[1]] : []);
    }
    function updateNapTag(i, val) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n)) return;
      const t = (n.tags || []).slice(0, 2), old0 = t[0];
      t[i] = String(val || '').trim().slice(0, 24);
      if (isDIO(n) && t[i] && !/^MM/i.test(t[i])) { showToast('A etiqueta do DIO começa sempre com MM (ex.: MM.A195.03.03).', 'warning'); renderProperties(); return; }
      if (!isDIO(n) && t[i] && /^MM/i.test(t[i])) { showToast('Etiqueta de NAP não começa com MM (MM é do DIO). Ex.: SNCAB 001.01.04.', 'warning'); renderProperties(); return; }
      if (isDIO(n)) t[i] = t[i].toUpperCase();
      // mudou a 1ª: se a 2ª estava vazia ou seguia a sequência, acompanha (se foi editada à mão, fica como está)
      if (i === 0 && tapVias(n) === 16 && (!t[1] || t[1] === nextTag(old0))) t[1] = nextTag(t[0]);
      n.tags = t;
      refresh();
    }
    // DIO 12 portas, NAP MDU 8 portas, NAP 8 ou NAP 16 (= 2 NAPs de 8)
    function updateCtoKind(org, v) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n)) return;
      if (org === 'dio') v = DIO_PORTAS;
      if (org === 'mdu') v = MDU_PORTAS;
      const cs = connections.filter(c => c.from === n.id);
      if (cs.length > v) { showToast(`Há ${cs.length} fibras ligadas: escolha uma origem com pelo menos ${cs.length} portas.`, 'warning'); return; }
      const wasDefault = isDefaultCtoName(n.name);
      const eraDio = isDIO(n);
      if (org === 'dio' || org === 'mdu') n.org = org; else delete n.org;
      if (eraDio !== isDIO(n)) n.tags = [];   // DIO e NAP têm padrões de etiqueta diferentes
      updateCtoVias(v, true);
      ensureNapTags(n);
      if (wasDefault) n.name = ctoName(v, n.org);
      if (v !== 16 && n.signals) delete n.signals.pot2;
      refresh();
    }
    function updateCtoTec(val) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n)) return;
      n.tec = val === 'XGS-PON' ? 'XGS-PON' : 'GPON';
      refresh();
    }
    function updateCtoVias(v, quiet) {
      const n = byId(selectedNodeId);
      if (!n || !isCTO(n) || !(isDioAzul(n) ? v === DIO_PORTAS : isMDU(n) ? v === MDU_PORTAS : CTO_VIAS.includes(v))) return;
      const cs = connections.filter(c => c.from === n.id);
      if (cs.length > v) { showToast(`Há ${cs.length} fibras ligadas: escolha uma origem com pelo menos ${cs.length} portas.`, 'warning'); return; }
      n.vias = v;
      cs.forEach(c => { if (Number(String(c.fromPort).replace('out', '')) > v) c.fromPort = null; });
      const usedP = new Set(cs.filter(c => c.fromPort).map(c => c.fromPort));
      cs.filter(c => !c.fromPort).forEach(c => { for (let i = 1; i <= v; i++) if (!usedP.has('out' + i)) { c.fromPort = 'out' + i; usedP.add(c.fromPort); break; } });
      if (isDefaultCtoName(n.name)) n.name = ctoName(v, n.org);
      if (!quiet) refresh();
    }
    function updateCableConectores(val) {
      const c = connById(selectedConnectionId);
      if (!c) return;
      if (isFiberCable(c.cableType)) { showToast('Cabo de fibra: sempre 2 conectores (1 em cada ponta).', 'info'); renderProperties(); return; }
      const v = Math.round(parseFloat(String(val).replace(',', '.')));
      c.conectores = isNaN(v) || v < 0 ? 0 : Math.min(v, 20);
      refresh();
    }

    // --- Troca entre HFC e GPON (cada tipo guarda o seu último projeto) ---
    function syncModeUI() {
      const g = isGpon();
      const on = 'bg-sky-600 text-white', off = 'bg-slate-800 text-slate-300 hover:bg-slate-700';
      const bh = document.getElementById('mode-hfc'), bg = document.getElementById('mode-gpon');
      if (bh) bh.className = `px-2.5 py-1.5 transition ${g ? off : on}`;
      if (bg) bg.className = `px-2.5 py-1.5 transition border-l border-slate-700 ${g ? 'bg-emerald-600 text-white' : off}`;
      const sub = document.getElementById('brand-mode');
      if (sub) sub.textContent = g ? 'Projeto de Fibra Óptica GPON / XGS-PON' : 'Projeto de TV & Banda Larga Coaxial';
      if (g && !isGponCable(activeCableType)) activeCableType = 'Drop';
      if (!g && isGponCable(activeCableType)) activeCableType = 'RG6';
      renderDock();
    }
    function setModeQuiet(m) {
      projectMode = m === 'gpon' ? 'gpon' : 'hfc';
      syncModeUI();
    }
    function setProjectMode(m) {
      m = m === 'gpon' ? 'gpon' : 'hfc';
      if (m === projectMode) return;
      flushCommit();
      try { localStorage.setItem(autosaveKey + '.modo.' + projectMode, stateJSON()); } catch (err) { /* ignora */ }
      let st = null;
      try { st = JSON.parse(localStorage.getItem(autosaveKey + '.modo.' + m) || 'null'); } catch (err) { st = null; }
      setActiveScenario(null);
      if (st && Array.isArray(st.nodes) && st.nodes.length && (st.mode === 'gpon' ? 'gpon' : 'hfc') === m) {
        applyLoadedState(st);
      } else if (m === 'gpon') loadScenarioGpon1();
      else loadScenario1();
      showToast(m === 'gpon' ? 'Modo GPON / XGS-PON: DIO/NAP, fibras, divisor 1:2, PTO, cordão óptico, ONT e pontos de TV (Box TV e Sound Box).' : 'Modo HFC: rede coaxial (TAP/DG, passivos, RG6/RG11). Para migrar a internet para GPON, use as peças "Fibra · migração GPON" e a ONT.', 'info');
    }

        if (c.cableType === 'Cordão óptico') { cordoes++; cordaoM += Number(c.length || 0); }
        else { metros[metros[c.cableType] != null ? c.cableType : 'Drop'] += Number(c.length || 0); conectores += Math.max(0, Math.round(Number(c.conectores) || 0)); }

        : `<p class="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800 rounded-xl p-3"><i class="fa-solid fa-circle-check mr-1"></i> Todas as ONTs estão dentro do padrão.</p>`;
      const L = GPON_LIMITS;
      const card = (label, val, cls) => `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block font-semibold">${label}</span><strong class="text-lg font-mono ${cls || 'text-slate-100'}">${val}</strong></div>`;
      const modal = document.createElement('div');
      modal.id = 'report-modal';

      modal.innerHTML = `
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full p-6 shadow-2xl space-y-6 my-8">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">

      const m = /^(tap|cto)(\d+)$/.exec(type);
      if (type === 'dg') updateOriginType('dg', 4);
      else if (type === 'dio12' || type === 'dio4') updateCtoKind('dio', DIO_PORTAS);
      else if (type === 'mdu8' || type === 'dio8') updateCtoKind('mdu', MDU_PORTAS);
      else if (/^ctoc\d+$/.test(type)) { org.mount = 'cordoalha'; updateCtoKind('nap', Number(type.slice(4))); }
      else if (m && m[1] === 'cto') { org.mount = 'poste'; updateCtoKind('nap', Number(m[2])); }
      else if (m) updateOriginType('tap', Number(m[2]));
      if (originKey(org) === type) showToast(`${before} trocado por ${org.name}. Os cabos continuam ligados.`, 'success');
      else render();
      return true;
    }
    // Modelo da ONT: item do dock → valor de n.model ('' = genérica)
    const ONT_ITEM = { ontzte: 'f8748q' };   // ONT/ONU agora abre o submenu de modelos (openGwMenu)
    const selectedOnt = () => { if (selection.size > 1 || !selectedNodeId) return null; const n = byId(selectedNodeId); return n && n.type === 'ont' ? n : null; };
    function setOntModel(id, model) {
      const n = byId(id);
      if (!n || n.type !== 'ont') return;
      if ((n.model || '') === (model || '')) { showToast('Esse já é o modelo da ONT selecionada.', 'info'); return; }
      const nLan = gwSpeeds({ type: 'ont', model }).length, lost = connections.find(c => c.from === n.id && /^lan\d+$/.test(c.fromPort) && Number(c.fromPort.slice(3)) > nLan);
      if (lost) { showToast(`${byId(lost.to) ? byId(lost.to).name : 'Um aparelho'} está na ${lost.fromPort.toUpperCase().replace('LAN', 'LAN ')}, que não existe ${model ? 'na ' + ONT_MODELS[model].label : 'na ONT genérica'}. Mude de porta antes.`, 'warning'); return; }
      if (model) n.model = model; else delete n.model;
      refresh();
      showToast(`${n.name}: ${model ? ONT_MODELS[model].label + ' (' + ONT_MODELS[model].tec + ')' : 'ONT genérica'}. Os cabos continuam ligados.`, 'success');
    }
    // Atualiza o dock só quando muda o item atual (passivo, cabo ou origem)
    let dockSelKey = '';
    function syncDockSelection() {
      const n = swapTarget(), c = selectedCable(), o = projectOrigin();
      const so = selectedOnt();
      const key = [so ? so.id + ':' + (so.model || '') : '', n ? n.id + ':' + n.type : '', c ? c.id + ':' + c.cableType : '', o ? originKey(o) : '', isGpon() ? '' : projectTvKind() || ''].join('|');
      if (key === dockSelKey) return;
      dockSelKey = key;
      renderDock();
    }

    function thumbHTML(item) {
      if (item.cable && GPON_CABLES[item.cable]) {
        return `<svg viewBox="0 0 64 40" class="w-16 h-10">${gponPathSVG(item.cable, 'M 4 32 C 24 32, 26 8, 60 8', theme === 'light')}<circle cx="4" cy="32" r="4" fill="#22c55e"/><circle cx="60" cy="8" r="4" fill="#22c55e"/></svg>`;
      }
      if (item.cable) {
        const w = item.cable === 'RG11' ? 6 : 4;
        return `<svg viewBox="0 0 64 40" class="w-16 h-10"><path d="M 4 32 C 24 32, 26 8, 60 8" fill="none" stroke="${CABLE_STYLE[item.cable]}" stroke-width="${w}" stroke-linecap="round"/><circle cx="4" cy="32" r="4" fill="#cbd5e1"/><circle cx="60" cy="8" r="4" fill="#cbd5e1"/></svg>`;
      }
      const d = NODE_DEFS[item.type];
      if (d) {
        const h = d.vbH * d.w / d.vbW, k = Math.min(42 / h, 84 / d.w);
        const svg = passiveSVG({ type: item.type });
        return `<div style="width:${d.w * k}px;height:${h * k}px"><div style="width:${d.w}px;transform:scale(${k});transform-origin:0 0;pointer-events:none">${svg}</div></div>`;
      }
      if (item.type === 'dio12') return `<svg viewBox="0 0 48 40" class="w-12 h-10"><rect x="13" y="1" width="23" height="38" rx="3" fill="#23407a" stroke="#0f1f45" stroke-width="1.5"/><rect x="20" y="6" width="12" height="4" rx="1" fill="#f8fafc"/>${[0,1,2,3].map(i => `<circle cx="13" cy="${10 + i * 6}" r="2.4" fill="#ef4444"/>`).join('')}<circle cx="13" cy="35" r="2.4" fill="#94a3b8"/>${[0,1,2,3].map(i => `<rect x="${18 + i * 4.4}" y="35" width="3.2" height="4" fill="#22c55e"/>`).join('')}</svg>`;
      if (item.type === 'mdu8' || item.type === 'dio8') return `<svg viewBox="0 0 48 40" class="w-12 h-10"><rect x="12" y="1" width="24" height="32" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><rect x="15" y="6" width="18" height="8" rx="1" fill="#fbbf24"/><rect x="13" y="33" width="4" height="6" fill="#ef4444"/>${[0,1,2,3].map(i => `<rect x="${18.5 + i * 4.4}" y="33" width="3.4" height="6" fill="#22c55e"/>`).join('')}</svg>`;
      if (/^ctoc\d+$/.test(item.type)) return `<svg viewBox="0 0 48 40" class="w-12 h-10"><rect x="0" y="5" width="48" height="2.5" rx="1" fill="#9ca3af"/><rect x="13" y="4" width="3" height="9" fill="#6b7280"/><rect x="32" y="4" width="3" height="9" fill="#6b7280"/><rect x="5" y="12" width="38" height="20" rx="4" fill="#2459a3" stroke="#0f2a52" stroke-width="1.5"/><rect x="7" y="15" width="4" height="14" rx="1" fill="#0f2a52"/><rect x="37" y="15" width="4" height="14" rx="1" fill="#0f2a52"/><rect x="15" y="19" width="18" height="5" rx="1" fill="#facc15"/></svg>`;
      if (String(item.type).startsWith('cto')) return `<svg viewBox="0 0 48 40" class="w-12 h-10"><rect x="7" y="0" width="7" height="40" rx="2" fill="#78716c"/><rect x="4" y="18" width="16" height="3" fill="#cbd5e1"/><rect x="14" y="3" width="24" height="34" rx="4" fill="#2459a3" stroke="#0f2a52" stroke-width="1.5"/><rect x="17" y="7" width="18" height="5" rx="1" fill="#facc15"/><g fill="#1b4380">${[0,1,2,3].map(i => `<rect x="${18 + i * 4.5}" y="16" width="2" height="15"/>`).join('')}</g></svg>`;
      if (String(item.type).startsWith('cto') || isOptOriginItem(item.type)) return `<div class="w-10 h-10 rounded-lg bg-emerald-950 border border-emerald-600/50 flex items-center justify-center text-emerald-400 text-base"><i class="fa-solid fa-box-archive"></i></div>`;
      if (item.type === 'dg') return `<div class="w-10 h-10 rounded-lg bg-violet-950 border border-violet-600/50 flex items-center justify-center text-violet-400 text-base"><i class="fa-solid fa-server"></i></div>`;
      if (String(item.type).startsWith('tap')) return `<div class="w-10 h-10 rounded-lg bg-sky-950 border border-sky-600/50 flex items-center justify-center text-sky-400 text-base"><i class="fa-solid fa-tower-cell"></i></div>`;
      if (item.type === 'decoder') return thumbHTML({ type: 'tv' });
      if (item.type === 'ontzte') return `<img src="${ONT_MODELS.f8748q.img}" alt="" class="h-10 w-6 object-contain">`;
      if (NET_DEV[item.type]) return `<div class="w-12 h-10 flex items-center justify-center">${netDevSVG(item.type, 46)}</div>`;
      const e = EQUIP[item.type];
      return `<div class="w-10 h-10 rounded-lg bg-slate-950 border border-slate-700 flex items-center justify-center ${e.color} text-lg">${equipIcon(item.type, { img: 'w-9 h-8 object-contain' })}</div>`;
    }

    function renderDock() {
      const cats = document.getElementById('dock-cats');
      const items = document.getElementById('dock-items');
      if (!cats || !items) return;

      const open = !!curPalette().find(c => c.id === activeCategory);
      if (!open) activeCategory = null;
      const footer = document.getElementById('dock');
      footer.classList.toggle('h-44', open);
      items.classList.toggle('hidden', !open);
      cats.className = open
        ? 'w-56 shrink-0 border-r border-slate-800 p-2 grid grid-cols-2 gap-1.5 bg-slate-950/40'
        : 'shrink-0 p-1.5 grid grid-cols-4 gap-1.5';
      cats.innerHTML = curPalette().map(c => `
        <button data-cat="${c.id}" onclick="setCategory(this.dataset.cat)" title="${c.id === activeCategory ? 'Clique de novo para recolher' : 'Mostrar ' + c.label}" class="rounded-lg border flex ${open ? 'flex-col gap-1' : 'flex-row gap-2 px-3 py-1.5'} items-center justify-center transition ${c.id === activeCategory ? 'bg-sky-950/70 border-sky-500 text-sky-300' : 'bg-slate-800/60 border-slate-700 text-slate-400 hover:bg-slate-700/70 hover:text-slate-200'}">
          <i class="fa-solid ${c.icon} ${open ? 'text-base' : 'text-xs'}"></i>
          <span class="text-[10px] font-bold uppercase tracking-wide">${c.label}</span>
        </button>`).join('');

      items.innerHTML = '';
      if (!open) { setHint(''); return; }
      const cat = curPalette().find(c => c.id === activeCategory);
      cat.groups.forEach(g => {
        const box = document.createElement('div');
        box.className = 'flex flex-col shrink-0';
        box.innerHTML = `<span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">${g.label}</span>`;
        const row = document.createElement('div');
        row.className = 'flex-1 flex gap-1.5';
        g.items.forEach(item => {
          const selNode = !item.cable && canSwap(item.type) ? swapTarget() : null;
          const selConn = item.cable ? selectedCable() : null;
          const org = !item.cable && isOriginItem(item.type) ? originFor(item.type) : null;
          const selOnt = !item.cable && ONT_ITEM[item.type] != null ? selectedOnt() : null;
          const current = (!!selOnt && (selOnt.model || '') === ONT_ITEM[item.type]) || (!!selNode && selNode.type === item.type) || (!!selConn && selConn.cableType === item.cable) || (!!org && originKey(org) === item.type);
          const active = (item.cable && item.cable === activeCableType && !selConn) || current;
          const blockedTv = !isGpon() && !item.cable && TV_KIND[item.type] && projectTvKind() && projectTvKind() !== TV_KIND[item.type];
          const b = document.createElement('button');
          b.className = `w-24 shrink-0 rounded-lg border px-1 py-1.5 flex flex-col items-center justify-between gap-1 transition ${active ? 'bg-sky-950/70 border-sky-500 ring-1 ring-sky-500' : 'bg-slate-800/70 border-slate-700 hover:bg-slate-700/80 hover:border-slate-500'}`;
          b.innerHTML = `
            <div class="flex-1 flex items-center justify-center">${thumbHTML(item)}</div>
            <span class="text-[10px] font-semibold text-slate-200 leading-tight text-center">${item.name}</span>
            ${(() => { const t = current ? (org ? '✓ no projeto' : '✓ selecionado') : blockedTv ? 'TVs via ' + (projectTvKind() === 'hfc' ? 'HFC' : 'IP') + ' no projeto' : item.tag; return t ? `<span class="text-[10px] font-mono text-sky-300 bg-slate-950 px-1 rounded">${t}</span>` : ''; })()}`;
          if (blockedTv) { b.style.opacity = '0.4'; b.title = 'As TVs do projeto são todas via HFC ou todas via IP'; }
          if (current) b.dataset.current = '1';
          if (selNode) b.title = current ? 'Este é o passivo selecionado no projeto' : `Trocar o ${selNode.name} por ${item.name}`;
          if (selConn) b.title = current ? 'Este é o tipo do cabo selecionado' : `Trocar ${cableItemName(selConn.cableType)} por ${item.name}`;
          if (selOnt) b.title = current ? 'Este é o modelo da ONT selecionada' : `Trocar o modelo da ${selOnt.name} para ${item.name}`;
          if (org) b.title = current ? 'Esta é a origem do projeto' : `Trocar ${org.name} por ${item.name}`;
          b.onmouseenter = () => setHint(item.info);
          b.onmouseleave = () => setHint('');
          if (item.cable) {
            b.onclick = () => {
              if (swapSelectedCable(item.cable)) return;
              if (isNetCable(item.cable)) { showToast(`Para ligar um ponto de TV: clique numa porta LAN (cabo) ou no Wi-Fi ${GW().da} e depois no Box TV ou na Sound Box. O cabo certo é escolhido sozinho.`, 'info'); return; }
              setCableTool(item.cable);
            };
          } else {
            b.onclick = () => {
              if (selOnt) { setOntModel(selOnt.id, ONT_ITEM[item.type]); return; }
              if (item.type === 'decoder') { openDecoderMenu(b); return; }
              if (TV_MODELS_BY[item.type] && !blockedTv) { openModelMenu(item.type, b); return; }
              if (item.type === 'ont' || item.type === 'modem') { openGwMenu(item.type, b); return; }
              if (canSwap(item.type) && swapSelectedPassive(item.type)) return;
              if (isOriginItem(item.type) && swapOrigin(item.type)) return;
              addNode(item.type);
              if (isIso(item.type)) showToast(item.type === 'iso'
                ? 'Arraste o CABLE ISOLATOR até um cabo RG6 Preto ou RG11 para ligar sozinho.'
                : 'Arraste o MINI ISOLATOR até um cabo RG6 Branco que chega num EMTA, Decoder ou Box TV.', 'info');
            };
            b.draggable = item.type !== 'decoder';   // o decoder abre a lista de escolha
            b.ondragstart = (e) => { e.dataTransfer.setData('text/plain', item.type); e.dataTransfer.effectAllowed = 'copy'; };
          }
          row.appendChild(b);
        });
        box.appendChild(row);
        items.appendChild(box);
      });
      setHint('');
      const cur = items.querySelector('[data-current]');
      if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // "Decoder 1", "Decoder 2"... usa o menor número ainda livre
    function nextNumberedName(base) {
      const used = new Set(nodes.map(n => n.name));
