      } else if (type === 'tv' || type === 'box') {
        name = nextNumberedName(EQUIP[type].name);
      } else if (EQUIP[type]) {
        name = EQUIP[type].name;
      }

      // Evita empilhar novos componentes exatamente no mesmo lugar
      const offset = (nodes.length % 8) * 22;
      const napTags = model === 'cto' ? (org === 'dio' || org === 'mdu' ? [DIO_TAG_PADRAO] : vias === 16 ? [NAP_TAG_PADRAO, nextTag(NAP_TAG_PADRAO)] : [NAP_TAG_PADRAO]) : null;
      nodes.push({ id, type, name, ...(napTags ? { tags: napTags } : {}), ...(vias ? { vias } : {}), ...(model ? { model } : {}), ...(org ? { org } : {}), ...(mount ? { mount } : {}), x: x != null ? Math.max(0, x) : Math.max(0, (180 + offset - view.x) / view.zoom), y: y != null ? Math.max(0, y) : Math.max(0, (120 + offset - view.y) / view.zoom), signals: initSignals });
      selection.clear();
      selectedNodeId = id;
      selectedConnectionId = null;
      refresh();
    }

    // --- CONEXÃO POR PORTAS ---
    function handlePortClick(nodeId, portId) {
      const node = byId(nodeId);
      const port = portInfo(node, portId);
      if (!node || !port) return;

      if (linkSource && linkSource.nodeId === nodeId && linkSource.portId === portId) {
        cancelLink(true);
        return;
      }
      const existing = portConn(nodeId, portId);
      if (existing && !port.multi) {
        linkSource = null;
        selectConnection(existing.id);
        return;
      }
      linkSource = { nodeId, portId };
      selection.clear();
      selectedNodeId = nodeId;
      selectedConnectionId = null;
      render();
      showToast(`Origem: ${node.name} · ${port.label}. Clique no componente de destino.`, 'info');
    }

    function startLinkFromPanel(portId) {
      if (selectedNodeId) handlePortClick(selectedNodeId, portId);
    }

    function handleInputClick(nodeId) {
      if (linkSource) { tryConnect(nodeId); return; }
      const c = inputConn(nodeId);
      if (c) selectConnection(c.id);
      else {
        selectNode(nodeId);
        showToast('Para ligar um cabo, clique primeiro em uma porta de saída (verde).', 'info');
      }
    }

    function handleNodeClick(id) {
      if (linkSource) {
        if (linkSource.nodeId === id) cancelLink(true);
        else tryConnect(id);
        return;
      }
      selectNode(id);
    }

    function tryConnect(targetId) {
      const target = byId(targetId);
      if (!target) return;
      const problem = targetProblem(target);
      if (problem) { showToast(problem, 'warning'); return; }

      if (isGateway(byId(linkSource.nodeId))) { connectNet(byId(linkSource.nodeId), linkSource.portId, target); return; }
      // A ligação só é criada depois que a distância é informada no pop-up
      let cableType = activeCableType;
      const srcN = byId(linkSource.nodeId), gp = optCtx(srcN);
      if (isNetCable(cableType)) cableType = gp ? 'Drop' : 'RG6';
      if (gp && !isGponCable(cableType)) cableType = 'Drop';
      if (!gp && isGponCable(cableType)) cableType = 'RG6';
      if (!gp && srcN && srcN.type === 'tap' && !isDG(srcN) && cableType === 'RG6') {
        cableType = 'RG6 Preto';
        showToast('Do TAP Rede externa sai cabo drop: o cabo será RG6 Preto, com CABLE ISOLATOR automático.', 'info');
      }
      if (isDG(byId(linkSource.nodeId)) && cableType !== DG_CABLE) {
        cableType = DG_CABLE;
        showToast('No DG só é permitido cabo RG6 Branco: o cabo será RG6 Branco.', 'warning');
      }
      if (gp && cableType === 'Cordão óptico') {   // cordão óptico: tamanho fixo, liga direto
        const conn = { id: uid('conn'), from: linkSource.nodeId, fromPort: linkSource.portId, to: targetId, cableType, length: CORDAO_M };
        linkSource = null;
        connections.push(conn);
        selectedConnectionId = conn.id; selectedNodeId = null;
        refresh();
        showToast('Cordão óptico de 1,5 m ligado (perda fixa de 1,0 a 1,6 dB).', 'success');
        return;
      }
      pendingConn = { from: linkSource.nodeId, fromPort: linkSource.portId, to: targetId, cableType };
      linkSource = null;
      render();
      openLengthPopup();
    }

    // ONT → ponto de TV: Wi-Fi (sem cabo), Box TV no RJ45 1,5 m, Sound Box no RJ45 em metros
    function connectNet(ont, portId, dev) {
      linkSource = null;
      if (portId !== 'wifi' && NET_DEV[dev.type].wifiOnly) { showToast(`A ${NET_DEV[dev.type].label} só liga por Wi-Fi (rede 2,4 GHz).`, 'warning'); render(); return; }
      if (portId !== 'wifi' && !usesPatch(dev)) {
        pendingConn = { from: ont.id, fromPort: portId, to: dev.id, cableType: 'RJ45' };
        render();
        openLengthPopup();
        return;
      }
      const wifi = portId === 'wifi';
      if (wifi && dev.type === 'soundbox' && !connectNet._ok) { render(); openConnectMenu(dev.id, null, 'wifi-confirm'); return; }
      const c = { id: uid('conn'), from: ont.id, fromPort: portId, to: dev.id, cableType: wifi ? 'Wi-Fi' : 'RJ45 1,5 m', length: wifi ? 0 : PATCH_M, ...(wifi ? { band: NET_DEV[dev.type].band || '5', rssi: '' } : {}) };
      connections.push(c);
      selection.clear(); selectedNodeId = null; selectedConnectionId = c.id;
      refresh();
      if (wifi && dev.type === 'camera' && !ont.iot) showToast(`Câmera ligada no Wi-Fi: habilite a rede IoT (2,4 GHz) ${ont.type === 'modem' ? 'no' : 'na'} ${ont.name} para ela ficar online.`, 'warning');
      else if (wifi && dev.type === 'soundbox') showToast('Sound Box ligada por Wi-Fi: funciona, mas não é recomendado. Prefira cabo RJ45.', 'warning');
      else showToast(`${dev.name} ligado ${dev.type === 'camera' ? 'na rede IoT (2,4 GHz)' : wifi ? 'por Wi-Fi (' + wifiRule() + ')' : 'com cabo RJ45 1,5 m (para mais de 1,5 m use PONTO ULTRA)'} ${ont.type === 'modem' ? 'do' : 'da'} ${ont.name}.`, 'success');
    }

    // --- POP-UP DE DISTÂNCIA DO CABO ---
    function openLengthPopup() {
      closeLengthPopup(true);
      const src = byId(pendingConn.from), dst = byId(pendingConn.to);
      const a = portPos(src, pendingConn.fromPort), b = portPos(dst, 'in');
      const canvas = document.getElementById('canvas-container');
      const gp = optCtx(src), cordao = pendingConn.cableType === 'Cordão óptico', rj = pendingConn.cableType === 'RJ45';
      const W = 232, H = gp ? 200 : 150;
      const inCls = 'w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-sky-500';
      const popupFields = (rj && !gp) ? `
          <label class="block">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Comprimento (metros)</span>
            <input id="length-popup-input" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 8" class="${inCls}">
          </label>
          <p class="text-[10px] text-slate-400 leading-snug">PONTO ULTRA: cabo de rede RJ45 confeccionado, conectores inclusos nas duas pontas. Até ${RJ45_MAX} m.</p>` : !gp ? `
          <label class="block">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Distância (metros)</span>
            <input id="length-popup-input" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 15" class="${inCls}">
          </label>` : rj ? `
          <label class="block">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Comprimento (metros)</span>
            <input id="length-popup-input" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 8" class="${inCls}">
          </label>
          <p class="text-[10px] text-slate-400 leading-snug">PONTO ULTRA: cabo de rede RJ45 confeccionado, conectores inclusos nas duas pontas. Até ${RJ45_MAX} m.</p>` : cordao ? `
          <label class="block">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Comprimento (metros)</span>
            <input id="length-popup-input" type="text" inputmode="decimal" autocomplete="off" value="2" class="${inCls}">
          </label>
          <p class="text-[10px] text-slate-400 leading-snug">Perda fixa do cordão: 1,0 a 1,6 dB (conectores inclusos).</p>` : `
          <div class="grid grid-cols-2 gap-2">
            <label class="block">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Distância (m)</span>
              <input id="length-popup-input" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 80" class="${inCls}">
            </label>
            <label class="block">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Conectores</span>
              <input id="conn-popup-input" type="text" inputmode="numeric" autocomplete="off" value="2" readonly title="Cabo de fibra: 1 conector em cada ponta (2)" class="${inCls}">
            </label>
          </div>
          <p class="text-[10px] text-slate-400 leading-snug">Fibra 0,25 a 0,35 dB/km + cada conector 0,5 a 0,8 dB.</p>`;
      const mx = (a.x + b.x) / 2 * view.zoom + view.x, my = (a.y + b.y) / 2 * view.zoom + view.y;
      const x = Math.max(8, Math.min(canvas.clientWidth - W - 8, mx - W / 2));
      const y = Math.max(8, Math.min(canvas.clientHeight - H - 8, my - H / 2));

      const wrap = document.createElement('div');
      wrap.id = 'length-popup';
      wrap.className = 'absolute inset-0 z-30';
      wrap.onmousedown = (e) => e.stopPropagation();
      wrap.onclick = (e) => { e.stopPropagation(); if (e.target === wrap) cancelLengthPopup(); };
      wrap.innerHTML = `
        <div class="absolute bg-slate-900 border border-sky-500 rounded-xl shadow-2xl p-3 space-y-2" style="left:${x}px; top:${y}px; width:${W}px">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-100"><span class="inline-block w-4 h-1 rounded align-middle mr-1" style="background:${CABLE_STYLE[pendingConn.cableType]}"></span>${gp ? esc(GPON_CABLES[pendingConn.cableType].name) : 'Cabo ' + esc(pendingConn.cableType)}</span>
            <button onclick="cancelLengthPopup()" class="text-slate-400 hover:text-white text-xs px-1" title="Cancelar"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <p class="text-[10px] text-slate-400 truncate">${esc(src.name)} <i class="fa-solid fa-arrow-right mx-0.5"></i> ${esc(dst.name)}</p>
          ${popupFields}
          <div class="flex gap-2">
            <button onclick="cancelLengthPopup()" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold">Cancelar</button>
            <button onclick="confirmLengthPopup()" class="flex-1 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-bold">Ligar cabo</button>
          </div>
        </div>`;
      canvas.appendChild(wrap);
      const input = document.getElementById('length-popup-input');
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmLengthPopup(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancelLengthPopup(); }
      };
      input.focus();
    }

    function closeLengthPopup(keepPending) {
      const el = document.getElementById('length-popup');
      if (el) el.remove();
      if (!keepPending) pendingConn = null;
    }

    function cancelLengthPopup() {
      if (!pendingConn) return;
      closeLengthPopup();
      render();
      showToast('Ligação cancelada: nenhum cabo foi criado.', 'warning');
    }

    function confirmLengthPopup() {
      if (!pendingConn) return;
      const input = document.getElementById('length-popup-input');
      const length = parseFloat(String(input.value).replace(',', '.'));
      if (pendingConn.cableType === 'RJ45') {
        if (usesPatch(byId(pendingConn.to)) && !isNaN(length) && length > 0 && length <= PATCH_M) {
          input.classList.add('border-rose-500');
          input.focus();
          showToast('Até 1,5 m use o cabo RJ45 1,5 m; o PONTO ULTRA é para distâncias maiores.', 'warning');
          return;
        }
        if (isNaN(length) || length <= 0 || length > RJ45_MAX) {
          input.classList.add('border-rose-500');
          input.focus();
          showToast(`Informe o comprimento do cabo RJ45 em metros (maior que zero, até ${RJ45_MAX} m).`, 'warning');
          return;
        }
        const conn = { id: uid('conn'), ...pendingConn, length };
        connections.push(conn);
        closeLengthPopup();
        selectedConnectionId = conn.id;
        selectedNodeId = null;
        refresh();
        showToast(`PONTO ULTRA de ${length} m (${ultraCost(byId(conn.to))}) ligado: ${byId(conn.to).name} fica online quando ${GW().A.toLowerCase()} estiver com sinal OK.`, 'success');
        return;
      }
      if (optCtx(byId(pendingConn.from))) {
        const ci = document.getElementById('conn-popup-input');
        const k = ci ? Math.round(parseFloat(String(ci.value).replace(',', '.'))) : 0;
        if (isNaN(length) || length < 0 || (ci && (isNaN(k) || k < 0))) {
          input.classList.add('border-rose-500');
          input.focus();
          showToast(ci ? 'Informe a distância em metros (0 ou mais) e a quantidade de conectores.' : 'Informe o comprimento do cordão em metros.', 'warning');
          return;
        }
        const conn = { id: 'conn_' + Date.now() + '_' + Math.floor(Math.random() * 1000), ...pendingConn, length, ...(ci ? { conectores: Math.min(k, 20) } : {}) };
        connections.push(conn);
        closeLengthPopup();
        selectedConnectionId = conn.id;
        selectedNodeId = null;
        refresh();
        showToast(`${GPON_CABLES[conn.cableType].name} ligado: ${gponCableLabel(conn)}.`, 'success');
        return;
      }
      if (isNaN(length) || length <= 0) {
        input.classList.add('border-rose-500');
        input.focus();
        showToast('Informe a distância do cabo em metros (maior que zero).', 'warning');
        return;
      }
      const conn = { id: 'conn_' + Date.now() + '_' + Math.floor(Math.random() * 1000), ...pendingConn, length };
      if (conn.cableType === 'RG11') {
        const src = byId(conn.from), prob = rg11Problem(src, length);
        if (prob) {
          conn.cableType = rg11Fallback(src);
          setTimeout(() => showToast(`${prob} O cabo foi ligado como ${conn.cableType === 'RG6' ? 'RG6 Branco' : conn.cableType}.`, 'warning'), 50);
        }
      }
      connections.push(conn);
      closeLengthPopup();
      selectedConnectionId = conn.id;
      selectedNodeId = null;
      refresh();
      if (isDropFromTap(conn) && autoIsoOnDrop(conn)) { coaxAlert(conn.to); return; }
      showToast(`Cabo ${conn.cableType} de ${length} m conectado.`, 'success');
      coaxAlert(conn.to);
    }

    function cancelLink(notify) {
      if (!linkSource) return;
      linkSource = null;
      render();
      if (notify) showToast('Conexão cancelada.', 'warning');
    }

    function updateLinkBadge() {
      const el = document.getElementById('active-cable-badge');
      if (!el) return;
      const dot = `<span class="inline-block w-5 h-1 rounded align-middle mr-1.5" style="background:${CABLE_STYLE[activeCableType]}"></span>`;
      if (linkSource) {
        const n = byId(linkSource.nodeId);
        const p = n ? portInfo(n, linkSource.portId) : null;
        el.className = 'shrink-0 text-amber-300 font-semibold';
        el.innerHTML = `<i class="fa-solid fa-plug mr-1"></i>Puxando ${esc(GPON_CABLES[activeCableType] ? GPON_CABLES[activeCableType].name : activeCableType)} de ${esc(n ? n.name : '')} · ${esc(p ? p.label : '')}: clique no destino (Esc cancela)`;
      } else {
        el.className = 'shrink-0 text-slate-400';
        el.innerHTML = `${isGpon() ? 'Fibra ativa' : 'Cabo ativo'}: ${dot}<b class="text-slate-200">${esc(GPON_CABLES[activeCableType] ? GPON_CABLES[activeCableType].name : activeCableType)}</b>`;
      }
    }

    // --- RF SIGNAL ENGINE ---
    // Cada nó recebe n.lv = { ca, cb, rx, tx } (níveis na sua entrada) e n.path (trechos desde o TAP).
    function recalculateSignals() {
      nodes.forEach(n => { n.lv = null; n.path = []; });
      nodes.filter(n => n.type === 'tap').forEach(tap => {
        const s = tap.signals || {};
        const blank = originBlank(tap);
        tap.lv = isCTO(tap)
          ? { min: blank ? null : sigVal(s.pot), max: blank ? null : sigVal(s.pot) }
          : { ca: blank ? null : sigVal(s.ca), cb: blank ? null : sigVal(s.cb), rx: blank ? null : sigVal(s.rx), tx: blank ? null : sigVal(s.tx) };
        walkSignals(tap, new Set([tap.id]));
      });
      // HFC sem TAP/DG: a peça do topo (sem cabo de entrada) é o ponto de partida.
      // O sinal dela é calculado a partir de qualquer ponto medido (Sinais no ponto).
      if (!isGpon()) nodes.filter(n => n.type !== 'tap' && !isOptNode(n) && !n.lv && !inputConn(n.id)).forEach(root => {
        const s = root.signals || {};
        root.lv = { ca: sigVal(s.ca), cb: sigVal(s.cb), rx: sigVal(s.rx), tx: sigVal(s.tx) };
        walkSignals(root, new Set([root.id]));
      });
    }

    function walkSignals(node, seen) {
      connections.filter(c => c.from === node.id).forEach(conn => {
        const dest = byId(conn.to);
        if (!dest || seen.has(dest.id) || isNetCable(conn.cableType)) return;

        const port = portInfo(node, conn.fromPort);
        const p = port ? port.loss : 0;
        if (node.lv && 'min' in node.lv) {   // óptico (GPON): perda mínima e máxima
          const cl = gponCableLoss(conn);
          let L = node.lv;
          if (isCTO(node)) {   // DIO/NAP: potência da porta (NAP 16: portas 9–16 têm potência própria)
            const pv = sigVal((node.signals || {})[potKey(Number(String(conn.fromPort).replace('out', '')))]);
            L = { min: pv, max: pv };
          }
          dest.lv = { min: L.min == null ? null : L.min - cl.min - p, max: L.max == null ? null : L.max - cl.max - p };
          dest.path = node.path.slice();
          if (node.type !== 'tap') dest.path.push({ kind: 'port', nodeId: node.id, portId: conn.fromPort, loss: { min: p, max: p } });
          dest.path.push({ kind: 'cable', connId: conn.id, loss: cl });
          seen.add(dest.id);
          walkSignals(dest, seen);
          return;
        }
        const cable = cableAttenuation[conn.cableType] || cableAttenuation['RG6'];
        const len = Number(conn.length) || 0;
        const cab = { ca: cable.CA * len, cb: cable.CB * len, rx: cable.RX * len, tx: cable.TX * len };

        const L = node.lv;
        dest.lv = {
          ca: L.ca == null ? null : L.ca - cab.ca - p,
          cb: L.cb == null ? null : L.cb - cab.cb - p,
          rx: L.rx == null ? null : L.rx - cab.rx - p,
          tx: L.tx == null ? null : L.tx + cab.tx + p
        };
        dest.path = node.path.slice();
        if (node.type !== 'tap') dest.path.push({ kind: 'port', nodeId: node.id, portId: conn.fromPort, loss: { ca: p, cb: p, rx: p, tx: p } });
        dest.path.push({ kind: 'cable', connId: conn.id, loss: cab });

        seen.add(dest.id);
        walkSignals(dest, seen);
      });
    }

    // --- DIAGNÓSTICO DE SINAL ---
    const ST = {
      ok:   { label: 'OK',            report: 'APROVADO',  icon: 'fa-circle-check',         text: 'text-emerald-400', border: 'border-emerald-600/70', chip: 'bg-emerald-950/60 border-emerald-700 text-emerald-300' },
      warn: { label: 'ATENÇÃO',       report: 'ATENÇÃO',   icon: 'fa-triangle-exclamation', text: 'text-amber-400',   border: 'border-amber-500',      chip: 'bg-amber-950/60 border-amber-600 text-amber-300' },
      bad:  { label: 'FORA DA FAIXA', report: 'REPROVADO', icon: 'fa-circle-xmark',         text: 'text-rose-400',    border: 'border-rose-500',       chip: 'bg-rose-950/60 border-rose-700 text-rose-300' },
      none: { label: 'SEM SINAL',     report: 'SEM SINAL', icon: 'fa-plug-circle-xmark',    text: 'text-slate-400',   border: 'border-slate-600 border-dashed', chip: 'bg-slate-800 border-slate-600 text-slate-300' }
    };
    const ST_RANK = { ok: 0, warn: 1, bad: 2, none: 3 };

    function evalMetric(val, min, max, warnBelow) {
      if (val == null) return 'none';
      if (val < min || val > max) return 'bad';
      if (warnBelow != null && val < warnBelow) return 'warn';
      if (val < min + limits.margin || val > max - limits.margin) return 'warn';
      return 'ok';
    }

    // Todos os equipamentos medem CA, CB, RX e TX
    function metricsFor(n) {
      if (n.type === 'ont') return gponMetrics(n);
      const lv = n.lv, L = limits;
      return [
        { key: 'ca', label: 'CA (canal alto)',  val: lv ? lv.ca : null, min: L.caMin, max: Infinity, us: false },
        { key: 'cb', label: 'CB (canal baixo)', val: lv ? lv.cb : null, min: L.cbMin, max: Infinity, us: false },
        { key: 'rx', label: 'RX (DS)', val: lv ? lv.rx : null, min: L.rxMin, max: L.rxMax, us: false },
        { key: 'tx', label: 'TX (US)', val: lv ? lv.tx : null, min: L.txMin, max: L.txMax, us: true }
      ].filter(m => n.type !== 'box' || m.key === 'ca' || m.key === 'cb');   // Box TV via HFC: só CA e CB (a internet vem do EMTA, por Wi-Fi ou cabo)
    }

    function levelsGridHTML(d) {
      return `<div class="grid grid-cols-2 gap-x-3 gap-y-1 font-mono text-[15px]">
        ${d.metrics.map(m => `<div class="flex justify-between"><span class="text-slate-400">${m.short || m.key.toUpperCase()}:</span><strong class="${ST[m.st].text}">${fmt(m.val)}</strong></div>`).join('')}
      </div>`;
    }

    // Status de um ponto só pelos níveis (sem gerar sugestões)
    function statusOf(n) {
      if (!n.lv) return 'none';
      let st = 'ok';
      metricsFor(n).forEach(m => { const x = evalMetric(m.val, m.min, m.max, m.warnBelow); if (ST_RANK[x] > ST_RANK[st]) st = x; });
      return st;
    }
    // Quanto o ponto está fora da faixa (soma em dB) — para saber se uma troca ajuda
    function violation(n) {
      if (!n.lv || metricsFor(n).some(m => m.val == null)) return Infinity;
      return metricsFor(n).reduce((t, m) => t + Math.max(0, m.min - m.val) + Math.max(0, m.val - m.max), 0);
    }
    // Testa uma correção numa cópia do projeto: resolve o ponto? tira algum outro ponto da faixa?
    function simulateAction(a, targetId) {
      const origNodes = nodes, origConns = connections, origSel = selectedNodeId;
      const before = {};
      origNodes.filter(isEndpoint).forEach(e => { before[e.id] = statusOf(e); });
      const vBefore = byId(targetId) ? violation(byId(targetId)) : Infinity;
      let res = { valid: false };
      try {
        nodes = origNodes.map(x => ({ ...x, signals: { ...(x.signals || {}) } }));
        connections = origConns.map(c => ({ ...c }));
        if (applyActionCore(a, true)) {
          recalculateSignals();
          const t = byId(targetId);
          const broken = nodes.filter(e => isEndpoint(e) && e.id !== targetId && before[e.id] && ST_RANK[statusOf(e)] > ST_RANK[before[e.id]]).map(e => e.name);
          res = { valid: true, resolves: !!t && statusOf(t) === 'ok', improves: !!t && violation(t) < vBefore - 1e-9, broken };
        }
      } catch (err) { res = { valid: false }; }
      nodes = origNodes; connections = origConns; selectedNodeId = origSel;
      return res;
    }
    // Mantém só as correções que funcionam de verdade no projeto
    function validateSuggestions(n, list) {
      const kept = [], dropped = [];
      list.forEach(sg => {
        if (!sg.action) { kept.push(sg); return; }
        const r = simulateAction(sg.action, n.id);
        if (!r.valid) return;
        if (r.broken.length) { dropped.push({ sg, why: `deixaria ${r.broken.join(', ')} fora da faixa` }); return; }
        if (!r.resolves && !r.improves) return;
        sg.resolves = r.resolves;
        kept.push(sg);
      });
      // várias opções na mesma peça: fica a que resolve com a menor troca (ou a que mais ajuda)
      const best = {};
      kept.forEach(sg => {
        const k = sg.action && sg.action.kind === 'type' ? 'type:' + sg.action.id : Math.random();
        const cur = best[k];
        const better = !cur || (sg.resolves && !cur.resolves) || (sg.resolves === cur.resolves && (sg.resolves ? sg.gain < cur.gain : sg.gain > cur.gain));
        if (better) best[k] = sg;
      });
      const out = Object.values(best).sort((a, b) => (b.resolves === true) - (a.resolves === true) || b.gain - a.gain);
      // descartadas: mostra uma por peça
      const seen = new Set();
      const drop = dropped.filter(d => { const k = d.sg.text.split(' por ')[0]; if (seen.has(k)) return false; seen.add(k); return true; });
      return { list: out, dropped: drop };
    }

    function diagnose(n, full = true) {
      if (n.type === 'ont') return diagnoseGpon(n);
      const metrics = metricsFor(n);
      if (!n.lv) {
        metrics.forEach(m => m.st = 'none');
        return { status: 'none', metrics, notes: ['Sem caminho de sinal até o TAP. Ligue este ponto a uma porta de saída.'], suggestions: [], summary: '' };
      }
      if (metrics.some(m => m.val == null)) {
        metrics.forEach(m => m.st = m.val == null ? 'none' : evalMetric(m.val, m.min, m.max, m.warnBelow));
        return { status: 'none', metrics, notes: ['Sinais ainda não informados: preencha a origem (TAP ou DG) ou digite o sinal medido em qualquer ponto, em "Sinais no ponto".'], suggestions: [], summary: '' };
      }

      let reduce = 0, reduceBand = null, add = 0, addBand = null, status = 'ok';
      const notes = [];
      metrics.forEach(m => {
        m.st = evalMetric(m.val, m.min, m.max, m.warnBelow);
        if (ST_RANK[m.st] > ST_RANK[status]) status = m.st;
        const low = m.min - m.val, high = m.val - m.max;
        // Downstream baixo ou upstream alto => perda demais. O inverso => perda de menos.
        const tooMuchLoss = m.us ? high : low;
        const tooLittleLoss = m.us ? low : high;
        if (tooMuchLoss > reduce) { reduce = tooMuchLoss; reduceBand = m.key; }
        if (tooLittleLoss > add) { add = tooLittleLoss; addBand = m.key; }
        if (m.st === 'bad') {
          notes.push(low > 0
            ? `${m.label} em ${fmt(m.val)} dBmV: ${fmtDb(low)} dB abaixo do mínimo (${m.min}).`
            : `${m.label} em ${fmt(m.val)} dBmV: ${fmtDb(high)} dB acima do máximo (${m.max}).`);
        } else if (m.st === 'warn') {
          const nearMin = m.val < m.min + limits.margin;
          notes.push(`${m.label} em ${fmt(m.val)} dBmV: a ${fmtDb(nearMin ? m.val - m.min : m.max - m.val)} dB do ${nearMin ? 'mínimo' : 'máximo'} (${nearMin ? m.min : m.max}).`);
        }
      });

      let suggestions = [], summary = '';
      if (!full) return { status, metrics, notes, suggestions, summary };
      if (reduce > 0 && add > 0) {
        summary = 'Há níveis acima e abaixo da faixa ao mesmo tempo: trocar passivos ou cabos não resolve. Revise os níveis de origem no TAP ou as faixas configuradas.';
      } else if (reduce > 0) {
        const v = validateSuggestions(n, reduceSuggestions(n, reduce, reduceBand));
        suggestions = v.list;
        const ok = suggestions.some(x => x.resolves);
        summary = ok
          ? `É preciso reduzir ${fmtDb(reduce)} dB de atenuação no caminho. Cada correção abaixo foi testada no projeto: as marcadas "Resolve" deixam "${n.name}" no padrão sem tirar nenhum outro ponto da faixa.`
          : suggestions.length
            ? `É preciso reduzir ${fmtDb(reduce)} dB de atenuação. Nenhuma troca sozinha resolve: as abaixo ajudam sem prejudicar outros pontos; também será preciso encurtar cabos, tirar derivações ou revisar o nível de origem.`
            : `É preciso reduzir ${fmtDb(reduce)} dB de atenuação, mas nenhuma troca neste caminho resolve sem tirar outro ponto da faixa: encurte cabos, tire derivações ou revise o nível de origem (TAP/DG).`;
        if (v.dropped.length) summary += ' Descartado: ' + v.dropped.map(d => `${d.sg.text.replace(/\.$/, '')} (${d.why})`).join('; ') + '.';
      } else if (add > 0) {
        const v = validateSuggestions(n, addSuggestions(n, add, addBand, metrics));
        suggestions = v.list;
        summary = `Sinal forte demais: é preciso acrescentar pelo menos ${fmtDb(add)} dB de atenuação no caminho.` + (suggestions.some(x => x.resolves) ? ' As marcadas "Resolve" foram testadas no projeto.' : '');
        if (v.dropped.length) summary += ' Descartado: ' + v.dropped.map(d => `${d.sg.text.replace(/\.$/, '')} (${d.why})`).join('; ') + '.';
      }
      return { status, metrics, notes, suggestions, summary };
    }

    // Sugestões para REDUZIR a perda no caminho (sinal fraco / TX alto)
    function reduceSuggestions(n, need, band) {
      const B = band.toUpperCase();
      const out = [];
      n.path.forEach(step => {
        if (step.kind === 'cable') {
          const c = connById(step.connId);
          if (!c || c.cableType === 'RG11' || rg11Problem(byId(c.from), c.length)) return;
          const cur = cableAttenuation[c.cableType] || cableAttenuation.RG6;
          const gain = (cur[B] - cableAttenuation.RG11[B]) * c.length;
          if (gain < 0.3) return;
          const a = byId(c.from), b = dockedMini(byId(c.to)) || byId(c.to);
          out.push({
            gain,
            text: `Trocar o cabo de entrada de ${c.length} m (${a.name} → ${b.name}) de ${c.cableType} para RG11.`,
            action: { kind: 'cable', id: c.id, type: 'RG11' }
          });
          return;
        }

        const node = byId(step.nodeId);
        if (!node) return;
        const cur = step.loss.rx;

        if (isAtt(node.type)) {
          // atenuador no caminho: trocar por um menor ou retirar
          const smaller = ATT_VALUES.filter(v => v < cur && cur - v >= need);
          if (smaller.length) {
            const v = smaller[smaller.length - 1];
            out.push({ gain: cur - v, text: `Trocar o ${node.name} por um atenuador de ${v} dB.`, action: { kind: 'type', id: node.id, type: 'att' + v } });
          } else {
            out.push({ gain: cur, text: `Retirar o ${node.name} do caminho (ligar o cabo direto).`, action: { kind: 'removeAtt', id: node.id } });
          }
          return;
        }

        if (isDC(node.type)) {
          const all = [6, 9, 12, 16, 20].map(db => ({ type: 'dc' + db, db, ...passiveLosses['dc' + db] }));
          const me = passiveLosses[node.type];
          if (step.portId === 'tap') {
            // derivação: um DC de valor menor perde menos no TAP (e mais na passagem)
            all.filter(d => d.tap < me.tap).forEach(pick => {
              const side = pick.out - me.out;
              out.push({
                gain: me.tap - pick.tap,
                text: `Trocar ${node.name} por um DC ${pick.db} (derivação TAP de −${me.tap} para −${pick.tap} dB).`,
                note: side > 0 ? `A saída OUT desse DC passa a ter ${fmtDb(side)} dB a mais de atenuação.` : '',
                action: { kind: 'type', id: node.id, type: pick.type }
              });
            });
          } else {
            // passagem: um DC de valor maior perde menos no OUT (e mais no TAP)
            all.filter(d => d.out < me.out).forEach(pick => {
              out.push({
                gain: me.out - pick.out,
                text: `Trocar ${node.name} por um DC ${pick.db} (passagem OUT de −${me.out} para −${pick.out} dB).`,
                note: `A derivação TAP desse DC passa a ter ${fmtDb(pick.tap - me.tap)} dB a mais de atenuação.`,
                action: { kind: 'type', id: node.id, type: pick.type }
              });
            });
          }
          return;
        }

        if (isDiv(node.type)) {
          const myConn = portConn(node.id, step.portId);
          const used = connections.filter(c => c.from === node.id).length;

          // 1/3D: ir para a saída principal sem trocar a peça
          if (node.type === 'div13d' && step.portId !== 'out1') {
            const gain = passiveLosses.div13d.outSec - passiveLosses.div13d.outMain;
            const occupant = portConn(node.id, 'out1');
            if (!occupant) {
              out.push({ gain, text: `Mover este ramo para a saída principal (−${passiveLosses.div13d.outMain} dB) do ${node.name}.`, action: { kind: 'movePort', id: myConn.id, port: 'out1' } });
            } else {
              const other = dockedMini(byId(occupant.to)) || byId(occupant.to);   // mini encostado: mostra o aparelho
              out.push({ gain, text: `Trocar de porta com "${other.name}" no ${node.name} para usar a saída principal (−${passiveLosses.div13d.outMain} dB).`, note: `"${other.name}" passa a ter ${fmtDb(gain)} dB a mais de atenuação.`, action: { kind: 'swapPorts', a: myConn.id, b: occupant.id } });
            }
            return;
          }

          const cands = [
            { type: 'div12',  ports: 2, loss: passiveLosses.div12.out,      label: 'Divisor 1/2' },
            { type: 'div13d', ports: 3, loss: passiveLosses.div13d.outMain, label: 'Divisor 1/3D (na saída principal)' },
            { type: 'div13',  ports: 3, loss: passiveLosses.div13.out,      label: 'Divisor 1/3 balanceado' },
            { type: 'div14',  ports: 4, loss: passiveLosses.div14.out,      label: 'Divisor 1/4' }
          ].filter(c => c.type !== node.type && c.ports >= used && c.loss < cur);
          if (!cands.length) return;
          const best = cands.reduce((a, b) => (b.loss < a.loss ? b : a));
          out.push({
            gain: cur - best.loss,
            text: `Trocar ${node.name} por um ${best.label}: só ${used} saída${used > 1 ? 's estão' : ' está'} em uso (de −${cur} para −${best.loss} dB).`,
            note: best.type === 'div13d' && used > 1 ? `As outras saídas ficam em −${passiveLosses.div13d.outSec} dB.` : '',
            action: { kind: 'type', id: node.id, type: best.type, priority: myConn ? myConn.id : null }
          });
        }
      });
      return out.sort((a, b) => b.gain - a.gain);
    }

    // Sugestões para AUMENTAR a perda (sinal forte / TX baixo)
    function addSuggestions(n, need, band, metrics) {
      const out = [];
      n.path.forEach(step => {
        if (step.kind !== 'port' || step.portId !== 'tap') return;
        const node = byId(step.nodeId);
        if (!node || !isDC(node.type)) return;
        const me = passiveLosses[node.type];
        [9, 12, 16, 20].map(db => ({ db, type: 'dc' + db, ...passiveLosses['dc' + db] })).filter(d => d.tap > me.tap).forEach(pick => {
          out.push({
            gain: pick.tap - me.tap, attenuate: true,
            text: `Trocar ${node.name} por um DC ${pick.db} (derivação TAP de −${me.tap} para −${pick.tap} dB).`,
            note: me.out - pick.out > 0 ? `De quebra, a saída OUT desse DC passa a ter ${fmtDb(me.out - pick.out)} dB a menos de atenuação.` : '',
            action: { kind: 'type', id: node.id, type: pick.type }
          });
        });
      });

      // Atenuador na entrada: verifica se não estoura o outro limite
      const inC = inputConn(n.id);
      const prev = inC ? byId(inC.from) : null;
      const curPad = prev && isAtt(prev.type) ? passiveLosses[prev.type].out : 0;
      const target = ATT_VALUES.find(v => v - curPad >= need) || ATT_VALUES[ATT_VALUES.length - 1];
      const pad = target - curPad;
      if (pad > 0) {
        const side = metrics.map(m => {
          const after = m.us ? m.val + pad : m.val - pad;
          return (after < m.min || after > m.max) ? `${m.label} iria para ${fmt(after)} dBmV, fora da faixa` : null;
        }).filter(Boolean);
        out.push({
          gain: pad, attenuate: true,
          text: curPad
            ? `Trocar o ${prev.name} por um atenuador de ${target} dB na entrada de "${n.name}".`
            : `Instalar um atenuador (pad) de ${target} dB na entrada de "${n.name}".`,
          note: side.length ? `Cuidado: ${side.join('; ')}. Nesse caso, revise o nível no TAP.` : '',
          action: curPad ? { kind: 'type', id: prev.id, type: 'att' + target } : (inC ? { kind: 'insertAtt', id: n.id, type: 'att' + target } : null)
        });
      }
      return out;
    }

    function applyAction(i) {
      const a = currentActions[i];
      if (!a) return;
      if (!applyActionCore(a, false)) return;
      if (selectedNodeId && !byId(selectedNodeId)) selectedNodeId = null;
      refresh();
      showToast('Alteração aplicada. Níveis recalculados.', 'success');
    }
    // Faz a alteração no projeto (sem desenhar). quiet = sem avisos (usado no teste das sugestões)
    function applyActionCore(a, quiet) {
      if (a.kind === 'cable') {
        const c = connById(a.id);
        if (c && !isDG(byId(c.from)) && !(a.type === 'RG11' && rg11Problem(byId(c.from), c.length))) c.cableType = a.type;
      } else if (a.kind === 'type') {
        if (!changeNodeType(a.id, a.type, a.priority, quiet)) return false;
      } else if (a.kind === 'movePort') {
        const c = connById(a.id);
        if (c && !portConn(c.from, a.port)) c.fromPort = a.port;
      } else if (a.kind === 'swapPorts') {
        const x = connById(a.a), y = connById(a.b);
        if (x && y) { const t = x.fromPort; x.fromPort = y.fromPort; y.fromPort = t; }
      } else if (a.kind === 'insertAtt') {
        const n = byId(a.id), c = inputConn(a.id);
        if (!n || !c) return false;
        const s = nodeSize(n);
        const att = { id: uid('node'), type: a.type, name: NODE_DEFS[a.type].label, x: Math.max(0, n.x - 150), y: Math.max(0, n.y + s.h / 2 - 18), rot: 0, signals: {} };
        nodes.push(att);
        c.to = att.id;
        connections.push({ id: uid('conn'), from: att.id, fromPort: 'out', to: n.id, cableType: c.cableType === 'RG11' ? 'RG6' : c.cableType, length: 0 });
      } else if (a.kind === 'removeAtt') {
        const att = byId(a.id);
        if (!att) return false;
        const inC = inputConn(att.id), outC = portConn(att.id, 'out');
        if (inC && outC) {
          inC.to = outC.to;
          inC.length = Math.round((Number(inC.length) + Number(outC.length)) * 10) / 10;
        }
        connections = connections.filter(c => c !== outC && (c.to !== att.id || c === inC) && c.from !== att.id);
        nodes = nodes.filter(x => x.id !== att.id);
      }
      return true;
    }

    // Troca o modelo de um passivo preservando os cabos ligados
    function changeNodeType(id, newType, priorityConnId, quiet) {
      const node = byId(id);
      const def = NODE_DEFS[newType];
      if (!node || !def) return false;
      const cs = connections.filter(c => c.from === id);
      if (cs.length > def.outs.length) {
        if (!quiet) showToast(`O ${def.label} tem só ${def.outs.length} saídas e há ${cs.length} cabos ligados.`, 'warning');
        return false;
      }
      if (!(isDC(node.type) && isDC(newType))) {
        const order = outPorts(node).map(p => p.id);
        cs.sort((a, b) => order.indexOf(a.fromPort) - order.indexOf(b.fromPort));
        if (priorityConnId) cs.sort((a, b) => (b.id === priorityConnId) - (a.id === priorityConnId));
        cs.forEach((c, i) => { c.fromPort = def.outs[i].id; });
      }
      node.type = newType;
      node.name = def.label;
      return true;
    }

    // --- RENDERERS ---
    // Depois do CABLE ISOLATOR o cabo é sempre RG6 Branco (corrige projetos antigos)
    function fixIsoOutputs() {
      connections.forEach(c => {
        const f = byId(c.from);
        if (!f || f.type !== 'iso') return;
        if (c.cableType !== 'RG6') c.cableType = 'RG6';
        if (Number(c.length) !== ISO_TAIL_M) c.length = ISO_TAIL_M;
      });
    }
    // Fibra: cabos (drop, micro low, invisível) sempre com 2 conectores (1 em cada ponta); cordão óptico sempre 1,5 m
    const CORDAO_M = 1.5, FIBRA_CONECTORES = 2;
    const isFiberCable = t => isGponCable(t) && !isNetCable(t) && t !== 'Cordão óptico';
    function fixInvisible() {
      connections.forEach(c => {
        if (c.cableType === 'Cordão óptico') { c.length = CORDAO_M; delete c.conectores; }
        else if (isFiberCable(c.cableType)) c.conectores = FIBRA_CONECTORES;
      });
    }
    function refresh() {
      fixInvisible();
      fixIsoOutputs();
      recalculateSignals();
      computeFixes();
      render();
    }
    // Marca os pontos que têm correção testada: 2 = resolve, 1 = só ajuda, 0 = nenhuma
    function computeFixes() {
      nodes.slice().forEach(n => {
        if (!isEndpoint(n)) return;
        n._fix = 0;
        if (!n.lv || statusOf(n) === 'ok') return;
        const d = diagnose(n);
        n._fix = d.suggestions.some(sg => sg.action && sg.resolves) ? 2 : d.suggestions.some(sg => sg.action) ? 1 : 0;
      });
    }
    function fixChip(n) {
      if (!n._fix) return '<span></span>';
      const resolve = n._fix === 2;
      return `<button onclick="event.stopPropagation(); goToFix('${esc(n.id)}')" title="${resolve ? 'Há correção que resolve: toque para ir a Como corrigir' : 'Há correção que ajuda: toque para ir a Como corrigir'}" class="px-1.5 py-0.5 rounded border text-[11px] font-bold flex items-center gap-1 animate-pulse ${resolve ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-amber-500 border-amber-300 text-slate-950'}"><i class="fa-solid fa-screwdriver-wrench"></i>Correção</button>`;
    }
    // Cabos cruzando entre si ou passando por cima de peças?
    function cablesOverlap() {
      const polys = [];
      connections.forEach(c => {
        const f = byId(c.from), t = byId(c.to);
        if (!f || !t || (dockedMini(f) && dockedMini(f).id === t.id) || dockedLock(t)) return;
        const a = portPos(f, c.fromPort), b = portPos(t, 'in'), g = cableGeom(a, b);
        const pts = [];
        for (let i = 0; i <= 20; i++) pts.push(bezierAt(a, g, b, i / 20));
        const ends = new Set([c.from, c.to]);
        [f, t].forEach(x => { const dm = dockedMini(x); if (dm) ends.add(dm.id); nodes.forEach(m => { if (dockedMini(m) && dockedMini(m).id === x.id) ends.add(m.id); }); });
        polys.push({ pts, ends });
      });
      const orient = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
      const cross = (p1, p2, p3, p4) => orient(p1, p2, p3) * orient(p1, p2, p4) < 0 && orient(p3, p4, p1) * orient(p3, p4, p2) < 0;
      for (let i = 0; i < polys.length; i++) {
        for (let j = i + 1; j < polys.length; j++) {
          const A = polys[i].pts, B = polys[j].pts;
          for (let x = 1; x < A.length - 2; x++) for (let y = 1; y < B.length - 2; y++) if (cross(A[x], A[x + 1], B[y], B[y + 1])) return true;
        }
      }
      for (const pl of polys) {
        for (const n of nodes) {
          if (pl.ends.has(n.id) || isLock(n.type)) continue;
          const sz = nodeSize(n);
          let w = sz.w, h = sz.h;
          if ((n.rot || 0) % 180 === 90) [w, h] = [h, w];
          const cx = n.x + sz.w / 2, cy = n.y + sz.h / 2, x1 = cx - w / 2 + 6, x2 = cx + w / 2 - 6, y1 = cy - h / 2 + 6, y2 = cy + h / 2 - 6;
          if (pl.pts.slice(2, -2).some(pt => pt.x > x1 && pt.x < x2 && pt.y > y1 && pt.y < y2)) return true;
        }
      }
      return false;
    }
    function updateOrganizeHint() {
      const b = document.getElementById('organize-btn');
      if (!b) return;
      const on = nodes.length > 1 && cablesOverlap();
      ['bg-amber-500', 'text-slate-950', 'animate-pulse', 'hover:bg-amber-400'].forEach(c => b.classList.toggle(c, on));
      b.classList.toggle('hover:bg-slate-700', !on);
      b.title = on ? 'Há cabos cruzados ou passando por cima de peças: clique para organizar (Ctrl+Z desfaz)' : 'Organizar automaticamente (Ctrl+Z desfaz)';
    }

    function render() {
      renderNodes();
      renderConnections();
      renderProperties();
      updateLinkBadge();
      updateDiagBadge();
      updateOrganizeHint();
      syncDockSelection();
      scheduleCommit();
    }

    // MINI ISOLATOR ligado num equipamento fica sempre encostado na entrada dele (acompanha o aparelho)
    function dockedMini(node) {
      if (!node || node.type !== 'miniiso') return null;
      const c = portConn(node.id, 'out');
      const dest = c ? byId(c.to) : null;
      return dest && isEndpoint(dest) ? dest : null;
    }
    // TRAVA LOCK ligada direto (0 m) numa saída de passivo fica presa nela
    function dockedLock(node) {
      if (!node || !isLock(node.type)) return null;
      const c = inputConn(node.id);
      const src = c ? byId(c.from) : null;
      return c && src && !(Number(c.length) > 0) ? { src, port: c.fromPort } : null;
    }
    function dockLocks() {
      nodes.forEach(n => {
        const d = dockedLock(n);
        if (!d) return;
        const b = portPos(d.src, d.port), sz = nodeSize(n);
        const ox = sz.w / 2 - 5;

    function freePassivePorts() {
      const out = [];
      nodes.forEach(n => {
        if (!NODE_DEFS[n.type] || isLock(n.type) || isOptPassive(n.type)) return;   // divisor óptico: saída livre não precisa de TRAVA LOCK
        NODE_DEFS[n.type].outs.forEach(pt => { if (!portConn(n.id, pt.id)) out.push({ node: n, port: pt }); });
      });
      return out;
    }
    function addLock(nodeId, portId, quiet) {
      const n = byId(nodeId);
      if (!n || portConn(nodeId, portId)) return false;
      const lock = { id: uid('node'), type: 'lock', name: 'TRAVA LOCK', x: n.x, y: n.y, rot: 0, signals: {} };
      nodes.push(lock);
      connections.push({ id: uid('conn'), from: nodeId, fromPort: portId, to: lock.id, cableType: 'RG6', length: 0 });
      if (!quiet) { refresh(); showToast(`TRAVA LOCK colocada em ${n.name} · ${portInfo(n, portId).label}.`, 'success'); }
      return true;
    }

    // Alerta no momento em que o cabo coaxial chega no aparelho
    function coaxAlert(destId) {
      const dev = byId(destId);
      if (!dev || isGpon() || !EQUIP[dev.type] || dev.type === 'ont') return;
      setTimeout(() => showCoaxAlert(dev.id), 60);
    }
    function showCoaxAlert(devId) {
      closeConnectMenu();
      const dev = byId(devId), cont = document.getElementById('canvas-container'), host = document.querySelector(`[data-node="${devId}"]`);
      if (!dev || !cont) return;
      const box = dev.type === 'box', need = needsMini(dev);
      const titulo = box ? 'Box TV: entrada RF CABLE' : dev.type === 'modem' ? 'EMTA: use MINI ISOLATOR' : 'Decoder 4K: use MINI ISOLATOR';
      const texto = box
        ? 'O Box TV HFC tem o conector <b>RF CABLE</b> (já isolado): <b>não precisa</b> de MINI ISOLATOR.'
        : dev.type === 'modem'
          ? 'No EMTA vai <b>sempre</b> MINI ISOLATOR entre o cabo e o equipamento.'
          : 'O Decoder 4K tem conector F comum: <b>sempre</b> leva MINI ISOLATOR entre o cabo e o equipamento.';
      const m = document.createElement('div');
      m.id = 'connect-menu';
      m.className = 'coax-alert';
      m.onmousedown = e => e.stopPropagation();
      m.onclick = e => e.stopPropagation();
      m.innerHTML = `<div class="cm-title"><i class="fa-solid ${box ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-amber-400'}"></i> ${titulo}</div>
        <div class="coax-body"><img src="${CONECTOR_IMG[box ? 'rf' : 'f']}" alt="${box ? 'Conector RF CABLE' : 'Conector F'}"><p>${texto}</p></div>
        <div class="cm-row">${need
          ? `<button class="cm-btn cm-sec" onclick="closeConnectMenu()">Depois</button><button class="cm-btn cm-okbtn" onclick="closeConnectMenu(); addMini('${esc(devId)}')"><i class="fa-solid fa-shield-halved"></i> Colocar MINI ISOLATOR</button>`
          : `<button class="cm-btn cm-okbtn" onclick="closeConnectMenu()">Entendi</button>`}</div>`;
      cont.appendChild(m);
      const cr = cont.getBoundingClientRect(), r = host ? host.getBoundingClientRect() : { left: cr.left + 40, bottom: cr.top + 40 };
      m.style.left = Math.max(8, Math.min(cont.clientWidth - m.offsetWidth - 8, r.left - cr.left)) + 'px';
      m.style.top = Math.max(8, Math.min(cont.clientHeight - m.offsetHeight - 8, r.bottom - cr.top + 6)) + 'px';
      setTimeout(() => document.addEventListener('mousedown', closeConnectMenu, { once: true }), 0);
    }
    const missingMinis = () => nodes.filter(needsMini);
    // Coloca o MINI ISOLATOR encostado na entrada do aparelho (o cabo passa a chegar nele)
    function addMini(id, quiet) {
      const n = byId(id);
      if (!n || !needsMini(n)) return false;
      const c = inputConn(n.id);
      const mini = { id: uid('node'), type: 'miniiso', name: 'MINI ISOLATOR', x: n.x, y: n.y, rot: 0, signals: {} };
      nodes.push(mini);
      connections.push({ id: uid('conn'), from: mini.id, fromPort: 'out', to: n.id, cableType: 'RG6', length: 0 });
      c.to = mini.id;
      if (c.cableType === 'RG6 Preto' || c.cableType === 'RG11') { /* cabo de entrada mantém o tipo */ }
      if (!quiet) { refresh(); showToast(`MINI ISOLATOR colocado entre o cabo e o ${n.name}. Ctrl+Z desfaz.`, 'success'); }
      return true;
    }
    function miniAllMissing() {
      const list = missingMinis();
      if (!list.length) return;
      list.forEach(n => addMini(n.id, true));
      refresh();
      showToast(`${list.length} MINI ISOLATOR colocado${list.length > 1 ? 's' : ''} entre o cabo e o equipamento. Ctrl+Z desfaz.`, 'success');
    }
    function lockAllFree() {
      const list = freePassivePorts();
      if (!list.length) return;
      list.forEach(f => addLock(f.node.id, f.port.id, true));
      refresh();
      showToast(`${list.length} TRAVA LOCK colocada${list.length > 1 ? 's' : ''} nas saídas livres. Ctrl+Z desfaz.`, 'success');
    }
    // Soltar a TRAVA LOCK perto de uma saída livre encaixa nela
    function snapLock(id, wx, wy, fromDock) {
      const n = byId(id);
      if (!n || !isLock(n.type) || inputConn(n.id)) return false;
      let best = null;
      freePassivePorts().forEach(f => {
        const pp = portPos(f.node, f.port.id), d = Math.hypot(pp.x - wx, pp.y - wy);
        if (d <= 70 && (!best || d < best.d)) best = { ...f, d };
      });
      if (!best) {
        if (fromDock) showToast('Solte a TRAVA LOCK sobre uma saída livre de passivo (as que piscam em laranja).', 'info');
        return false;
      }
      connections.push({ id: uid('conn'), from: best.node.id, fromPort: best.port.id, to: n.id, cableType: 'RG6', length: 0 });
      selection.clear();
      selectedConnectionId = null;
      selectedNodeId = best.node.id;
      refresh();
      showToast(`TRAVA LOCK encaixada em ${best.node.name} · ${best.port.label}.`, 'success');
      return true;
    }
    function dockMinis() {
      nodes.forEach(n => {
        const dest = dockedMini(n);
        if (!dest) return;
        const b = portPos(dest, 'in'), sz = nodeSize(n);
        const ox = sz.w / 2 - 5;   // distância do centro do mini até o conector de saída dele
        n.rot = ((Math.round(Math.atan2(-b.vy, -b.vx) * 180 / Math.PI) % 360) + 360) % 360;
        n.x = b.x + b.vx * ox - sz.w / 2;
        n.y = b.y + b.vy * ox - sz.h / 2;
      });
    }

    function renderNodes() {
      dockMinis();
      dockLocks();
      const layer = document.getElementById('nodes-layer');
      layer.innerHTML = '';

      nodes.forEach(node => {
        const el = document.createElement('div');
        const isTarget = linkSource && !targetProblem(node);
        const passive = !!NODE_DEFS[node.type];
        const marks = `${isSel(node.id) ? 'node-selected' : ''} ${isTarget ? 'node-target' : ''}`;
        el.className = `absolute cursor-move select-none rounded-xl ${passive ? '' : marks}`;
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        el.style.pointerEvents = 'auto';
        el.dataset.node = node.id;
        el.onclick = (e) => {
          e.stopPropagation();
          if (Date.now() < suppressClickUntil) return;
          if (e.shiftKey && !linkSource) { toggleSelect(node.id); return; }
          handleNodeClick(node.id);
        };
        el.onmousedown = (e) => startDrag(e, node.id);

        // Passivos giram dentro de um invólucro: o desenho e as portas rodam juntos
        let host = el;
        if (passive) {
          host = document.createElement('div');
          host.className = `relative rounded-xl ${marks}`;
          host.style.transform = `rotate(${node.rot || 0}deg)`;
          el.appendChild(host);
        }

        if (isCTO(node)) host.innerHTML = renderCTO(node);
        else if (node.type === 'tap') host.innerHTML = renderTAP(node);
        else if (node.type === 'ont') host.innerHTML = renderONT(node);
        else if (isNetDev(node)) host.innerHTML = renderNetDev(node);
        else if (node.type === 'spl12') host.innerHTML = renderSplSVG(node);
        else if (node.type === 'pto') host.innerHTML = renderPTOSVG(node);
        else if (node.type === 'modem') host.innerHTML = renderEMTA3896(node);
        else if (EQUIP[node.type]) host.innerHTML = renderTV(node);
        else if (isDiv(node.type)) host.innerHTML = renderSplitterSVG(node);
        else if (isDC(node.type)) host.innerHTML = renderDCSVG(node);
        else if (isAtt(node.type)) host.innerHTML = renderAttSVG(node);
        else if (isIso(node.type)) host.innerHTML = renderIsoSVG(node);
        else if (isLock(node.type)) host.innerHTML = renderLockSVG(node);
        if (isDevice(node)) {   // diagnóstico direto no equipamento
          const sst = isEndpoint(node) ? statusOf(node) : NET_ST[netState(node).st];
          const b = document.createElement('button');
          b.className = 'card-diag ' + (sst === 'ok' ? '' : sst === 'warn' ? 'warn' : 'bad');
          b.title = 'Diagnóstico deste equipamento';
          b.innerHTML = '<i class="fa-solid fa-stethoscope"></i>';
          b.onmousedown = e => e.stopPropagation();
          b.onclick = e => { e.stopPropagation(); openDevDiag(node.id); };
          el.appendChild(b);
        }

        layer.appendChild(el);
        if (!passive) {
          node._w = el.offsetWidth;
          node._h = el.offsetHeight;
        }

        // Portas clicáveis sobre os conectores
        if (node.type !== 'tap') host.appendChild(makePortEl(node, 'in', null, isTarget));
        else if (isDioAzul(node) || isMDU(node)) {   // entrada do DIO / da NAP MDU (fibra que chega na caixa): só indicação
          const e = document.createElement('div'), pp = portPos(node, 'in');
          e.className = 'port ' + (isMDU(node) ? 'port-mdu-in' : 'port-dio-in'); e.title = isMDU(node) ? 'E (entrada da fibra na NAP MDU)' : 'IN (entrada da fibra no DIO)';
          e.style.left = (pp.lx - 8) + 'px'; e.style.top = (pp.ly - 8) + 'px';
          host.appendChild(e);
        }
        outPorts(node).forEach(p => host.appendChild(makePortEl(node, p.id, p, false)));

        // Alça de rotação (aparece no passivo selecionado)
        if (passive && !noRotate(node) && selectedNodeId === node.id && selection.size < 2) {
          const h = document.createElement('div');
          h.className = 'rot-handle';
          h.title = 'Arraste para girar (passos de 15°). Tecla R gira 90°.';
          h.innerHTML = '<i class="fa-solid fa-rotate"></i>';
          h.onmousedown = (e) => { e.stopPropagation(); e.preventDefault(); rotDrag = { id: node.id }; };
          h.onclick = (e) => e.stopPropagation();
          host.appendChild(h);
        }
      });
    }

    function makePortEl(node, portId, port, isOpenTarget) {
      const pos = portPos(node, portId);
      const b = document.createElement('button');
      b.type = 'button';
      let cls = 'port ';
      if (!port) {
        cls += 'port-in' + (isOpenTarget ? ' port-open' : '');
        b.title = inputConn(node.id) ? 'IN (entrada) — clique para selecionar o cabo' : 'IN (entrada)';
      } else {
        const used = portConn(node.id, portId);
        const isSrc = linkSource && linkSource.nodeId === node.id && linkSource.portId === portId;
        const needLock = NODE_DEFS[node.type] && !isOptPassive(node.type);
        cls += isSrc ? 'port-src' : (used && !port.multi ? 'port-used' : (needLock ? 'port-warn' : 'port-free'));
        const lossTxt = port.loss ? ` · −${port.loss} dB` : '';
        b.title = `${port.label}${lossTxt}` + (used && !port.multi ? ` — ligado a ${byId(used.to) ? byId(used.to).name : ''}` : (needLock ? ' — livre: ligue um cabo ou coloque TRAVA LOCK' : ' — clique para puxar um cabo'));
      }
      if (port && port.id === 'wifi') { cls += ' port-wifi'; b.innerHTML = '<i class="fa-solid fa-wifi"></i>'; }
      if (port && port.fast) cls += ' port-fast';   // LAN 2,5G / 10G
      if (port && isDioAzul(node) && Number(String(port.id).replace('out', '')) <= DIO_LAT) cls += ' port-dio';   // portas vermelhas do DIO
      b.className = cls;
      b.style.left = (pos.lx - 8) + 'px';
      b.style.top = (pos.ly - 8) + 'px';
      b.onmousedown = (e) => e.stopPropagation();
      b.onclick = (e) => {
        e.stopPropagation();
        if (port) handlePortClick(node.id, portId);
        else handleInputClick(node.id);
      };
      return b;
    }

    function statusBadge(status) {
      const s = ST[status];
      return `<span class="shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold flex items-center gap-1 ${s.chip}"><i class="fa-solid ${s.icon}"></i>${s.label}</span>`;

    function renderEMTA3896(n) { return renderGwTower(n); }
    // Torre do EMTA/ONT: LEDs, níveis, estado, redes Wi-Fi configuradas e o painel de portas LAN na lateral direita
    function renderGwTower(n) {
      const d = diagnose(n, false), ont = n.type === 'ont', m = ontModel(n), sp = gwSpeeds(n);

        const c = portConn(n.id, 'lan' + (i + 1)), dev = c && byId(c.to);
        return `<div class="gw-lan ${g > 1 ? 'fast' : ''} ${dev ? 'used' : ''}" style="top:${GW_LAN_TOP + i * GW_LAN_STEP - 11}px" title="LAN ${i + 1} · ${fmtGbps(g)}${dev ? ' — ' + esc(dev.name) : ''}"><b>${i + 1}</b><small>${String(g).replace('.', ',')}G</small></div>`;
      }).join('');
      const netsHTML = !nets ? `<div class="gw-nets-off"><i class="fa-solid fa-wifi"></i> Wi-Fi não configurado</div>`
        : !nets.length ? `<div class="gw-nets-off text-amber-300"><i class="fa-solid fa-wifi"></i> Nenhuma rede Wi-Fi ativa</div>`
        : nets.slice(0, 4).map(w => `<div class="gw-net" title="${esc(w.ssid)} · ${esc(wifiBandLabel(w))}${w.iot ? ' · IoT' : ''}"><span class="gw-net-name"><i class="fa-solid fa-wifi ${w.iot ? 'text-amber-400' : 'text-sky-400'}"></i> ${esc(w.ssid)}</span><span class="gw-band">${w.iot ? 'IoT' : /5|6/.test(w.band || '') && /2/.test(w.band || '') ? '2,4+5' : /6/.test(w.band || '') ? '6G' : /5/.test(w.band || '') ? '5G' : '2,4G'}</span>${w.sec === 'NENHUM' ? '<span class="gw-pass">aberta</span>' : w.pass ? `<span class="gw-pass"><i class="fa-solid fa-key"></i> ${esc(w.pass)}</span>` : ''}</div>`).join('') + (nets.length > 4 ? `<div class="gw-nets-off">+${nets.length - 4} redes</div>` : '');
      return `
        <div class="gw-tower border-2 ${ST[d.status].border}" style="width:${GW_W}px;min-height:${minH}px">
          <div class="gw-vent"></div>
          <div class="gw-lanpanel"><span class="gw-lanpanel-t">LAN</span>${lans}</div>
          <div class="gw-body">
            <div class="gw-head">
              ${m ? `<img src="${m.img}" alt="" class="gw-img">` : ''}
              <div class="min-w-0">

                <span class="text-[11.5px] text-slate-400 block truncate">${ont ? (m ? `${esc(m.label)} · ${esc(m.tec)}` : 'ONT/ONU · ' + esc((originOf(n) || {}).tec || 'GPON')) : 'Sagemcom F@st3896 · D3.1'}</span>
              </div>
            </div>
            <div class="gw-leds">${led('on', 'Power')}${led(sinal, ont ? 'PON' : 'DS/US')}${led(['ok', 'warn'].includes(d.status) ? 'on' : '', 'Online')}${led(nets && nets.length ? 'on wifi' : '', 'Wi-Fi')}<span>${ont ? 'PWR · PON · NET · WIFI' : 'PWR · DS/US · NET · WIFI'}</span></div>
            <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 font-mono text-[13px]">

            ${ont && ontTecAlert(n) ? '<div class="mt-1 text-[11px] leading-snug text-amber-300"><i class="fa-solid fa-triangle-exclamation"></i> Rede marcada como GPON</div>' : ''}

    function svgEl(tag, attrs) {

    function renderConnections() {
      const svg = document.getElementById('svg-connections');
      svg.innerHTML = '';
      drawPendingCable(svg);

      connections.forEach(conn => {
        const fromNode = byId(conn.from);
        const toNode = byId(conn.to);
        if (!fromNode || !toNode) return;

        if (dockedMini(fromNode) && dockedMini(fromNode).id === toNode.id) return;   // encostado: sem cabo visível
        if (dockedLock(toNode)) return;
        // O cabo sai do conector da porta de origem e chega no conector IN do destino
        const pa = portPos(fromNode, conn.fromPort), pb = portPos(toNode, 'in'), geo = cableGeom(pa, pb);
        const { d, midX, midY } = geo;

        let strokeColor = theme === 'light' ? '#0284c7' : '#38bdf8';
        let strokeWidth = 3;
        if (conn.cableType === 'RG6 Preto') strokeColor = theme === 'light' ? '#1e293b' : '#475569';
        else if (conn.cableType === 'RG11') { strokeColor = theme === 'light' ? '#6366f1' : '#818cf8'; strokeWidth = 5; }
        const gparts = isGponCable(conn.cableType) ? gponStrokeParts(conn.cableType, theme === 'light', conn.band) : null;
        if (gparts) { const top = gparts[gparts.length - 1]; strokeColor = top.stroke; strokeWidth = Math.max(3, gparts[0].w); }

        const selected = selectedConnectionId === conn.id;
        const pick = (e) => { e.stopPropagation(); linkSource = null; selectConnection(conn.id); };

        if (selected) svg.appendChild(svgEl('path', { d, stroke: '#e0f2fe', 'stroke-width': strokeWidth + 5, 'stroke-opacity': 0.35, fill: 'none', 'stroke-linecap': 'round' }));
        if (gparts) gparts.forEach(pt => svg.appendChild(svgEl('path', { d, stroke: pt.stroke, 'stroke-width': pt.w, 'stroke-opacity': pt.op, ...(pt.dash ? { 'stroke-dasharray': pt.dash } : {}), fill: 'none', 'stroke-linecap': 'round' })));
        else svg.appendChild(svgEl('path', { d, stroke: strokeColor, 'stroke-width': strokeWidth, fill: 'none', 'stroke-linecap': 'round' }));
        const nmHTML = numeradorSVG(conn, pa, pb, geo);   // numerador na saída do TAP/DG/DIO/NAP
        if (nmHTML) {
          const gg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          gg.innerHTML = nmHTML;
          gg.style.pointerEvents = 'auto';
          gg.style.cursor = 'pointer';
          gg.onclick = pick;
          svg.appendChild(gg);
        }
        tapeDots(conn, pa, pb, geo).forEach(q => {   // alerta: fita autofusão nos conectores do DIO e da ONT

        const hit = svgEl('path', { d, stroke: 'transparent', 'stroke-width': 14, fill: 'none' });
        hit.style.pointerEvents = 'stroke';
        hit.style.cursor = 'pointer';
        hit.onclick = pick;
        svg.appendChild(hit);

        // Etiqueta no meio do cabo (ponto médio da curva)
        if (!selected && (!showCableLabels || !(Number(conn.length) > 0 || isGponCable(conn.cableType)))) return;   // ligação direta (0 m) não mostra etiqueta
        const label = cableLabel(conn);

        const g = svgEl('g', {});

    // Ponto da curva do cabo em t (0..1)
    // Fita autofusão: fibra ligada no DIO e na ONT leva fita no conector (0 = ponta do DIO, 1 = ponta da ONT).
    // NAP não leva; cordão óptico não leva.
    function tapeEnds(c) {
      if (!isGponCable(c.cableType) || isNetCable(c.cableType) || c.cableType === 'Cordão óptico') return [];
      const ends = [];
      if (isDIO(byId(c.from))) ends.push(0);
      if (byId(c.to) && byId(c.to).type === 'ont') ends.push(1);
      return ends;
    }
    const tapeCount = () => connections.reduce((t, c) => t + tapeEnds(c).length, 0);
    // Numerador do cabo na saída da origem (TAP, DG, DIO, NAP): padrão nº 100, no HFC e no GPON
    const NUM_PADRAO = '100';
    function numerador(c) {
      const f = byId(c.from);
      if (!f || f.type !== 'tap' || isNetCable(c.cableType)) return null;
      const porta = Number(String(c.fromPort).replace('out', ''));
      if (!porta) return null;
      const cor = isCTO(f) ? (isDIO(f) ? 'amarelo' : napMount(f) === 'cordoalha' ? 'preto' : 'amarelo') : isDG(f) ? 'amarelo' : 'preto';
      const num = String(c.num || '').trim() || NUM_PADRAO;
      return { num, cor, porta, editado: !!String(c.num || '').trim(), aneis: num.replace(/\s/g, '').length };
    }
    const NUM_COR = { amarelo: { bg: '#f59e0b', fg: '#111827', bd: '#92400e' }, preto: { bg: '#111827', fg: '#7dd3fc', bd: '#475569' } };
    // Posição do numerador: sobre o cabo, a ~34 px da porta de origem
    function numeradorPos(a, b, g) {
      const len = Math.hypot(b.x - a.x, b.y - a.y) * 1.25 + 1;
      return bezierAt(a, g, b, Math.min(0.42, 34 / len));
    }
    function numeradorSVG(c, a, b, g) {
      const nm = numerador(c);
      if (!nm) return '';
      const q = numeradorPos(a, b, g), k = NUM_COR[nm.cor], w = 8 + Math.max(1, nm.num.length) * 7.5;
      return `<g><title>Numerador ${nm.cor} nº ${nm.num}</title><rect x="${(q.x - w / 2).toFixed(1)}" y="${(q.y - 8).toFixed(1)}" width="${w}" height="16" rx="3" fill="${k.bg}" stroke="${k.bd}" stroke-width="1"/><text x="${q.x.toFixed(1)}" y="${(q.y + 4.5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace, monospace" fill="${k.fg}">${esc(nm.num)}</text></g>`;
    }
    function updateNumerador(val) {
      const c = connById(selectedConnectionId);
      if (!c || !numerador(c)) return;

      if (t) c.num = t; else delete c.num;
      refresh();

    // Editor do numerador no painel do cabo/fibra (no lugar da antiga "Porta de origem")
    function numeradorEditorHTML(c, src) {

    // Checklist de instalação: cada item ✔ (ok), ⚠ (falta) ou – (não se aplica)
    function checklistItems() {
      const it = [], add = (st, txt, det) => it.push({ st, txt, det: det || '' });
      const eps = nodes.filter(isEndpoint), net = nodes.filter(isNetDev), nm = numeradorContagem();
      const wifi = net.map(n => ({ n, c: inputConn(n.id) })).filter(x => x.c && x.c.cableType === 'Wi-Fi');
      if (isGpon()) {

        const al = originAlerts();

        const bad = eps.filter(n => statusOf(n) !== 'ok');
        add(!eps.length ? 'na' : bad.length ? 'warn' : 'ok', 'Equipamentos dentro do padrão (CA/CB/RX/TX)', bad.map(n => n.name + ' (' + ST[statusOf(n)].label.toLowerCase() + ')').join(', '));
      }

      add(!wifi.some(x => x.n.type !== 'camera') ? 'na' : wifiRuim.length ? 'warn' : 'ok', 'Wi-Fi em 5 GHz com RSSI até −60 dBm', wifiRuim.map(x => x.n.name).join(', '));
      const sbWifi = wifi.filter(x => x.n.type === 'soundbox');

      add(!net.some(n => n.type === 'camera') ? 'na' : camSemIoT.length ? 'warn' : 'ok', 'Câmera Wi-Fi com rede IoT (2,4 GHz) habilitada', camSemIoT.map(n => n.name).join(', '));
      return it;
    }
    function checklistHTML(num) {
      const ICON = { ok: ['fa-circle-check', 'text-emerald-400'], warn: ['fa-triangle-exclamation', 'text-amber-400'], na: ['fa-minus', 'text-slate-600'] };
      const items = checklistItems(), pend = items.filter(i => i.st === 'warn').length;
      return `<div>
            <h3 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-3">${num}. Checklist de instalação · ${isGpon() ? 'GPON / XGS-PON' : 'HFC'}</h3>
            <p class="text-[11px] mb-2 ${pend ? 'text-amber-300' : 'text-emerald-400'}">${pend ? `${pend} item${pend > 1 ? 's' : ''} pendente${pend > 1 ? 's' : ''}` : 'Tudo conferido'}</p>
            <ul class="space-y-1">${items.map(i => `<li class="flex items-start gap-2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-[11.5px]"><i class="fa-solid ${ICON[i.st][0]} ${ICON[i.st][1]} mt-0.5"></i><span class="${i.st === 'na' ? 'text-slate-400' : 'text-slate-200'}">${esc(i.txt)}${i.st === 'na' ? ' · não se aplica' : ''}${i.det ? `<span class="block text-[10.5px] ${i.st === 'warn' ? 'text-amber-300' : 'text-slate-400'}">${esc(i.det)}</span>` : ''}</span></li>`).join('')}</ul>
          </div>`;
    }
    function numeradorContagem() {
      const t = { amarelo: { cabos: 0, aneis: 0 }, preto: { cabos: 0, aneis: 0 } };
      connections.forEach(c => { const nm = numerador(c); if (nm) { t[nm.cor].cabos++; t[nm.cor].aneis += nm.aneis; } });
      return t;
    }
    const numCardTxt = x => `${x.cabos} cabo${x.cabos > 1 ? 's' : ''} · ${x.aneis} ${x.aneis > 1 ? 'anéis' : 'anel'}`;
    // Ponto amarelo de alerta junto do conector (a ~22 px dele, sobre o cabo)
    function tapeDots(c, a, b, g) {
      const len = Math.hypot(b.x - a.x, b.y - a.y) * 1.25 + 1;
      const dt = Math.min(0.35, 22 / len);
      return tapeEnds(c).map(end => ({ ...bezierAt(a, g, b, end === 0 ? dt : 1 - dt), end }));
    }
    const tapeText = (c, end) => `Fita autofusão obrigatória no conector ${end === 0 ? 'do DIO (' + ((byId(c.from) || {}).name || 'CTO') + ')' : 'da ONT'}.`;
    const tapeSVGString = (c, dots) => dots.map(q => `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="5" fill="#facc15" stroke="#854d0e" stroke-width="1.5"><title>${esc(tapeText(c, q.end))}</title></circle>`).join('');
    function bezierAt(a, g, b, t) {
      const u = 1 - t;
      return {
        x: u * u * u * a.x + 3 * u * u * t * g.c1.x + 3 * u * t * t * g.c2.x + t * t * t * b.x,
        y: u * u * u * a.y + 3 * u * u * t * g.c1.y + 3 * u * t * t * g.c2.y + t * t * t * b.y
      };
    }
    // Cabo mais próximo de (wx, wy) entre os que passam no filtro
    function nearestCable(wx, wy, filter, maxDist) {
      let best = null;
      connections.forEach(c => {
        const f = byId(c.from), t = byId(c.to);
        if (!f || !t || !filter(c, f, t)) return;
        const a = portPos(f, c.fromPort), b = portPos(t, 'in'), g = cableGeom(a, b);
        for (let i = 0; i <= 60; i++) {
          const pt = bezierAt(a, g, b, i / 60), d = Math.hypot(pt.x - wx, pt.y - wy);
          if (!best || d < best.d) best = { c, d, a, b, g };
        }
      });
      return best && best.d <= maxDist ? best : null;
    }
    // Cabo drop novo saindo do TAP: põe o CABLE ISOLATOR no meio dele, seguido de RG6 Branco curto
    function autoIsoOnDrop(conn) {
      const f = byId(conn.from), t = byId(conn.to);
      if (!f || !t || isIso(t.type)) return false;
      const iso = { id: uid('node'), type: 'iso', name: 'CABLE ISOLATOR', x: 0, y: 0, rot: 0, signals: {} };
      nodes.push(iso);
      const g = cableGeom(portPos(f, conn.fromPort), portPos(t, 'in'));
      if (!autoInsertIsolator(iso.id, g.midX, g.midY, false) || !connections.some(c => c.to === iso.id && c.id === conn.id)) {
        nodes = nodes.filter(n => n.id !== iso.id);
        connections = connections.filter(c => c.from !== iso.id && c.to !== iso.id);
        refresh();
        return false;
      }
      showToast(`Cabo ${conn.cableType} de ${conn.length} m ligado com CABLE ISOLATOR e cabo RG6 Branco até o ${t.name}.`, 'success');
      return true;
    }
    // CABLE ISOLATOR: entra em cabo RG6 Preto ou RG11, logo após a etiqueta de metragem.
    // MINI ISOLATOR: entra em cabo RG6 Branco, entre o cabo e o EMTA / Decoder / Box TV.
    function autoInsertIsolator(id, wx, wy, fromDock) {
      const n = byId(id);
      if (!n || !isIso(n.type)) return false;
      const mini = n.type === 'miniiso';
      const notIso = (f, t) => !isIso(f.type) && !isIso(t.type) && f.id !== id && t.id !== id;
      const filter = mini
        ? (c, f, t) => c.cableType === 'RG6' && isEndpoint(t) && t.type !== 'ont' && f.type !== 'miniiso' && t.id !== id && f.id !== id
        : (c, f, t) => (c.cableType === 'RG6 Preto' || c.cableType === 'RG11') && notIso(f, t);
      const hit = nearestCable(wx, wy, filter, 90);
      if (!hit) {
        if (fromDock) showToast(mini
          ? 'Solte o MINI ISOLATOR sobre um cabo RG6 Branco que chega num EMTA, Decoder ou Box TV para ligar sozinho.'
          : 'Solte o CABLE ISOLATOR sobre um cabo RG6 Preto ou RG11 para ligar sozinho.', 'info');
        return false;
      }
      const c = hit.c, dest = byId(c.to), src = byId(c.from);
      const sz = nodeSize(n);
      let cx, cy, ang;
      if (mini) {
        // encostado na entrada do equipamento, com a saída voltada para ele
        const b = hit.b;
        cx = b.x + b.vx * (sz.w / 2 - 5);
        cy = b.y + b.vy * (sz.w / 2 - 5);
        ang = Math.atan2(-b.vy, -b.vx) * 180 / Math.PI;
      } else {
        // um pouco depois da etiqueta (meio do cabo), seguindo a direção do cabo
        const labelHalf = (cableLabel(c).length * 6.6 + 14) / 2;
        const mid = bezierAt(hit.a, hit.g, hit.b, 0.5);
        let t = 0.5, prev = mid, dist = 0;
        while (t < 0.95 && dist < labelHalf + sz.w / 2 + 10) {
          t += 0.01;
          const pt = bezierAt(hit.a, hit.g, hit.b, t);
          dist += Math.hypot(pt.x - prev.x, pt.y - prev.y);
          prev = pt;
        }
        const p2 = bezierAt(hit.a, hit.g, hit.b, Math.min(1, t + 0.02));
        cx = prev.x; cy = prev.y;
        ang = Math.atan2(p2.y - prev.y, p2.x - prev.x) * 180 / Math.PI;
      }
      n.rot = ((Math.round(ang / 15) * 15) % 360 + 360) % 360;
      n.x = Math.max(0, cx - sz.w / 2);
      n.y = Math.max(0, cy - sz.h / 2);
      const type = c.cableType;
      c.to = n.id;
      connections.push({ id: uid('conn'), from: n.id, fromPort: 'out', to: dest.id, cableType: 'RG6', length: ISO_TAIL_M });   // depois do CABLE ISOLATOR: cabo RG6 Branco curto
      selection.clear();
      selectedNodeId = n.id;
      selectedConnectionId = null;
      refresh();
      showToast(`${n.name} ligado no cabo ${type} (${src.name} → ${dest.name}).`, 'success');
      return true;
    }

    // Curva do cabo entre duas portas (usada no mapa e no relatório)
    function cableGeom(a, b) {
      const k = Math.max(30, Math.min(130, Math.hypot(b.x - a.x, b.y - a.y) * 0.45));
      const c1 = { x: a.x + a.vx * k, y: a.y + a.vy * k };
      const c2 = { x: b.x + b.vx * k, y: b.y + b.vy * k };
      return {
        d: `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`,
        midX: (a.x + 3 * c1.x + 3 * c2.x + b.x) / 8,
        midY: (a.y + 3 * c1.y + 3 * c2.y + b.y) / 8,
        c1, c2
      };
    }
    const cableLabel = c => isGponCable(c.cableType) ? gponCableLabel(c) : Number(c.length) > 0 ? `${c.length}m ${c.cableType}` : `direto · ${c.cableType === 'RG6' ? 'RG6 Branco' : c.cableType}`;

    // --- SELECTION & PROPERTIES ---
    function drawPendingCable(svg) {

      const k = Math.max(30, Math.min(130, Math.hypot(b.x - a.x, b.y - a.y) * 0.45));
      const d = `M ${a.x} ${a.y} C ${a.x + a.vx * k} ${a.y + a.vy * k}, ${b.x + b.vx * k} ${b.y + b.vy * k}, ${b.x} ${b.y}`;
      svg.appendChild(svgEl('path', { d, stroke: CABLE_STYLE[pendingConn.cableType], 'stroke-width': 3, 'stroke-dasharray': '8 6', fill: 'none', 'stroke-linecap': 'round' }));

    // Botão Diagnóstico: abre o painel com o diagnóstico; se ele já estiver aberto, fecha
    function toggleDiagnostics() {
      const pnl = document.getElementById('properties-panel');

    // Encostar um aparelho num MINI ISOLATOR com a saída livre (ou o mini no aparelho) liga os dois sem cabo
    function snapMini(id) {
      const n = byId(id);
      if (!n) return false;
      const distToCard = (pt, e) => {
        const sz = nodeSize(e);
        const dx = Math.max(e.x - pt.x, 0, pt.x - (e.x + sz.w)), dy = Math.max(e.y - pt.y, 0, pt.y - (e.y + sz.h));
        return Math.hypot(dx, dy);
      };

      if (n.type === 'miniiso' && !portConn(n.id, 'out')) {
        const pt = portPos(n, 'out');
        pairs = nodes.filter(e => isEndpoint(e) && !inputConn(e.id)).map(e => ({ m: n, e, d: distToCard(pt, e) }));
      } else if (isEndpoint(n) && !inputConn(n.id)) {
        pairs = nodes.filter(m => m.type === 'miniiso' && !portConn(m.id, 'out')).map(m => ({ m, e: n, d: distToCard(portPos(m, 'out'), n) }));
      }
      pairs = pairs.filter(x => x.d <= 28 && x.m.id !== x.e.id).sort((a, b) => a.d - b.d);
      if (!pairs.length) return false;
      const { m, e } = pairs[0];
      connections.push({ id: uid('conn'), from: m.id, fromPort: 'out', to: e.id, cableType: 'RG6', length: 0 });

      selectedConnectionId = null;
      selectedNodeId = e.id;

    // Botão "Correção": abre o ponto e leva direto para "Como corrigir", com destaque

    function buildClip(ids) {

        nodes.push({ id, type: c.type, name, x: Math.max(0, c.x + off), y: Math.max(0, c.y + off), rot: c.rot, ...(c.type === 'tap' ? { vias: c.vias, ...(c.model ? { model: c.model } : {}) } : {}), ...((c.type === 'ont' && ONT_MODELS[c.model]) || tvModelOk(c.type, c.model) ? { model: c.model } : {}), inSide: c.inSide, outSide: c.outSide, signals: JSON.parse(JSON.stringify(c.signals)) });
