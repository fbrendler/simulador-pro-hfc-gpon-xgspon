                  <option value="5" ${c.band !== '2.4' ? 'selected' : ''}>5 GHz</option><option value="2.4" ${c.band === '2.4' ? 'selected' : ''}>2,4 GHz</option>
                </select></label>
              <label class="block"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">RSSI (dBm)</span>
                <input type="text" inputmode="decimal" placeholder="ex.: -55" value="${sigVal(c.rssi) == null ? '' : esc(c.rssi)}" onchange="updateWifi('rssi', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200 font-mono font-bold"></label>
            </div>
            ${wifiBad(c, dev) ? `<p class="text-[11px] text-amber-300 leading-snug"><i class="fa-solid fa-triangle-exclamation"></i> ${dev.type === 'camera' ? 'A Câmera Wi-Fi usa a rede 2,4 GHz.' : wifiRule()}</p>` : `<p class="text-[11px] text-slate-400 leading-snug">${dev.type === 'camera' ? 'Câmera Wi-Fi: rede 2,4 GHz.' : wifiRule()}</p>`}
            ${isEcoEquip(ont) ? `<p class="text-[11px] text-slate-400 leading-snug"><i class="fa-solid fa-sliders text-sky-400"></i> Para escolher a rede e digitar a senha, configure ${ont.type === 'modem' ? 'o' : 'a'} ${esc(ont.name)} em <b>Acessar página de configuração</b>.</p>` : ''}`}
          <div><span class="net-chip net-${ns.st}">● ${ns.text}</span><p class="text-[11px] text-slate-400 mt-1">${esc(ns.why)}</p></div>
        </div>`;
    }
    // Relatório HFC: materiais de rede (RJ45) e situação dos pontos de TV via IP
    function netReportHTML() {
      if (!nodes.some(isNetDev)) return '';
      let rjM = 0, rjN = 0, patches = 0, wifiN = 0;
      connections.forEach(c => { if (c.cableType === 'RJ45') { rjN++; rjM += Number(c.length || 0); } else if (c.cableType === 'RJ45 1,5 m') patches++; else if (c.cableType === 'Wi-Fi') wifiN++; });
      const card = (t, v) => `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block font-semibold">${t}</span><strong class="text-lg text-slate-100 font-mono">${v}</strong></div>`;
      const list = nodes.filter(isNetDev).map(n => { const ns = netState(n), c = inputConn(n.id); return `<div class="flex justify-between gap-2 border-b border-slate-800/70 py-0.5 text-xs"><span class="text-slate-300">${esc(n.name)} · ${c ? esc(gponCableLabel(c)) + (c.cableType === 'RJ45' ? ' · ' + ultraCost(n) : '') + (c.cableType === 'Wi-Fi' ? ' ' + (c.band === '2.4' ? '2,4' : '5') + ' GHz' + (sigVal(c.rssi) != null ? ' · RSSI ' + fmtDb(sigVal(c.rssi)) : '') : '') : 'não ligado'}</span><b class="${ns.st === 'on' ? 'text-emerald-400' : ns.st === 'warn' ? 'text-amber-400' : 'text-rose-400'}">${esc(ns.text)}</b></div>`; }).join('');
      return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">${card('PONTO ULTRA (RJ45)', rjM + 'm')}${card('RJ45 1,5 m', patches + ' un.')}${card('Conectores RJ45', 2 * (rjN + patches) + ' un.')}${card('Pontos por Wi-Fi', wifiN + ' un.')}</div>
        <div class="mt-3 bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block font-semibold mb-1.5">Pontos de TV e dispositivos na rede</span>${list}</div>`;
    }
    function netDevPanelHTML(n) {
      const ns = netState(n), c = inputConn(n.id);
      return `
        <div class="border-t border-slate-800 pt-2 space-y-1.5">
          <label class="text-[10px] font-bold text-sky-400 uppercase tracking-wider block">${isTvPoint(n) ? 'Ponto de TV' : 'Dispositivo na rede'}</label>
          <div><span class="net-chip net-${ns.st}">● ${ns.text}</span></div>
          <p class="text-[11px] text-slate-400 leading-snug">${esc(ns.why)}</p>
          ${ns.iot ? `<button onclick="openEquipConfig('${esc(ns.iot)}')" class="w-full py-1.5 rounded-lg text-[11px] font-bold" style="color:#0f172a;background:#38bdf8"><i class="fa-solid fa-sliders"></i> Habilitar a rede IoT na configuração</button>` : ''}
          ${ns.st === 'off' && !ns.iot && !ns.box ? `<button onclick="openConnectMenu('${esc(n.id)}', this)" class="w-full py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/60 text-[11px] text-rose-200 font-bold"><i class="fa-solid fa-plug"></i> Conectar (cabo, Wi-Fi ou PONTO ULTRA)</button>` : ''}
          ${c ? `<button data-id="${esc(c.id)}" onclick="selectConnection(this.dataset.id)" class="w-full py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold">Editar a ligação (${esc(gponCableLabel(c))})</button>` : ''}
          <p class="text-[10px] text-slate-400 leading-snug">${usesPatch(n) ? NET_DEV[n.type].label + ' via IP: Wi-Fi, cabo RJ45 1,5 m ou PONTO ULTRA (acima de 1,5 m).' : n.type === 'soundbox' ? 'Sound Box: de preferência PONTO ULTRA; Wi-Fi não recomendado.' : NET_DEV[n.type].label + ': Wi-Fi ou PONTO ULTRA (cabo de rede em metros).'} ${isTvPoint(n) ? 'Até ' + NET_MAX_TV + ' pontos de TV ' + GW().por + '.' : 'Dispositivo da rede do cliente.'} ${wifiRule()}</p>
        </div>`;
    }
    function updateCableLength(val) {
      const c = connById(selectedConnectionId);
      if (c && c.cableType === 'Cordão óptico') { showToast('Cordão óptico: comprimento fixo de 1,5 m.', 'info'); renderProperties(); return; }
      if (c) {
        const v = parseFloat(val);
        c.length = (isNaN(v) || v < 0) ? 1 : v;
        if (c.cableType === 'RG11' && rg11Problem(byId(c.from), c.length)) {
          c.cableType = rg11Fallback(byId(c.from));
          showToast(`Com ${c.length} m o RG11 não é permitido (só acima de ${RG11_MIN} m): cabo trocado para ${c.cableType}.`, 'warning');
        }
        refresh();
      }
    }

    function updateCablePort(portId) {
      const c = connById(selectedConnectionId);
      if (!c) return;
      const src = byId(c.from);
      const p = portInfo(src, portId);
      if (p && (p.multi || !portConn(src.id, portId))) c.fromPort = portId;
      refresh();
    }

    function updateLimit(key, val) {
      limits = { ...DEFAULT_LIMITS }; refresh(); return;   // níveis padrão são fixos
      const v = parseFloat(val);
      if (!isNaN(v) && key in limits) limits[key] = key === 'margin' ? Math.max(0, v) : v;
      refresh();
    }

    function resetLimits() {
      limits = { ...DEFAULT_LIMITS };
      refresh();
    }

    function deleteSelectedNode() {
      if (!selectedNodeId) return;
      nodes = nodes.filter(n => n.id !== selectedNodeId);
      connections = connections.filter(c => c.from !== selectedNodeId && c.to !== selectedNodeId);
      if (linkSource && linkSource.nodeId === selectedNodeId) linkSource = null;
      selectedNodeId = null;
      selection.clear();
      refresh();
    }

    function deleteSelectedConnection() {
      if (!selectedConnectionId) return;
      connections = connections.filter(c => c.id !== selectedConnectionId);
      selectedConnectionId = null;
      refresh();
    }

    // --- ARRASTAR, MOVER O MAPA, TOQUE E TECLADO ---
    function onPointerMove(x, y, ev) {
      if (mmDrag) { minimapGo(x, y); return; }
      if (rotDrag) {
        const n = byId(rotDrag.id);
        if (!n) return;
        const r = document.getElementById('nodes-layer').getBoundingClientRect();
        const sz = nodeSize(n);
        const ang = Math.atan2(y - (r.top + (n.y + sz.h / 2) * view.zoom), x - (r.left + (n.x + sz.w / 2) * view.zoom)) * 180 / Math.PI + 90;
        const snapped = ((Math.round(ang / 15) * 15) % 360 + 360) % 360;
        if (snapped !== (n.rot || 0)) {
          n.rot = snapped;
          rotDrag.moved = true;
          renderNodes();
          renderConnections();
        }
        return;
      }
      if (marquee) {
        const c = document.getElementById('canvas-container').getBoundingClientRect();
        marquee.x = x; marquee.y = y;
        const el = document.getElementById('marquee');
        el.style.display = 'block';
        el.style.left = (Math.min(marquee.sx, x) - c.left) + 'px';
        el.style.top = (Math.min(marquee.sy, y) - c.top) + 'px';
        el.style.width = Math.abs(x - marquee.sx) + 'px';
        el.style.height = Math.abs(y - marquee.sy) + 'px';
        return;
      }
      if (pan) {
        const dx = x - pan.sx, dy = y - pan.sy;
        if (!pan.moved && Math.hypot(dx, dy) < 4) return;
        pan.moved = true;
        document.getElementById('canvas-container').style.cursor = 'grabbing';
        view.x = pan.vx + dx;
        view.y = pan.vy + dy;
        applyView();
        return;
      }
      if (!drag) return;
      if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) < 4) return;
      drag.moved = true;
      const p0 = drag.orig.find(o => o.id === drag.id);
      let nx = p0.x + (x - drag.sx) / view.zoom, ny = p0.y + (y - drag.sy) / view.zoom;
      if (snapOn && !(ev && ev.altKey)) { nx = Math.round(nx / GRID) * GRID; ny = Math.round(ny / GRID) * GRID; }
      let dx = nx - p0.x, dy = ny - p0.y;
      dx = Math.max(dx, -Math.min(...drag.orig.map(o => o.x)));
      dy = Math.max(dy, -Math.min(...drag.orig.map(o => o.y)));
      drag.orig.forEach(o => { const n = byId(o.id); if (n) { n.x = o.x + dx; n.y = o.y + dy; } });
      renderNodes();
      renderConnections();
    }

    function onPointerUp() {
      if (mmDrag) { mmDrag = false; drawMinimap(); }
      if (rotDrag) {
        rotDrag = null;
        suppressClickUntil = Date.now() + 250;
        renderProperties();
        scheduleCommit();
      }
      if (marquee) {
        const el = document.getElementById('marquee');
        el.style.display = 'none';
        if (Math.hypot(marquee.x - marquee.sx, marquee.y - marquee.sy) > 4) {
          const a = screenToWorld(Math.min(marquee.sx, marquee.x), Math.min(marquee.sy, marquee.y));
          const b = screenToWorld(Math.max(marquee.sx, marquee.x), Math.max(marquee.sy, marquee.y));
          const hit = nodes.filter(n => {
            const s = nodeSize(n);
            return n.x < b.x && n.x + s.w > a.x && n.y < b.y && n.y + s.h > a.y;
          }).map(n => n.id);
          const ids = marquee.add ? [...new Set([...selectedIds(), ...hit])] : hit;
          linkSource = null;
          setSelection(ids);
          render();
          suppressClickUntil = Date.now() + 250;
        }
        marquee = null;
      }
      if (pan) {
        if (pan.moved) suppressClickUntil = Date.now() + 250;
        document.getElementById('canvas-container').style.cursor = '';
        pan = null;
      }
      if (drag) {
        if (drag.moved) {
          suppressClickUntil = Date.now() + 250;
          const dn = byId(drag.id);
          if (!drag.group && !linkSource && dn && isIso(dn.type) && !inputConn(dn.id) && !portConn(dn.id, 'out')) {
            const sz = nodeSize(dn);
            selectedNodeId = dn.id;
            if (!autoInsertIsolator(dn.id, dn.x + sz.w / 2, dn.y + sz.h / 2, false) && !snapMini(dn.id)) selectNode(drag.id);
          } else if (!drag.group && !linkSource && dn && isLock(dn.type) && !inputConn(dn.id) && (() => { const ip = portPos(dn, 'in'); return snapLock(dn.id, ip.x, ip.y, false); })()) {
            /* TRAVA LOCK encaixada na saída livre */
          } else if (!drag.group && !linkSource && dn && snapMini(dn.id)) {
            /* MINI ISOLATOR encaixado direto no aparelho */
          } else if (!drag.group && !linkSource) selectNode(drag.id);
          else render();
        }
        drag = null;
      }
    }

    function setupCanvasListeners() {
      window.onmousemove = (e) => onPointerMove(e.clientX, e.clientY, e);
      window.onmouseup = () => onPointerUp();
      window.addEventListener('resize', () => drawMinimap());

      // Clique no fundo: cancela o cabo em andamento ou volta ao diagnóstico
      document.getElementById('canvas-container').onclick = () => {
        if (Date.now() < suppressClickUntil) return;
        if (linkSource) { cancelLink(true); return; }
        if (selectedNodeId || selectedConnectionId || selection.size) showDiagnostics();
      };

      // Arrastar um item do dock para o mapa
      const canvas = document.getElementById('canvas-container');
      canvas.ondragover = (e) => e.preventDefault();
      canvas.ondrop = (e) => {
        e.preventDefault();
        const type = e.dataTransfer.getData('text/plain');
        if (!(/^tap[248]?$/.test(type) || type === 'dg' || EQUIP[type] || NODE_DEFS[type] || type === 'ontzte')) return;
        const p = screenToWorld(e.clientX, e.clientY);
        if (isIso(type)) {
          addNode(type, p.x - 56, p.y - 18);
          autoInsertIsolator(selectedNodeId, p.x, p.y, true);
          return;
        }
        if (isLock(type)) {
          addNode(type, p.x - 48, p.y - 15);
          snapLock(selectedNodeId, p.x, p.y, true);
          return;
        }
        addNode(type, p.x - 80, p.y - 45);
      };

      // Roda do mouse: zoom centrado no cursor
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (pendingConn) return;
        const r = canvas.getBoundingClientRect();
        zoomAt(view.zoom * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
      }, { passive: false });

      // Fundo: arrastar move o mapa; Shift + arrastar seleciona por área
      canvas.addEventListener('mousedown', (e) => {
        if (drag || rotDrag || pendingConn) return;
        if (e.target.closest && e.target.closest('[data-node]')) return;
        if (e.button === 0 && e.shiftKey) {
          e.preventDefault();
          marquee = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, add: true };
          return;
        }
        if (e.button !== 0 && e.button !== 1) return;
        if (e.button === 1) e.preventDefault();
        pan = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
      });

      // Minimapa
      const mmEl = document.getElementById('minimap');
      mmEl.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); mmDrag = true; minimapGo(e.clientX, e.clientY); });
      mmEl.addEventListener('click', (e) => e.stopPropagation());
      mmEl.addEventListener('touchstart', (e) => { e.stopPropagation(); const t = e.touches[0]; mmDrag = true; minimapGo(t.clientX, t.clientY); }, { passive: true });

      // Toque: um dedo arrasta peças ou move o mapa; dois dedos dão zoom (pinça)
      canvas.addEventListener('touchstart', (e) => {
        if (pendingConn) return;
        if (e.touches.length === 2) {
          drag = null; pan = null; rotDrag = null; marquee = null;
          const [t1, t2] = e.touches, r = canvas.getBoundingClientRect();
          const mx = (t1.clientX + t2.clientX) / 2 - r.left, my = (t1.clientY + t2.clientY) / 2 - r.top;
          pinch = { d0: Math.max(10, Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY)), z0: view.zoom, wx: (mx - view.x) / view.zoom, wy: (my - view.y) / view.zoom };
          e.preventDefault();
          return;
        }
        if (e.touches.length !== 1) return;
        const t = e.touches[0], tg = e.target;
        if (tg.closest('#zoom-controls') || tg.closest('#minimap') || tg.closest('#length-popup') || tg.closest('.port')) return;
        const nodeEl = tg.closest('[data-node]');
        if (tg.closest('.rot-handle') && nodeEl) { rotDrag = { id: nodeEl.dataset.node }; return; }
        if (nodeEl) { startDragAt(nodeEl.dataset.node, t.clientX, t.clientY); return; }
        pan = { sx: t.clientX, sy: t.clientY, vx: view.x, vy: view.y, moved: false };
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (pinch && e.touches.length >= 2) {
          const [t1, t2] = e.touches, r = canvas.getBoundingClientRect();
          const d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          const mx = (t1.clientX + t2.clientX) / 2 - r.left, my = (t1.clientY + t2.clientY) / 2 - r.top;
          const z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinch.z0 * d / pinch.d0));
          view.zoom = z;
          view.x = mx - pinch.wx * z;
          view.y = my - pinch.wy * z;
          applyView();
          e.preventDefault();
          return;
        }
        if (e.touches.length === 1 && (drag || pan || rotDrag || mmDrag)) {
          e.preventDefault();
          onPointerMove(e.touches[0].clientX, e.touches[0].clientY, null);
        }
      }, { passive: false });
      const touchEnd = (e) => {
        if (pinch) {
          if (e.touches.length < 2) { pinch = null; suppressClickUntil = Date.now() + 300; }
          return;
        }
        if (e.touches.length === 0) onPointerUp();
      };
      window.addEventListener('touchend', touchEnd);
      window.addEventListener('touchcancel', touchEnd);

      window.onkeydown = (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        const k = e.key.toLowerCase();
        if (e.ctrlKey || e.metaKey) {
          if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
          else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
          else if (k === 'a') { e.preventDefault(); selectAll(); }
          else if (k === 'c') { e.preventDefault(); copySelection(); }
          else if (k === 'v') { e.preventDefault(); pasteClipboard(); }
          else if (k === 'd') { e.preventDefault(); duplicateSelection(); }
          return;
        }
        if (e.key === 'Escape') {
          if (linkSource) cancelLink(true);
          else if (!selectedNodeId && !selectedConnectionId && selection.size < 2) closePanel();
          else showDiagnostics();
        } else if (k === 'r') {
          rotateSelected(e.shiftKey ? -90 : 90);
        } else if (e.key === '+' || e.key === '=') {
          zoomBy(1.2);
        } else if (e.key === '-' || e.key === '_') {
          zoomBy(1 / 1.2);
        } else if (e.key === '0') {
          zoomTo(1);
        } else if (k === 'f') {
          zoomFit();
        } else if (k === 'g') {
          toggleSnap();
        } else if (k === 'm') {
          toggleMinimap();
        } else if (k === 'p') {
          togglePanel();
        } else if (k === 'l') {
          toggleCableLabels();
        } else if (k === 't') {
          toggleTheme();
        } else if (e.key.startsWith('Arrow')) {
          const step = e.shiftKey ? 1 : GRID;
          const v = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
          if (v && nudgeSelection(v[0], v[1])) e.preventDefault();
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          if (selection.size > 1) deleteSelection();
          else if (selectedNodeId) deleteSelectedNode();
          else if (selectedConnectionId) deleteSelectedConnection();
        }
      };
    }

    function startDrag(e, id) {
      if (e.button !== 0 || e.shiftKey) return;
      startDragAt(id, e.clientX, e.clientY);
    }
    function startDragAt(id, x, y) {
      if (!byId(id)) return;
      const dock = dockedMini(byId(id));
      if (dock && !(selection.size > 1 && selection.has(id))) id = dock.id;   // o mini vai junto com o aparelho
      const dl = dockedLock(byId(id));
      if (dl && !(selection.size > 1 && selection.has(id))) id = dl.src.id;   // a trava vai junto com o passivo
      const ids = (selection.size > 1 && selection.has(id)) ? [...selection] : [id];
      drag = { id, sx: x, sy: y, moved: false, group: ids.length > 1, orig: ids.map(i => byId(i)).filter(Boolean).map(n => ({ id: n.id, x: n.x, y: n.y })) };
    }

    // --- DESFAZER / REFAZER E SALVAMENTO AUTOMÁTICO ---
    function stateJSON() {
      return JSON.stringify({
        mode: projectMode,
        limits,
        nodes: nodes.map(n => ({ id: n.id, type: n.type, name: n.name, x: Math.round(n.x * 10) / 10, y: Math.round(n.y * 10) / 10, rot: n.rot || 0, signals: n.signals || {}, inSide: n.inSide || 'auto', outSide: n.outSide || 'auto', ...(n.iot ? { iot: true } : {}), ...(ontModel(n) || tvModel(n) ? { model: n.model } : {}), ...(n.ecoKey ? { ecoKey: n.ecoKey } : {}), ...(n.ecoCfg ? { ecoCfg: n.ecoCfg } : {}), ...(n.ecoBox ? { ecoBox: n.ecoBox } : {}), ...(n.type === 'tap' ? { vias: tapVias(n), ...(isDG(n) ? { model: 'dg' } : isCTO(n) ? { model: 'cto', tec: n.tec || 'GPON', ...(isDIO(n) ? { org: 'dio' } : {}), ...(n.tags && n.tags.some(Boolean) ? { tags: n.tags } : {}), ...(napMount(n) ? { mount: napMount(n) } : {}) } : {}) } : {}) })),
        connections: connections.map(c => ({ id: c.id, from: c.from, fromPort: c.fromPort, to: c.to, cableType: c.cableType, length: c.length, ...(c.num ? { num: c.num } : {}), ...(c.conectores != null ? { conectores: c.conectores } : {}), ...(c.cableType === 'Wi-Fi' ? { band: c.band || '5', rssi: c.rssi == null ? '' : c.rssi, ...(c.ssid ? { ssid: c.ssid, wpass: c.wpass || '' } : {}) } : {}) }))
      });
    }
    function scheduleCommit() {
      if (restoring) return;
      clearTimeout(commitTimer);
      commitTimer = setTimeout(flushCommit, 250);
    }
    function flushCommit() {
      clearTimeout(commitTimer);
      commitTimer = null;
      if (restoring) return;
      const st = stateJSON();
      if (histIndex >= 0 && history[histIndex] === st) return;
      history = history.slice(0, histIndex + 1);
      history.push(st);
      if (history.length > 150) history.shift();
      histIndex = history.length - 1;
      autosave(st);
      syncActiveScenario(st);
      updateUndoButtons();
    }
    function restoreState(st) {
      const d = JSON.parse(st);
      restoring = true;
      closeLengthPopup();
      if ((d.mode === 'gpon' ? 'gpon' : 'hfc') !== projectMode) setModeQuiet(d.mode);
      nodes = d.nodes;
      connections = d.connections;
      limits = { ...DEFAULT_LIMITS };
      linkSource = null;
      selection.clear();
      if (selectedNodeId && !byId(selectedNodeId)) selectedNodeId = null;
      if (selectedConnectionId && !connById(selectedConnectionId)) selectedConnectionId = null;
      refresh();
      restoring = false;
      autosave(st);
      updateUndoButtons();
    }
    function undo() {
      if (drag || rotDrag) return;
      flushCommit();
      if (histIndex <= 0) { showToast('Nada para desfazer.', 'info'); return; }
      histIndex--;
      restoreState(history[histIndex]);
      showToast('Desfeito. Ctrl+Y refaz.', 'info');
    }
    function redo() {
      if (drag || rotDrag) return;
      flushCommit();
      if (histIndex >= history.length - 1) { showToast('Nada para refazer.', 'info'); return; }
      histIndex++;
      restoreState(history[histIndex]);
      showToast('Refeito.', 'info');
    }
    function updateUndoButtons() {
      const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');
      if (u) u.disabled = histIndex <= 0;
      if (r) r.disabled = histIndex >= history.length - 1;
    }
    function autosave(st) {
      try {
        localStorage.setItem(autosaveKey, JSON.stringify({ savedAt: Date.now(), state: st }));
        const el = document.getElementById('autosave-status');
        if (el) el.textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      } catch (err) { /* navegador sem armazenamento: segue sem salvar */ }
    }
    function loadAutosave() {
      try {
        const raw = localStorage.getItem(autosaveKey);
        if (!raw) return null;
        const o = JSON.parse(raw), d = JSON.parse(o.state);
        return d && Array.isArray(d.nodes) && d.nodes.length ? { savedAt: o.savedAt || 0, state: d } : null;
      } catch (err) { return null; }
    }
    function loadEmbedded() {
      try {
        const d = JSON.parse(document.getElementById('projeto-embutido').textContent);
        return d && d.id && d.state && Array.isArray(d.state.nodes) ? d : null;
      } catch (err) { return null; }
    }
    function applyLoadedState(st) {
      setModeQuiet(st.mode);
      nodes = st.nodes;
      connections = Array.isArray(st.connections) ? st.connections : [];
      limits = { ...DEFAULT_LIMITS };
      if (st.limits) Object.keys(DEFAULT_LIMITS).forEach(k => { const v = Number(st.limits[k]); if (!isNaN(v) && k !== 'margin') limits[k] = v; });
      normalizeProject();
      tvDecoderNames();
      resetView();
    }
    // Equipamento de TV (Decoder, Box TV, Sound Box) sempre se chama "Decoder N"; o tipo e o modelo aparecem embaixo do nome
    function tvDecoderNames() {
      nodes.filter(n => ['box', 'boxtv', 'soundbox'].includes(n.type) && /^(Box TV|Sound Box)( \d+)?$/.test(n.name || '')).forEach(n => { n.name = ''; n.name = nextNumberedName('Decoder'); });
    }

    // Baixa uma cópia completa do simulador (funciona offline) com o projeto atual dentro
    async function exportOfflineHTML() {
      closeSaveMenu();
      flushCommit();
      const proj = { id: uid('proj'), savedAt: Date.now(), appVersion: APP_VERSION, state: JSON.parse(stateJSON()), scenarios: userScenarios };
      const json = JSON.stringify(proj).replace(/</g, '\\u003c');
      const html = PRISTINE_HTML.replace(/(<script id="projeto-embutido" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
      const name = `Simulador_PRO_HFC_GPON_XGSPON_${new Date().toISOString().slice(0, 10)}.html`;
      const blob = new Blob([html], { type: 'text/html' });
      if (window.showSaveFilePicker) {
        try {
          const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Simulador PRO HFC/G-PON/XGS-PON (HTML offline)', accept: { 'text/html': ['.html'] } }] });
          const w = await h.createWritable();
          await w.write(blob);
          await w.close();
          showToast('Simulador salvo em HTML com o projeto dentro. Abra o arquivo para continuar de onde parou, mesmo sem internet.', 'success');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;   // cancelado pelo usuário
        }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      showToast('Simulador baixado em HTML com o projeto dentro (pasta Downloads). Funciona sem internet.', 'success');
    }

    function bugReportText(what, steps, withProject) {
      const tema = theme === 'light' ? 'claro' : 'escuro';
      const toque = (window.matchMedia && matchMedia('(pointer: coarse)').matches) ? 'sim' : 'não';
      let t = `Simulador PRO HFC/G-PON/XGS-PON – Versão Prévia ${APP_VERSION}\n`;
      t += `Data: ${new Date().toLocaleString('pt-BR')}\n`;
      t += `Endereço: ${location.protocol === 'file:' ? 'arquivo local (offline)' : location.href}\n`;
      t += `Navegador: ${navigator.userAgent}\n`;
      t += `Tela: ${window.innerWidth} x ${window.innerHeight} · toque: ${toque} · tema: ${tema}\n\n`;
      t += `O que aconteceu:\n${what || '(não informado)'}\n\n`;
      t += `Como repetir:\n${steps || '(não informado)'}\n`;
      if (withProject) {
        t += `\nProjeto: ${nodes.length} componentes, ${connections.length} cabos\n`;
        t += nodes.map(n => `- ${n.name}${n.type === 'tap' ? ` (origem: CA ${n.signals.ca} CB ${n.signals.cb} RX ${n.signals.rx} TX ${n.signals.tx})` : ''}${isEndpoint(n) ? ` [${statusOf(n)}]` : ''}`).join('\n') + '\n';
        t += connections.map(c => `- ${(byId(c.from) || {}).name} → ${(byId(c.to) || {}).name}: ${c.cableType} ${c.length} m`).join('\n') + '\n';
      }
      return t;
    }
    function openBugReport() {

          </label>
          <label class="flex items-center gap-2 text-[11px] text-slate-300">

          </label>
          <p class="text-[10px] text-slate-400 leading-snug">O relato já leva a versão do simulador, o navegador e o tamanho da tela. Se quiser mandar o projeto completo, use Salvar → Só o projeto (.json) e anexe no e-mail.</p>
          <div class="grid ${GITHUB_REPO ? 'grid-cols-3' : 'grid-cols-2'} gap-2">
            <button onclick="sendBugReport('email')" class="py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-bold"><i class="fa-solid fa-envelope"></i> Enviar por e-mail</button>
            ${GITHUB_REPO ? `<button onclick="sendBugReport('github')" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-100 text-[11px] font-bold"><i class="fa-solid fa-code-branch"></i> Abrir no GitHub</button>` : ''}
            <button onclick="sendBugReport('copy')" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-100 text-[11px] font-bold"><i class="fa-solid fa-copy"></i> Copiar texto</button>
          </div>
          <p class="text-[10px] text-slate-400">E-mail: ${CONTACT_EMAIL}</p>
        </div>`;
      document.body.appendChild(w);
      setTimeout(() => { const t = document.getElementById('bug-what'); if (t) t.focus(); }, 50);
    }
    function closeBugReport() {
      const m = document.getElementById('bug-modal');
      if (m) m.remove();
    }
    async function sendBugReport(how) {
      const what = document.getElementById('bug-what').value.trim();
      const steps = document.getElementById('bug-steps').value.trim();
      if (!what) { showToast('Descreva o que aconteceu antes de enviar.', 'warning'); document.getElementById('bug-what').focus(); return; }
      const text = bugReportText(what, steps, document.getElementById('bug-project').checked);
      const title = `[Bug ${APP_VERSION}] ${what.split('\n')[0].slice(0, 70)}`;
      if (how === 'copy') {
        try { await navigator.clipboard.writeText(text); showToast('Relato copiado. Cole no e-mail ou no GitHub.', 'success'); }
        catch (err) { window.prompt('Copie o relato:', text); }
        return;
      }
      if (how === 'github' && GITHUB_REPO) {
        const body = text.length > 6000 ? text.slice(0, 6000) + '\n…(cortado)' : text;
        window.open(`${GITHUB_REPO}/issues/new?title=${encodeURIComponent(title)}&labels=bug&body=${encodeURIComponent(body)}`, '_blank');
        closeBugReport();
        return;
      }
      // e-mail: links mailto têm limite de tamanho; corta o resumo se precisar
      const body = text.length > 1800 ? text.slice(0, 1800) + '\n…(resumo cortado: anexe o projeto .json se precisar)' : text;
      window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
      closeBugReport();
      showToast('Abrindo o seu e-mail com o relato pronto.', 'info');
    }

    // --- CENÁRIOS ---
    // Exemplos fixos (Cenário 1 e 2) + cenários do usuário (Cenário+), guardados no navegador e no HTML offline.
    const SCEN_KEY = 'simuladorHFC.cenarios.v1';
    let scenariosKey = SCEN_KEY;
    let userScenarios = [];
    function loadUserScenarios(emb) {
      try {
        const raw = localStorage.getItem(scenariosKey);
        if (raw) { const a = JSON.parse(raw); if (Array.isArray(a)) { userScenarios = a; return; } }
      } catch (err) { /* ignora */ }
      userScenarios = emb && Array.isArray(emb.scenarios) ? emb.scenarios : [];
    }
    let activeScenarioId = null;   // cenário do usuário aberto (as alterações ficam salvas nele)

      activeScenarioId = id || null;

    }

      try { const id = localStorage.getItem(scenariosKey + '.ativo'); activeScenarioId = userScenarios.some(x => x.id === id) ? id : null; } catch (err) { activeScenarioId = null; }
    }
    function syncActiveScenario(st) {
      if (!activeScenarioId) return;

    function nextScenarioName() {
      const used = new Set(userScenarios.map(x => x.name));

      openScenarioView();
      showToast(`${sc.name} aberto. As alterações ficam salvas nele.`, 'info');

    // Abre um cenário: organizado, zoom ajustado à tela e painéis fechados

    // Puxador: seta para fechar com o painel aberto; "‹ Diagnóstico" com a cor do status quando fechado

    // Organiza a rede em árvore, da esquerda (TAP) para a direita (equipamentos)
    const LAYOUT_ROT = { spl12: 270, div12: 270, div13: 270, div13d: 270, div18: 270, div14: 90 };
    function autoLayout() {
      if (!nodes.length) { showToast('Não há componentes para organizar.', 'warning'); return; }
      if (pendingConn) return;
      layoutCore();
      refresh();
      zoomFit();
      showToast('Projeto organizado. Ctrl+Z desfaz.', 'success');
    }
    // Organiza em árvore (TAP/DG à esquerda → equipamentos à direita). Mexe nas posições de "nodes".
    function layoutCore() {
      nodes.forEach(n => { if (NODE_DEFS[n.type]) n.rot = LAYOUT_ROT[n.type] || 0; });
      const vis = n => { const s = nodeSize(n); return (n.rot || 0) % 180 ? { w: s.h, h: s.w } : { w: s.w, h: s.h }; };
      // filhos ordenados pela altura da porta de saída (evita cabos cruzados)
      const kids = n => connections.filter(c => c.from === n.id && byId(c.to))
        .map(c => ({ c, y: portPos({ ...n, x: 0, y: 0 }, c.fromPort).y }))
        .sort((a, b) => a.y - b.y).map(o => { const t = byId(o.c.to); return dockedMini(t) || t; });   // mini encostado vai junto com o aparelho (TRAVA LOCK reserva espaço na vertical)
      const hasInput = new Set(connections.map(c => c.to));
      const roots = nodes.filter(n => !hasInput.has(n.id)).sort((a, b) => (b.type === 'tap') - (a.type === 'tap'));
      const depth = {}, colW = [], seen = new Set();
      const walk = (n, d) => {
        if (seen.has(n.id)) return;
        seen.add(n.id);
        depth[n.id] = d;
        colW[d] = Math.max(colW[d] || 0, vis(n).w);
        kids(n).forEach(k => walk(k, d + 1));
      };
      roots.forEach(r => walk(r, 0));
      nodes.filter(n => !seen.has(n.id) && !dockedMini(n) && !dockedLock(n)).forEach(n => walk(n, 0));   // segurança contra laços
      const HG = 100, VG = 16, colX = [];   // compacto
      const miniCol = new Set(nodes.filter(n => dockedMini(n)).map(n => depth[dockedMini(n).id]));   // espaço para o mini encostado
      colW.forEach((w, d) => { colX[d] = d === 0 ? 24 : colX[d - 1] + colW[d - 1] + HG + (miniCol.has(d) ? 104 : 0); });
      const hCache = {};
      const subH = n => {
        if (hCache[n.id] != null) return hCache[n.id];
        const ks = kids(n).filter(k => depth[k.id] === depth[n.id] + 1);
        const sum = ks.reduce((s, k) => s + subH(k), 0) + VG * Math.max(0, ks.length - 1);
        return (hCache[n.id] = Math.max(vis(n).h, sum));
      };
      const place = (n, top) => {
        const h = subH(n);
        const ks = kids(n).filter(k => depth[k.id] === depth[n.id] + 1);
        let cy;
        if (ks.length) {
          const total = ks.reduce((s, k) => s + subH(k), 0) + VG * (ks.length - 1);
          let t = top + (h - total) / 2;
          const centers = ks.map(k => { const c = place(k, t); t += subH(k) + VG; return c; });
          cy = (centers[0] + centers[centers.length - 1]) / 2;
        } else cy = top + h / 2;
        if (n.type === 'tap' && depth[n.id] === 0) cy = top + vis(n).h / 2;   // origem sempre no topo à esquerda
        const s = nodeSize(n), d = depth[n.id];
        n.x = Math.max(0, colX[d] + colW[d] / 2 - s.w / 2);
        n.y = Math.max(0, cy - s.h / 2);
        return cy;
      };
      let top = 24;
      const placed = new Set();
      [...roots, ...nodes].forEach(n => {
        if (depth[n.id] !== 0 || placed.has(n.id)) return;
        placed.add(n.id);
        place(n, top);
        top += subH(n) + 40;
      });
      dockMinis();
      dockLocks();
    }

    // --- MINIMAPA ---
    function drawMinimap() {
      const cv = document.getElementById('minimap');
      if (!cv) return;
      const c = document.getElementById('canvas-container');
      const b = fullBounds();
      if (!showMinimap || !b) { cv.style.display = 'none'; return; }
      cv.style.display = 'block';
      // o desenho fica preso no canto superior esquerdo; o quadro cresce para baixo e para a direita conforme o projeto
      const PAD = 6, MAXW = Math.min(220, Math.max(110, c.clientWidth * 0.2)), MAXH = Math.min(150, Math.max(56, c.clientHeight * 0.26)), MINW = Math.min(110, MAXW), MINH = 50;   // menor em telas pequenas
      if (!mmDrag || !mm) {
        const bw = Math.max(1, b.x2 - b.x1), bh = Math.max(1, b.y2 - b.y1);
        const sc = Math.min((MAXW - 2 * PAD) / bw, (MAXH - 2 * PAD) / bh);
        mm = { s: sc, ox: PAD - b.x1 * sc, oy: PAD - b.y1 * sc, W: Math.max(MINW, Math.round(bw * sc + 2 * PAD)), H: Math.max(MINH, Math.round(bh * sc + 2 * PAD)) };
      }
      const { s: sc, ox, oy, W, H } = mm;
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        cv.style.width = W + 'px'; cv.style.height = H + 'px';
      }
      const vw = { x1: -view.x / view.zoom, y1: -view.y / view.zoom, x2: (c.clientWidth - view.x) / view.zoom, y2: (c.clientHeight - view.y) / view.zoom };
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      const light = theme === 'light';
      g.fillStyle = light ? 'rgba(241,245,249,0.96)' : 'rgba(15,23,42,0.92)';
      g.fillRect(0, 0, W, H);
      g.lineWidth = 1.2;
      connections.forEach(cn => {
        const a = byId(cn.from), d = byId(cn.to);
        if (!a || !d || (dockedMini(a) && dockedMini(a).id === d.id)) return;
        const p1 = portPos(a, cn.fromPort), p2 = portPos(d, 'in'), gm = cableGeom(p1, p2);
        g.strokeStyle = CABLE_STYLE[cn.cableType] || '#38bdf8';
        g.beginPath();
        g.moveTo(p1.x * sc + ox, p1.y * sc + oy);
        g.bezierCurveTo(gm.c1.x * sc + ox, gm.c1.y * sc + oy, gm.c2.x * sc + ox, gm.c2.y * sc + oy, p2.x * sc + ox, p2.y * sc + oy);
        g.stroke();
      });
      const STC = { ok: '#10b981', warn: '#f59e0b', bad: '#f43f5e', none: '#64748b' };
      nodes.forEach(n => {
        const sz = nodeSize(n);
        let w = sz.w, h = sz.h;
        if ((n.rot || 0) % 180 === 90) [w, h] = [h, w];
        const cx = n.x + sz.w / 2, cy = n.y + sz.h / 2;
        g.fillStyle = n.type === 'tap' ? (isDG(n) ? '#8b5cf6' : '#0ea5e9') : isEndpoint(n) ? STC[statusOf(n)] : '#94a3b8';
        g.fillRect((cx - w / 2) * sc + ox, (cy - h / 2) * sc + oy, Math.max(2, w * sc), Math.max(2, h * sc));
      });
      g.save();
      g.beginPath(); g.rect(0.5, 0.5, W - 1, H - 1); g.clip();
      g.strokeStyle = light ? '#0f172a' : '#e2e8f0';
      g.lineWidth = 1;
      g.strokeRect(vw.x1 * sc + ox, vw.y1 * sc + oy, (vw.x2 - vw.x1) * sc, (vw.y2 - vw.y1) * sc);
      g.restore();
    }
    // Espaço ocupado pelo minimapa no canto superior esquerdo (para o enquadramento não esconder peças embaixo dele)
    function minimapReserve() {
      return showMinimap && mm && nodes.length ? { w: mm.W + 20, h: mm.H + 20 } : { w: 0, h: 0 };
    }
    function minimapGo(clientX, clientY) {
      if (!mm) return;
      const r = document.getElementById('minimap').getBoundingClientRect();
      const c = document.getElementById('canvas-container');
      const wx = (clientX - r.left - mm.ox) / mm.s, wy = (clientY - r.top - mm.oy) / mm.s;
      view.x = c.clientWidth / 2 - wx * view.zoom;
      view.y = c.clientHeight / 2 - wy * view.zoom;
      applyView();
    }

    // --- ZOOM E DESLOCAMENTO DO MAPA ---
    function applyView() {
      const w = document.getElementById('world');
      if (w) w.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.zoom})`;
      const c = document.getElementById('canvas-container');
      const g = 24 * view.zoom;
      c.style.backgroundSize = `${g}px ${g}px`;
      c.style.backgroundPosition = `${view.x}px ${view.y}px`;
      const lbl = document.getElementById('zoom-label');
      if (lbl) lbl.textContent = Math.round(view.zoom * 100) + '%';
      drawMinimap();
    }
    function screenToWorld(clientX, clientY) {
      const r = document.getElementById('canvas-container').getBoundingClientRect();
      return { x: (clientX - r.left - view.x) / view.zoom, y: (clientY - r.top - view.y) / view.zoom };
    }
    // Zoom mantendo fixo o ponto (cx, cy) da tela, relativo ao mapa
    function zoomAt(z, cx, cy) {
      z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
      const wx = (cx - view.x) / view.zoom, wy = (cy - view.y) / view.zoom;
      view.zoom = z;
      view.x = cx - wx * z;
      view.y = cy - wy * z;
      applyView();
    }
    function zoomTo(z) {
      if (pendingConn) return;
      const c = document.getElementById('canvas-container');
      zoomAt(z, c.clientWidth / 2, c.clientHeight / 2);
    }
    function zoomBy(f) { zoomTo(view.zoom * f); }
    function contentBounds() {
      if (!nodes.length) return null;
      let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
      nodes.forEach(n => {
        const s = nodeSize(n);
        const r = (n.rot || 0) % 180 ? Math.max(s.w, s.h) / 2 : 0;   // folga para peças giradas
        const cx = n.x + s.w / 2, cy = n.y + s.h / 2;
        const hw = r || s.w / 2, hh = r || s.h / 2;
        x1 = Math.min(x1, cx - hw); y1 = Math.min(y1, cy - hh);
        x2 = Math.max(x2, cx + hw); y2 = Math.max(y2, cy + hh);
      });
      return { x1, y1, x2, y2 };
    }
    // Limites incluindo as curvas dos cabos (a curva fica dentro dos pontos de controle)
    function fullBounds() {
      const b = contentBounds();
      if (!b) return null;
      connections.forEach(c => {
        const f = byId(c.from), t = byId(c.to);
        if (!f || !t) return;
        const g = cableGeom(portPos(f, c.fromPort), portPos(t, 'in'));
        [g.c1, g.c2].forEach(pt => { b.x1 = Math.min(b.x1, pt.x); b.y1 = Math.min(b.y1, pt.y); b.x2 = Math.max(b.x2, pt.x); b.y2 = Math.max(b.y2, pt.y); });
      });
      return b;
    }
    // Enquadra todo o projeto na tela (sem passar de maxZoom)
    function zoomFit(maxZoom = 1.5) {
      if (pendingConn) return;
      const c = document.getElementById('canvas-container');
      const b = fullBounds();
      if (!b) { view = { zoom: 1, x: 0, y: 0 }; applyView(); return; }
      if (!mm) drawMinimap();
      const small = Math.min(c.clientWidth, c.clientHeight) < 520;
      const pad = small ? 16 : 48, bw = b.x2 - b.x1, bh = b.y2 - b.y1, rs = minimapReserve();
      // deixa o minimapa livre: reserva uma faixa à esquerda OU no topo (o que der mais zoom)
      const opts = [
        { left: Math.max(pad, rs.w), top: pad },
        { left: pad, top: Math.max(pad, rs.h) }
      ].map(o => {
        const zc = document.getElementById('zoom-controls');
        const bottom = Math.max(pad, zc ? zc.offsetHeight + 16 : pad);   // não fica embaixo da barra de zoom
        const pnl = document.getElementById('properties-panel');
        const right = pnl && !pnl.classList.contains('hidden') ? Math.max(pad, pnl.offsetWidth + 24) : pad;   // não fica embaixo do painel
        const aw = c.clientWidth - o.left - right, ah = c.clientHeight - o.top - bottom;
        return { ...o, aw, ah, z: Math.min(maxZoom, aw / bw, ah / bh) };
      });
      const o = opts[0].z >= opts[1].z ? opts[0] : opts[1];
      const z = Math.max(ZOOM_MIN, o.z);
      view.zoom = z;
      view.x = o.left + (o.aw - bw * z) / 2 - b.x1 * z;
      view.y = o.top + (o.ah - bh * z) / 2 - b.y1 * z;
      applyView();
    }
    // Ao abrir/limpar: 100% na origem se couber; senão enquadra o projeto
    function autoView() {
      const c = document.getElementById('canvas-container');
      const b = contentBounds();
      if (!mm) drawMinimap();
      const rs = minimapReserve();
      const free = !b || ((b.x1 >= rs.w || b.y1 >= rs.h) && b.x2 + 24 <= c.clientWidth && b.y2 + 24 <= c.clientHeight);
      if (free) { view = { zoom: 1, x: 0, y: 0 }; applyView(); }
      else zoomFit(1);
    }

    // Coloca os isoladores nos cenários de exemplo: CABLE ISOLATOR nos cabos indicados (RG6 Preto / RG11)
    // e MINI ISOLATOR em todo cabo RG6 Branco que chega num EMTA, Decoder ou Box TV
    function addScenarioIsolators(cableIds) {
      cableIds.forEach((cid, i) => {
        const c = connections.find(x => x.id === cid);
        if (!c) return;
        const iso = { id: 'iso' + (i + 1), type: 'iso', name: 'CABLE ISOLATOR', x: 0, y: 0, rot: 0, signals: {} };
        nodes.push(iso);
        connections.push({ id: 'ci' + (i + 1), from: iso.id, fromPort: 'out', to: c.to, cableType: 'RG6', length: ISO_TAIL_M });

    // Desenho da topologia para o relatório (fundo branco, imprime bem)
    function reportMapSVG() {
      const original = nodes;
      nodes = original.map(n => ({ ...n }));
      try { layoutCore(); return reportMapSVGRaw(); }
      finally { nodes = original; }
    }
    function reportMapSVGRaw() {
      const b = fullBounds();
      if (!b) return '';
      const pad = 30, x0 = b.x1 - pad, y0 = b.y1 - pad, W = b.x2 - b.x1 + 2 * pad, H = b.y2 - b.y1 + 2 * pad;
      const COL = { ok: '#059669', warn: '#d97706', bad: '#e11d48', none: '#64748b' };
      let cables = '', labels = '', parts = '';
      connections.forEach(c => {
        const f = byId(c.from), t = byId(c.to);
        if (!f || !t) return;
        if ((dockedMini(f) && dockedMini(f).id === t.id) || dockedLock(t)) return;
        const ra = portPos(f, c.fromPort), rb = portPos(t, 'in'), rgeo = cableGeom(ra, rb);
        const { d, midX, midY } = rgeo;
        const col = isGponCable(c.cableType) ? GPON_CABLES[c.cableType].light : c.cableType === 'RG6 Preto' ? '#334155' : c.cableType === 'RG11' ? '#6366f1' : '#0ea5e9';
        cables += isGponCable(c.cableType) ? gponPathSVG(c.cableType, d, true, c.band) : `<path d="${d}" stroke="${col}" stroke-width="${c.cableType === 'RG11' ? 5 : 3}" fill="none" stroke-linecap="round"/>`;
        cables += tapeSVGString(c, tapeDots(c, ra, rb, rgeo)) + numeradorSVG(c, ra, rb, rgeo);
        const lab = cableLabel(c), w = lab.length * 6.6 + 14;
        labels += `<rect x="${midX - w / 2}" y="${midY - 11}" width="${w}" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="${midX}" y="${midY + 4}" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">${esc(lab)}</text>`;
      });
      nodes.forEach(n => {
        const sz = nodeSize(n);
        if (NODE_DEFS[n.type]) {
          const m = passiveSVG(n).match(/<svg[^>]*viewBox="([^"]+)"[^>]*>([\s\S]*)<\/svg>/);
          if (m) parts += `<g transform="translate(${n.x + sz.w / 2} ${n.y + sz.h / 2}) rotate(${n.rot || 0}) translate(${-sz.w / 2} ${-sz.h / 2})"><svg width="${sz.w}" height="${sz.h}" viewBox="${m[1]}">${m[2]}</svg></g>`;
          return;
        }
        if (isNetDev(n)) {   // ponto de TV no relatório: nome, ligação e online/offline
          const ns = netState(n), c = inputConn(n.id), col = { on: '#059669', warn: '#d97706', off: '#e11d48' }[ns.st];
          parts += `<g><rect x="${n.x}" y="${n.y}" width="${sz.w}" height="${sz.h}" rx="10" fill="#f8fafc" stroke="${col}" stroke-width="2"/>
            <text x="${n.x + 12}" y="${n.y + 22}" font-size="13" font-weight="800" fill="#0f172a">${esc(n.name)}</text>
            <text x="${n.x + 12}" y="${n.y + 38}" font-size="9.5" fill="#475569">${esc(NET_DEV[n.type].label)} · ${c ? esc(gponCableLabel(c)) : 'não ligado'}</text>
            <text x="${n.x + sz.w - 10}" y="${n.y + sz.h - 10}" font-size="10" font-weight="800" fill="${col}" text-anchor="end">${esc(ns.text.toUpperCase())}</text></g>`;
          return;
        }
        const tap = n.type === 'tap';
        const d = tap ? null : diagnose(n, false);
        const stroke = tap ? (originAlert(n) ? '#d97706' : isDG(n) ? '#7c3aed' : isCTO(n) ? '#059669' : '#0284c7') : COL[d.status];
        const v = tap ? n.signals : (n.lv || {});
        const val = k => tap ? fmt(sigVal(v[k])) : fmt(v[k]);
        const colOf = k => tap ? '#0f172a' : COL[d.metrics.find(m => m.key === k).st];
        const line = (k1, k2, y) => `<text x="${n.x + 12}" y="${y}" font-size="11.5" font-family="monospace"><tspan fill="#64748b">${k1.toUpperCase()} </tspan><tspan fill="${colOf(k1)}" font-weight="700">${val(k1)}</tspan><tspan fill="#64748b" dx="12">${k2.toUpperCase()} </tspan><tspan fill="${colOf(k2)}" font-weight="700">${val(k2)}</tspan></text>`;
        parts += `<g>
          <rect x="${n.x}" y="${n.y}" width="${sz.w}" height="${sz.h}" rx="10" fill="${tap ? '#f0f9ff' : '#f8fafc'}" stroke="${stroke}" stroke-width="2"/>
          <text x="${n.x + 12}" y="${n.y + 22}" font-size="13" font-weight="800" fill="#0f172a">${esc(n.name)}</text>
          <text x="${n.x + 12}" y="${n.y + 37}" font-size="9.5" fill="#475569">${tap ? `${isDG(n) ? 'DG · ' : isCTO(n) ? (isMDU(n) ? 'NAP MDU · ' : isDIO(n) ? 'DIO · ' : 'NAP de ' + MOUNT_LABEL[napMount(n)].toLowerCase() + ' · ') + esc(n.tec || 'GPON') + ' · ' : ''}Origem · ${tapVias(n)} ${isCTO(n) ? 'portas' : 'vias'} (${connections.filter(c => c.from === n.id).length} em uso)` : esc(EQUIP[n.type].label)}</text>
          ${optCtx(n) ? gponReportLines(n, d) : line('ca', 'cb', n.y + 58) + (n.type === 'box' ? '' : line('rx', 'tx', n.y + 76))}
          ${tap ? (originAlert(n) ? `<text x="${n.x + sz.w - 10}" y="${n.y + sz.h - 10}" font-size="10" font-weight="800" fill="#d97706" text-anchor="end">${isCTO(n) ? 'ALERTA NAP' : 'ALERTA TX'}</text>` : '') : `<text x="${n.x + sz.w - 10}" y="${n.y + sz.h - 10}" font-size="10" font-weight="800" fill="${stroke}" text-anchor="end">${ST[d.status].report}</text>`}
        </g>`;
      });
      return `<svg viewBox="${x0} ${y0} ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto block" style="max-height:560px; font-family: Inter, sans-serif">
        <rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="#ffffff"/>${cables}${parts}${labels}</svg>`;
    }

    function exportProjectJSON() {

        version: 2,
        appVersion: 'Versão Prévia ' + APP_VERSION,

        nodes: nodes.map(n => ({ id: n.id, type: n.type, name: n.name, x: n.x, y: n.y, rot: n.rot || 0, signals: n.signals || {}, inSide: n.inSide || 'auto', outSide: n.outSide || 'auto', ...(n.iot ? { iot: true } : {}), ...(ontModel(n) || tvModel(n) ? { model: n.model } : {}), ...(n.ecoKey ? { ecoKey: n.ecoKey } : {}), ...(n.ecoCfg ? { ecoCfg: n.ecoCfg } : {}), ...(n.ecoBox ? { ecoBox: n.ecoBox } : {}), ...(n.type === 'tap' ? { vias: tapVias(n), ...(isDG(n) ? { model: 'dg' } : isCTO(n) ? { model: 'cto', tec: n.tec || 'GPON', ...(isDIO(n) ? { org: 'dio' } : {}), ...(n.tags && n.tags.some(Boolean) ? { tags: n.tags } : {}), ...(napMount(n) ? { mount: napMount(n) } : {}) } : {}) } : {}) })),

    // Valida um projeto importado e atribui portas a cabos de arquivos antigos (sem fromPort)
    function normalizeProject() {
      nodes = nodes.filter(n => n && n.id && (n.type === 'tap' || EQUIP[n.type] || NET_DEV[n.type] || NODE_DEFS[n.type]));
      nodes.forEach(n => {
        n.x = Number(n.x) || 0;
        n.y = Number(n.y) || 0;
        n.rot = NODE_DEFS[n.type] && !noRotate(n) ? (Number(n.rot) || 0) : 0;
        n.name = n.name == null ? n.type : String(n.name);
        n.signals = n.signals || {};
        n.inSide = 'auto';    // lado da conexão sempre automático
        n.outSide = 'auto';
        if (n.type === 'ont' && !ONT_MODELS[n.model]) delete n.model;
        if (n.type === 'tap' && n.model === 'cto') {
          const count = (connections || []).filter(c => c && c.from === n.id).length;
          if (n.org === 'dio' && ![4, DIO_PORTAS].includes(Number(n.vias))) n.org = 'mdu';   // DIO antigo (8 portas) = NAP MDU
          n.vias = n.org === 'dio' ? DIO_PORTAS : CTO_VIAS.includes(Number(n.vias)) ? Number(n.vias) : (CTO_VIAS.find(v => v >= count) || 16);
          if (n.org === 'mdu') n.vias = MDU_PORTAS; else if (n.org !== 'dio') delete n.org;
          if (n.org === 'dio' || n.org === 'mdu') delete n.mount; else n.mount = n.mount === 'cordoalha' ? 'cordoalha' : 'poste';
          n.tags = Array.isArray(n.tags) ? n.tags.slice(0, n.vias === 16 ? 2 : 1).map(t => String(t || '').trim().slice(0, 24)) : [];
          if (!n.org && n.tags.length && n.tags.every(t => !t || NAP_TAG_ANTIGA.includes(t))) n.tags = n.vias === 16 ? [NAP_TAG_PADRAO, nextTag(NAP_TAG_PADRAO)] : [NAP_TAG_PADRAO];
          if (isDefaultCtoName(n.name)) n.name = ctoName(n.vias, n.org);
          n.tec = n.tec === 'XGS-PON' ? 'XGS-PON' : 'GPON';
          const pv = sigVal(n.signals.pot), pv2 = sigVal(n.signals.pot2);
          n.signals = { pot: pv == null ? '' : pv, ...(n.vias === 16 ? { pot2: pv2 == null ? '' : pv2 } : {}) };
        } else if (n.type === 'tap') {
          if (n.model !== 'dg') delete n.model;
          const count = (connections || []).filter(c => c && c.from === n.id).length;
          if (!TAP_VIAS.includes(Number(n.vias))) n.vias = TAP_VIAS.find(v => v >= count) || 8;
          else n.vias = Number(n.vias);
          if (count > n.vias) n.vias = TAP_VIAS.find(v => v >= count) || 8;
          if (n.model === 'dg') n.vias = 4;
          else if (isDefaultTapName(n.name)) n.name = tapName(n.vias);
          const s = n.signals;
          const keepRx = s.rx === undefined;   // arquivos antigos sem RX usavam o CA
          ['ca', 'cb', 'tx', 'rx'].forEach(k => { const v = sigVal(s[k]); s[k] = v == null ? '' : v; });
          if (keepRx) s.rx = s.ca;
        }
      });

      const kept = [];
      const inputs = new Set();
      const usedPorts = {};
      let dropped = 0;
      connections.forEach((c, i) => {
        const src = c && byId(c.from), dst = c && byId(c.to);
        if (!src || !dst || dst.type === 'tap' || src.id === dst.id || inputs.has(dst.id) || !outPorts(src).length) { dropped++; return; }
        const outs = outPorts(src);
        const used = usedPorts[src.id] || (usedPorts[src.id] = new Set());
        const isFree = p => p.multi || !used.has(p.id);
        let port = outs.find(p => p.id === c.fromPort && isFree(p));
        if (!port) {
          // regra antiga: no DC, o primeiro cabo era OUT e os demais TAP; nos outros, ordem de criação
          if (isDC(src.type)) port = outs.find(p => p.id === (used.size === 0 ? 'out' : 'tap') && isFree(p));
          port = port || outs.find(isFree);
        }
        if (!port) { dropped++; return; }
        used.add(port.id);
        inputs.add(dst.id);
        const len = Number(c.length);
        kept.push({ id: c.id || ('conn_' + i), from: src.id, fromPort: port.id, to: dst.id, ...(c.num ? { num: String(c.num).toUpperCase().replace(/[^0-9A-Z\- ]/g, '').slice(0, 8) } : {}), cableType: isNetCable(c.cableType) ? c.cableType : optCtx(src) ? (isGponCable(c.cableType) ? c.cableType : 'Drop') : isDG(src) ? DG_CABLE : (cableAttenuation[c.cableType] ? c.cableType : 'RG6'), length: isNaN(len) || len < 0 ? 10 : len, ...(c.cableType === 'Wi-Fi' ? { band: c.band === '2.4' ? '2.4' : '5', rssi: sigVal(c.rssi) == null ? '' : sigVal(c.rssi), ...(typeof c.ssid === 'string' && c.ssid ? { ssid: c.ssid.slice(0, 64), wpass: String(c.wpass || '').slice(0, 64) } : {}) } : {}), ...(optCtx(src) && !isNetCable(c.cableType) && c.cableType !== 'Cordão óptico' ? { conectores: Math.max(0, Math.min(20, Math.round(Number(c.conectores)) || 0)) } : {}) });
      });
      connections = kept;
      limits = { ...DEFAULT_LIMITS };   // níveis padrão fixos
      let fixed = 0;
      connections.forEach(c => {
        if (c.cableType === 'RG11' && rg11Problem(byId(c.from), c.length)) { c.cableType = rg11Fallback(byId(c.from)); fixed++; }
      });
      if (fixed) setTimeout(() => showToast(`${fixed} cabo${fixed > 1 ? 's' : ''} RG11 fora da regra (só no cabo de entrada, acima de ${RG11_MIN} m) ${fixed > 1 ? 'foram trocados' : 'foi trocado'}.`, 'warning'), 3700);
      return dropped;
    }

    function importProjectJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.nodes) && Array.isArray(parsed.connections)) {
            setModeQuiet(parsed.mode);
            nodes = parsed.nodes;
            connections = parsed.connections;
            limits = { ...DEFAULT_LIMITS };
            if (parsed.limits) Object.keys(DEFAULT_LIMITS).forEach(k => { const v = Number(parsed.limits[k]); if (!isNaN(v) && k !== 'margin') limits[k] = v; });
            const dropped = normalizeProject();
            setActiveScenario(null);
            resetView();
            showToast(dropped ? `Projeto importado. ${dropped} cabo(s) inválido(s) foram descartados.` : 'Projeto JSON importado com sucesso!', dropped ? 'warning' : 'success');
          } else {
            showToast('Arquivo JSON sem "nodes" e "connections".', 'warning');
          }
        } catch (err) {
          showToast('Erro ao ler arquivo JSON!', 'warning');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function showToast(msg, type = 'info') {
      document.querySelectorAll('.hfc-toast').forEach(el => el.remove());
      const t = document.createElement('div');
      let bg = 'bg-sky-900 border-sky-700 text-sky-200';
      if (type === 'success') bg = 'bg-emerald-900 border-emerald-700 text-emerald-200';
      if (type === 'warning') bg = 'bg-rose-900 border-rose-700 text-rose-200';

      t.className = `hfc-toast fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl border ${bg} text-xs font-semibold shadow-xl`;
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }
  </script>
</body>
