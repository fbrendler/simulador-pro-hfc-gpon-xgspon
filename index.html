    function duplicateSelection() {
      const ids = selectedIds();
      if (!ids.length) { showToast('Selecione um ou mais componentes para duplicar.', 'warning'); return; }
      const n = pasteClip(buildClip(ids), 36);
      showToast(`${n} componente${n > 1 ? 's duplicados' : ' duplicado'}.`, 'success');
    }
    function nudgeSelection(dx, dy) {
      const ids = selectedIds();
      if (!ids.length) return false;
      ids.forEach(id => { const n = byId(id); n.x = Math.max(0, n.x + dx); n.y = Math.max(0, n.y + dy); });
      render();
      return true;
    }

    function multiPanelHTML() {
      const list = selectedIds().map(byId);
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <h3 class="font-bold text-sm text-slate-100">${list.length} componentes selecionados</h3>
            <div class="flex items-center gap-1"><button onclick="deleteSelection()" class="text-rose-400 hover:text-rose-300 p-1" title="Excluir selecionados (Delete)"><i class="fa-solid fa-trash-can"></i></button><button onclick="closePanel()" class="panel-close ml-1" title="Fechar o painel (P)"><i class="fa-solid fa-xmark"></i></button></div>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="duplicateSelection()" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold"><i class="fa-solid fa-clone"></i> Duplicar</button>
            <button onclick="copySelection()" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold"><i class="fa-solid fa-copy"></i> Copiar</button>
            <button onclick="rotateSelected(90)" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold"><i class="fa-solid fa-rotate-right"></i> 90°</button>
          </div>
          <ul class="space-y-1">${list.map(n => `
            <li><button data-id="${esc(n.id)}" onclick="selectNode(this.dataset.id)" class="w-full text-left text-[11px] bg-slate-950 hover:bg-slate-800/70 border border-slate-800 rounded-lg px-2 py-1.5 text-slate-200">${esc(n.name)}</button></li>`).join('')}
          </ul>
          <p class="text-[10px] text-slate-400 leading-snug">Arraste qualquer um deles para mover o grupo. Shift+clique adiciona ou tira itens; Shift+arrastar no fundo seleciona por área; Ctrl+A seleciona tudo. Ctrl+D duplica, Ctrl+C / Ctrl+V copia e cola, setas movem, Delete exclui.</p>
        </div>`;
    }

    function showDiagnostics() {
      selection.clear();
      linkSource = null;
      selectedNodeId = null;
      selectedConnectionId = null;
      render();
    }

    function updateDiagBadge() {
      updatePanelHandle();
      const el = document.getElementById('diag-badge');
      if (!el) return;
      const anyFix = nodes.some(n => isEndpoint(n) && n._fix);
      const db = document.getElementById('diag-button');
      if (db) { ['ring-2', 'ring-emerald-400', 'animate-pulse'].forEach(c => db.classList.toggle(c, anyFix)); db.title = anyFix ? 'Há correção disponível: abrir o diagnóstico' : 'Abrir/fechar o diagnóstico da rede'; }
      const sts = nodes.filter(isEndpoint).map(n => statusOf(n)).concat(nodes.filter(isNetDev).map(n => NET_ST[netState(n).st]));
      const bad = sts.filter(s => s === 'bad' || s === 'none').length;
      const warn = sts.filter(s => s === 'warn').length;
      if (bad) { el.className = 'px-1.5 rounded-full bg-rose-600 text-white text-[10px] font-bold'; el.textContent = bad; }
      else if (warn || originAlerts().length || freePassivePorts().length || missingMinis().length) { el.className = 'px-1.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-bold'; el.textContent = warn + originAlerts().length + (freePassivePorts().length ? 1 : 0) + missingMinis().length; }
      else { el.className = ''; el.textContent = ''; }
    }

    function gaugeHTML(m) {
      const noMax = !isFinite(m.max);
      const lo = m.min - 8, hi = noMax ? Math.max(m.min + 24, (m.val || 0) + 6) : m.max + 8, span = hi - lo;
      const top = noMax ? hi : m.max;
      const pct = v => Math.max(0, Math.min(100, (v - lo) / span * 100));
      const mg = noMax ? limits.margin : Math.min(limits.margin, (m.max - m.min) / 2);
      const marker = m.val == null ? '' : `<div class="absolute -top-1 w-1 h-4 bg-white rounded shadow" style="left: calc(${pct(m.val)}% - 2px)"></div>`;
      return `
        <div>
          <div class="flex items-baseline justify-between text-[11px]">
            <span class="text-slate-400 font-semibold">${m.label}</span>
            <strong class="font-mono ${ST[m.st].text}">${fmt(m.val)} ${m.unit || 'dBmV'}</strong>
          </div>
          <div class="relative h-2 rounded bg-rose-900/70 mt-1.5">
            <div class="absolute inset-y-0 bg-amber-600" style="left:${pct(m.min)}%; width:${pct(top) - pct(m.min)}%"></div>
            <div class="absolute inset-y-0 bg-emerald-500 ${noMax ? 'rounded-r' : ''}" style="left:${pct(m.warnBelow != null ? m.warnBelow : m.min + mg)}%; width:${pct(noMax ? top : top - mg) - pct(m.warnBelow != null ? m.warnBelow : m.min + mg)}%"></div>
            ${marker}
          </div>
          <div class="flex justify-between text-[10px] text-slate-400 font-mono mt-0.5">
            <span>mín ${m.min}</span><span>${noMax ? 'sem máximo' : 'máx ' + m.max}</span>
          </div>
        </div>
      `;
    }

    function suggestionHTML(s, withButtons) {
      let btn = '';
      if (withButtons && s.action) {
        const i = currentActions.push(s.action) - 1;
        btn = `<button onclick="applyAction(${i})" class="mt-1.5 px-2 py-1 rounded bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-bold transition">Aplicar no projeto</button>`;
      }
      const chip = s.attenuate
        ? `<span class="shrink-0 font-mono text-[10px] font-bold text-amber-300 bg-amber-950/70 border border-amber-700/60 rounded px-1">−${fmtDb(s.gain)} dB</span>`
        : `<span class="shrink-0 font-mono text-[10px] font-bold text-emerald-300 bg-emerald-950/70 border border-emerald-700/60 rounded px-1">+${fmtDb(s.gain)} dB</span>`;
      return `
        <li class="bg-slate-950 border border-slate-800 rounded-lg p-2">
          <div class="flex items-start gap-2">
            ${chip}
            <div class="text-[11px] text-slate-200 leading-snug">
              ${s.action ? (s.resolves ? '<span class="inline-block mr-1 px-1 rounded text-[10px] font-bold bg-emerald-600 text-white align-middle">RESOLVE</span>' : '<span class="inline-block mr-1 px-1 rounded text-[10px] font-bold bg-slate-700 text-slate-200 align-middle">AJUDA</span>') : ''}${esc(s.text)}
              ${s.note ? `<span class="block text-[10px] text-slate-400 mt-0.5">${esc(s.note)}</span>` : ''}
              ${btn}
            </div>
          </div>
        </li>
      `;
    }

    function stepLabel(step) {
      if (step.kind === 'cable') {
        const c = connById(step.connId);
        if (c && isGponCable(c.cableType)) return c.cableType === 'Cordão óptico' ? 'Cordão óptico' : `${GPON_CABLES[c.cableType].name} ${c.length} m + ${Math.max(0, Math.round(Number(c.conectores) || 0))} conector(es)`;
        return c ? (Number(c.length) > 0 ? `Cabo ${c.length} m ${c.cableType}` : 'Ligação direta (encaixe)') : 'Cabo';
      }
      const node = byId(step.nodeId);
      const p = node ? portInfo(node, step.portId) : null;
      return `${node ? node.name : ''} · ${p ? p.label.split(' (')[0] : ''}`;
    }

    function pathTableHTML(n, keys) {
      if (!n.lv || keys.some(k => n.lv[k] == null)) return '';
      let cur = n.path.length ? null : n.lv;
      // nível de origem = nível final + perdas acumuladas
      const total = {};
      keys.forEach(k => total[k] = n.path.reduce((s, st) => s + st.loss[k], 0));
      const start = {};
      keys.forEach(k => start[k] = k === 'tx' ? n.lv[k] - total[k] : n.lv[k] + total[k]);
      const sign = k => (k === 'tx' ? '+' : '−');
      const KL = { min: 'MÍN', max: 'MÁX' }, oName = optCtx(n) ? 'DIO/NAP' : 'TAP';
      const head = keys.map(k => `<th class="py-1 px-1 text-right">${KL[k] || k.toUpperCase()}</th>`).join('');
      const rows = n.path.map(st => `
        <tr class="border-t border-slate-800/70">
          <td class="py-1 pr-1 text-slate-300">${esc(stepLabel(st))}</td>
          ${keys.map(k => `<td class="py-1 px-1 text-right font-mono text-slate-400">${sign(k)}${st.loss[k].toFixed(1)}</td>`).join('')}
        </tr>`).join('');
      return `
        <div class="border-t border-slate-800 pt-2">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Caminho desde ${oName === 'DIO/NAP' ? 'o DIO/NAP' : 'o TAP'}</label>
          <table class="w-full text-[10px]">
            <thead><tr class="text-slate-400"><th class="text-left font-semibold py-1">Trecho</th>${head}</tr></thead>
            <tbody>
              <tr class="border-t border-slate-800/70">
                <td class="py-1 pr-1 text-sky-300 font-semibold">${oName === 'DIO/NAP' ? 'Potência na origem' : 'Nível no TAP'}</td>
                ${keys.map(k => `<td class="py-1 px-1 text-right font-mono text-sky-300">${start[k].toFixed(1)}</td>`).join('')}
              </tr>
              ${rows}
              <tr class="border-t border-slate-700">
                <td class="py-1 pr-1 text-slate-100 font-bold">${oName === 'DIO/NAP' ? 'Na ONT' : 'No equipamento'}</td>
                ${keys.map(k => `<td class="py-1 px-1 text-right font-mono text-slate-100 font-bold">${n.lv[k].toFixed(1)}</td>`).join('')}
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    // Origem (TAP/DG) que alimenta um ponto
    function originOf(n) {
      let cur = n, guard = 0;
      while (cur && guard++ < 1000) {
        const c = inputConn(cur.id);
        if (!c) return cur.type === 'tap' || !optCtx(n) ? cur : null;
        cur = byId(c.from);
      }
      return null;
    }
    // Sinal medido/digitado no ponto: ajusta o nível da origem e recalcula toda a instalação
    function updatePointSignal(key, val) {
      const n = byId(selectedNodeId);
      if (!n || !n.lv || n.type === 'tap' || optCtx(n)) return;
      const v = parseFloat(String(val).replace(',', '.'));
      if (isNaN(v) && String(val).trim() === '') { renderProperties(); return; }
      if (isNaN(v)) { renderProperties(); return; }
      const org = originOf(n);
      if (!org) { showToast('Este ponto não está ligado a um TAP ou DG.', 'warning'); renderProperties(); return; }
      org.signals = org.signals || {};
      const before = sigVal(org.signals[key]);
      const total = (n.path || []).reduce((t, st) => t + st.loss[key], 0);
      const newOrigin = key === 'tx' ? v - total : v + total;   // nível na origem = nível no ponto ± atenuação do caminho
      if (before != null && Math.abs(newOrigin - before) < 1e-9) return;
      org.signals[key] = Math.round(newOrigin * 100) / 100;   // 2 casas: o ponto medido fica exatamente com o valor digitado
      refresh();
      const K = key.toUpperCase();
      showToast(org === n
        ? `${K} no ${n.name} = ${fmt(v)} dBmV: ponto de partida da rede; toda a instalação foi recalculada.`
        : `${K} no ${n.name} = ${fmt(v)} dBmV: ${K} ${org.type === 'tap' ? 'do ' + org.name : 'na entrada do ' + org.name + ' (ponto de partida)'} ficou em ${fmt(org.signals[key])} e toda a instalação foi recalculada.`, 'info');
      const lvl = originLevelAlert(org);
      if (lvl) setTimeout(() => showToast(lvl.text, 'warning'), 3600);
      const al = key === 'tx' ? originAlert(org) : null;
      if (al) setTimeout(() => showToast(`Alerta: ${al.msg}`, 'warning'), 3600);
    }
    function pointSignalsHTML(n, title) {
      const org = originOf(n);
      if (!n.lv || !org) return `<div class="border-t border-slate-800 pt-2"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Sinais no ponto</label><p class="text-[11px] text-slate-400">Ligue o ponto a um TAP ou DG para poder editar os sinais.</p></div>`;
      const cell = (k, cls) => `
        <label class="block">
          <span class="text-slate-400 text-[10px] block">${k.toUpperCase()} (dBmV)</span>
          <input type="number" step="0.1" value="${fmt(n.lv[k])}" onchange="updatePointSignal('${k}', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs ${cls} font-mono font-bold focus:outline-none focus:border-sky-500">
        </label>`;
      return `
        <div class="border-t border-slate-800 pt-2 space-y-1.5">
          <label class="text-[10px] font-bold text-sky-400 uppercase tracking-wider block">${title || 'Sinais no ponto (editáveis)'}</label>
          <div class="grid grid-cols-4 gap-1.5">${cell('ca', 'text-slate-100')}${cell('cb', 'text-slate-100')}${cell('rx', 'text-sky-400')}${cell('tx', 'text-amber-400')}</div>
          <p class="text-[10px] text-slate-400 leading-snug">${org.type === 'tap'
            ? `Digite o valor medido aqui: o simulador ajusta o nível do ${esc(org.name)} e recalcula toda a instalação.`
            : `Sem TAP/DG: digite o sinal medido aqui (ou em qualquer outro ponto). Ele vira a base e todos os pontos são calculados a partir dele.`}</p>
        </div>`;
    }

    // ===== Janela do equipamento (abas, como a janela de um aparelho num simulador de redes) =====
    // Resumo: estado e ações · Sinal: diagnóstico e caminho · Rede: portas, Wi-Fi e IoT · Editar: nome, modelo e sinais no ponto
    const isDevice = n => !!n && (isEndpoint(n) || isNetDev(n));
    let devTab = 'resumo', devTabFor = null;
    function setDevTab(t) { devTab = t; renderProperties(); const p = document.getElementById('properties-panel'); if (p) p.scrollTop = 0; }
    function openDevDiag(id) { selectNode(id); devTab = isEndpoint(byId(id)) ? 'sinal' : 'resumo'; devTabFor = id; showPanel(); renderProperties(); }
    function devTabsOf(n) {
      const t = [['resumo', 'Resumo', 'fa-circle-info']];
      if (isEndpoint(n)) t.push(['sinal', 'Sinal', 'fa-signal']);
      if (isGateway(n) || isNetDev(n)) t.push(['rede', 'Rede', 'fa-network-wired']);
      t.push(['editar', 'Editar', 'fa-pen']);
      return t;
    }
    function devKindLabel(n) {
      if (n.type === 'ont') return ontModel(n) ? `${ontModel(n).label} · ${ontModel(n).tec}` : 'ONT/ONU genérica';
      if (n.type === 'modem') return 'EMTA · Sagemcom F@ST3896';
      const base = EQUIP[n.type] ? EQUIP[n.type].label : NET_DEV[n.type] ? NET_DEV[n.type].label : '';
      return base + (tvModel(n) ? ' · ' + tvModelLabel(tvModel(n)) : '');
    }
    function deviceWindowHTML(n) {
      if (devTabFor !== n.id) { devTab = 'resumo'; devTabFor = n.id; }
      const tabs = devTabsOf(n);
      if (!tabs.some(t => t[0] === devTab)) devTab = 'resumo';
      const body = devTab === 'sinal' ? devSignalHTML(n) : devTab === 'rede' ? devNetHTML(n) : devTab === 'editar' ? devEditHTML(n) : devSummaryHTML(n);
      return `
        <div class="space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="font-bold text-sm text-slate-100 truncate">${esc(n.name)}</h3>
              <p class="text-[11px] text-slate-400 truncate">${esc(devKindLabel(n))}</p>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="duplicateSelection()" class="text-slate-300 hover:text-white p-1" title="Duplicar (Ctrl+D)"><i class="fa-solid fa-clone"></i></button>
              <button onclick="deleteSelectedNode()" class="text-rose-400 hover:text-rose-300 p-1" title="Excluir (Delete)"><i class="fa-solid fa-trash-can"></i></button>
              <button onclick="closePanel()" class="panel-close ml-1" title="Fechar o painel (P)"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
          <div class="dev-tabs">${tabs.map(([k, t, ic]) => `<button onclick="setDevTab('${k}')" class="${k === devTab ? 'on' : ''}"><i class="fa-solid ${ic}"></i><span>${t}</span></button>`).join('')}</div>
          ${body}
        </div>`;
    }
    function devSummaryHTML(n) {
      let st = '';
      if (isEndpoint(n)) {
        const d = diagnose(n);
        st = `<div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Sinal</span>${statusBadge(d.status)}</div>
          <div class="grid grid-cols-${d.metrics.length} gap-1">${d.metrics.map(m => `<button onclick="setDevTab('sinal')" class="dev-val"><span>${esc(m.label.split(' ')[0])}</span><b class="font-mono ${ST[m.st].text}">${fmt(m.val)}</b></button>`).join('')}</div>
          ${d.status !== 'ok' && (d.notes[0] || d.summary) ? `<p class="text-[11px] ${ST[d.status].text} leading-snug">${esc(d.notes[0] || d.summary)}</p>` : ''}
          ${d.suggestions.length ? `<button onclick="setDevTab('sinal')" class="dev-link"><i class="fa-solid fa-wrench"></i> Como corrigir (${d.suggestions.length})</button>` : ''}`;
      }
      const acts = [];
      if (isEcoEquip(n)) acts.push(`<button onclick="openEquipConfig('${esc(n.id)}')" class="dev-main"><i class="fa-solid fa-sliders"></i> Acessar página de configuração</button>`);
      if (isIpBox(n)) acts.push(`<button onclick="openBoxTv('${esc(n.id)}')" class="dev-main"><i class="fa-solid fa-tv"></i> Abrir ${n.type === 'soundbox' ? 'a Sound Box' : 'o Box TV'}</button>`);
      if (isCoaxTv(n)) acts.push(`<button onclick="openBoxTv('${esc(n.id)}')" class="dev-main"><i class="fa-solid fa-tv"></i> Abrir o ${n.type === 'tv' ? 'decoder' : 'Box TV'}</button>`);
      return `
        ${st ? `<div class="space-y-1.5">${st}</div>` : ''}
        ${isNetDev(n) ? netDevPanelHTML(n) : ''}
        ${isGateway(n) ? `<div class="text-[11px] text-slate-300 leading-snug"><i class="fa-solid fa-ethernet text-slate-400"></i> ${lanSpec(n)} · Wi-Fi${n.iot ? ' · rede IoT habilitada' : ''} · aparelhos: ${netDevsOn(n.id)}</div>` : ''}
        ${isBoxSim(n) && n.ecoBox ? `<div class="text-[11px] text-slate-300 leading-snug">Box: ${n.ecoBox.done ? 'instalação concluída' : 'instalação em andamento'}${n.ecoBox.conn ? ` · ${n.ecoBox.conn === 'wifi' ? 'Wi-Fi ' + esc(n.ecoBox.ssid || '') : n.ecoBox.conn === 'cm' ? 'internet pelo cable modem interno' : 'cabo de rede'}` : ''}${isCoaxTv(n) && n.ecoBox.tv != null ? ` · canais: <span class="${n.ecoBox.tv ? 'text-emerald-400' : 'text-rose-400'}">${n.ecoBox.tv === 2 ? 'travando' : n.ecoBox.tv ? 'OK' : 'sem sinal'}</span>` : ''} · <span class="${n.ecoBox.online ? 'text-emerald-400' : 'text-amber-300'}">${n.ecoBox.online ? 'com internet' : 'sem internet'}</span></div>` : ''}
        ${acts.length ? `<div class="space-y-1.5">${acts.join('')}</div>` : ''}
        ${needsMini(n) ? `<button onclick="addMini('${esc(n.id)}')" class="mini-lembrete"><i class="fa-solid fa-triangle-exclamation"></i> Falta MINI ISOLATOR · colocar</button>` : ''}`;
    }
    function devSignalHTML(n) { return endpointPropsHTML(n, true); }
    function gwLanHTML(n) {
      return `<div class="space-y-1">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Portas</label>
        ${gwPorts(n).map(p => {
          const list = p.multi ? connections.filter(c => c.from === n.id && c.fromPort === p.id) : [portConn(n.id, p.id)].filter(Boolean);
          const who = list.map(c => byId(c.to)).filter(Boolean);
          return `<div class="flex items-center justify-between gap-2 text-[11px] bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
            <span class="font-semibold ${p.fast ? 'text-amber-300' : 'text-slate-200'} whitespace-nowrap">${p.id === 'wifi' ? '<i class="fa-solid fa-wifi"></i> Wi-Fi' : esc(p.label)}</span>
            <span class="text-slate-400 truncate text-right">${who.length ? who.map(d => `<button data-id="${esc(d.id)}" onclick="selectNode(this.dataset.id)" class="text-sky-300 hover:text-sky-200">${esc(d.name)}</button>`).join(', ') : 'livre'}</span>
          </div>`;
        }).join('')}
      </div>`;
    }
    function devNetHTML(n) {
      if (isNetDev(n)) {
        const c = inputConn(n.id);
        return `${c ? `<button data-id="${esc(c.id)}" onclick="selectConnection(this.dataset.id)" class="dev-main"><i class="fa-solid fa-link"></i> Ver a ligação (${esc(gponCableLabel(c))})</button>` : ''}
          ${isIpBox(n) ? ecoBoxPanelHTML(n) : ''}`;
      }
      return `${gwLanHTML(n)}${isEcoEquip(n) ? ecoNetsHTML(n) : ''}${iotPanelHTML(n)}`;
    }
    function devEditHTML(n) {
      return `
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Nome</label>
          <input type="text" value="${esc(n.name)}" onchange="updateNodeName(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-sky-500">
        </div>
        ${TV_MODELS_BY[n.type] ? tvModelPanelHTML(n) : ''}
        ${n.type === 'ont' ? ontModelPanelHTML(n) : ''}
        ${isEndpoint(n) && n.type !== 'ont' ? pointSignalsHTML(n) : ''}`;
    }
    function endpointPropsHTML(n, semPonto) {
      const d = diagnose(n);
      const keys = n.type === 'ont' ? ['min', 'max'] : ['ca', 'cb', 'rx', 'tx'];
      return `
        ${n.type === 'ont' || semPonto ? '' : pointSignalsHTML(n)}
        <div class="space-y-2 ${semPonto ? '' : 'border-t border-slate-800 pt-2'}">
          <div class="flex items-center justify-between">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Diagnóstico de Sinal</label>
            ${statusBadge(d.status)}
          </div>
          ${d.metrics.map(gaugeHTML).join('')}
          ${d.notes.length ? `<ul class="space-y-1">${d.notes.map(t => `<li class="text-[11px] ${ST[d.status].text} leading-snug">${esc(t)}</li>`).join('')}</ul>` : `<p class="text-[11px] text-emerald-400">Todos os níveis dentro do padrão.</p>`}
          ${d.summary ? `<p class="text-[11px] text-slate-300 leading-snug">${esc(d.summary)}</p>` : ''}
          ${d.suggestions.length ? `
            <div>
              <label id="fix-section" class="text-[10px] font-bold text-sky-400 uppercase tracking-wider block mb-1.5 scroll-mt-3">Como corrigir</label>
              <ul class="space-y-1.5">${d.suggestions.map(s => suggestionHTML(s, true)).join('')}</ul>
            </div>` : ''}
        </div>
        ${semPonto ? `<details class="niveis border-t border-slate-800 pt-1"><summary class="text-slate-400"><span><i class="fa-solid fa-chevron-right chev"></i>Caminho desde ${optCtx(n) ? 'o DIO/NAP' : 'o TAP'}</span></summary>${pathTableHTML(n, keys)}</details>` : pathTableHTML(n, keys)}
      `;
    }

    function passivePropsHTML(n) {
      const family = Object.keys(NODE_DEFS).filter(isLock(n.type) ? isLock : isDC(n.type) ? isDC : isAtt(n.type) ? isAtt : isIso(n.type) ? isIso : isDiv);
      const used = connections.filter(c => c.from === n.id).length;
      const lv = n.lv;
      const ports = outPorts(n).map(p => {
        const c = portConn(n.id, p.id);
        const dest = c ? byId(c.to) : null;
        const after = lv ? `<span class="font-mono text-[10px] text-slate-400">RX ${fmt(lv.rx == null ? null : lv.rx - p.loss)} · TX ${fmt(lv.tx == null ? null : lv.tx + p.loss)}</span>` : '';
        const right = c
          ? `<button data-id="${esc(c.id)}" onclick="selectConnection(this.dataset.id)" class="text-[10px] text-sky-300 hover:text-sky-200 font-semibold text-right truncate max-w-[130px]" title="Selecionar cabo">→ ${esc(dest ? dest.name : '')} (${c.length} m)</button>`
          : `<span class="flex gap-1"><button data-port="${esc(p.id)}" onclick="startLinkFromPanel(this.dataset.port)" class="px-2 py-0.5 rounded bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-700 text-emerald-300 text-[10px] font-bold">Ligar cabo</button><button data-port="${esc(p.id)}" onclick="addLock(selectedNodeId, this.dataset.port)" title="Tampar esta saída com TRAVA LOCK" class="px-2 py-0.5 rounded bg-amber-900/60 hover:bg-amber-800 border border-amber-600 text-amber-200 text-[10px] font-bold animate-pulse">TRAVA LOCK</button></span>`;
        return `
          <li class="bg-slate-950 border border-slate-800 rounded-lg p-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] font-semibold text-slate-200">${esc(p.label)} <span class="font-mono text-amber-400">−${p.loss} dB</span></span>
              ${right}
            </div>
            ${after}
          </li>`;
      }).join('');

      return `
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Modelo</label>
          <select onchange="updateNodeType(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-sky-500">
            ${family.map(t => `<option value="${t}" ${t === n.type ? 'selected' : ''} ${NODE_DEFS[t].outs.length < used ? 'disabled' : ''}>${esc(NODE_DEFS[t].label)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Rotação <span class="font-mono text-sky-300 normal-case">${n.rot || 0}°</span></label>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="rotateSelected(-90)" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold"><i class="fa-solid fa-rotate-left"></i> 90°</button>
            <button onclick="rotateSelected(90)" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold"><i class="fa-solid fa-rotate-right"></i> 90°</button>
            <button onclick="rotateSelected(0)" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-semibold">Zerar</button>
          </div>
          <p class="text-[10px] text-slate-400 mt-1">No mapa, arraste a alça azul acima da peça para girar com o mouse.</p>
        </div>
        <div class="border-t border-slate-800 pt-2">
          ${!optCtx(n) && lv && originOf(n) ? pointSignalsHTML(n, 'Nível na entrada (IN) · editável') : `<label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Nível na entrada (IN)</label>`}
          ${!optCtx(n) && lv && originOf(n) ? '' : lv ? `
            <div class="grid grid-cols-4 gap-1 font-mono text-[10px] text-center">
              ${['ca', 'cb', 'rx', 'tx'].map(k => `<div class="bg-slate-950 border border-slate-800 rounded p-1"><span class="block text-slate-400">${k.toUpperCase()}</span><strong class="text-slate-200">${fmt(lv[k])}</strong></div>`).join('')}
            </div>` : `<p class="text-[11px] text-slate-400">Sem sinal: a entrada não está ligada a um TAP.</p>`}
        </div>
        <div class="border-t border-slate-800 pt-2">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Portas de saída</label>
          <ul class="space-y-1.5">${ports}</ul>
          ${isDC(n.type) ? `<button onclick="swapDCPorts('${esc(n.id)}')" class="w-full mt-1.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] text-slate-200 font-bold"><i class="fa-solid fa-right-left"></i> Inverter OUT ⇄ TAP</button>` : ''}
        </div>
      `;
    }

    function diagnosticsPanelHTML() {
      const eps = nodes.filter(isEndpoint).map(n => ({ n, d: diagnose(n) }));
      const count = s => eps.filter(e => e.d.status === s).length;
      const chips = (isGpon() ? ['ok', 'bad', 'none'] : ['ok', 'warn', 'bad', 'none']).map(s => `
        <div class="rounded-lg border px-1 py-1 text-center ${ST[s].chip}">
          <strong class="block text-sm font-mono leading-none">${count(s)}</strong>
          <span class="text-[8px] font-bold leading-tight block mt-0.5">${ST[s].label}</span>
        </div>`).join('');

      const order = { none: 0, bad: 1, warn: 2, ok: 3 };
      const list = eps.slice().sort((a, b) => order[a.d.status] - order[b.d.status]).map(({ n, d }) => `
        <li>
          <button data-id="${esc(n.id)}" onclick="${d.suggestions.length ? 'goToFix' : 'selectNode'}(this.dataset.id)" class="w-full text-left bg-slate-950 hover:bg-slate-800/70 border ${ST[d.status].border} rounded-lg px-2 py-1 transition">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] font-bold text-slate-100 truncate">${equipIcon(n.type, { i: 'mr-1', img: 'inline-block w-6 h-5 object-contain mr-1 align-middle' })}${esc(n.name)}</span>
              ${statusBadge(d.status)}
            </div>
            <div class="font-mono text-[10px] text-slate-400 mt-0.5">
              ${d.metrics.map(m => `${m.short || m.key.toUpperCase()} <span class="${ST[m.st].text} font-bold">${fmt(m.val)}</span>`).join(' · ')}
            </div>
            ${d.status !== 'ok' && (d.summary || d.notes[0]) ? `<p class="text-[10px] text-slate-400 mt-1 leading-snug">${esc(d.notes[0] || d.summary)}</p>` : ''}
            ${d.suggestions.length ? `<p class="text-[10px] text-sky-400 mt-1 font-semibold">${d.suggestions.length} sugest${d.suggestions.length > 1 ? 'ões' : 'ão'} de correção →</p>` : ''}
          </button>
        </li>`).join('');

      const lim = (key, label) => `
        <div class="bg-slate-950 border border-slate-800 rounded-lg px-1.5 py-1">
          <span class="text-slate-400 text-[10px] block">${label}</span>
          <b class="text-xs text-slate-100 font-mono">${DEFAULT_LIMITS[key]}</b>
        </div>`;

      return `
        <div class="space-y-3">
          <div class="border-b border-slate-800 pb-2">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-bold text-sm text-slate-100 flex items-center gap-2"><i class="fa-solid fa-stethoscope text-emerald-400"></i> Diagnóstico da Rede</h3>
              <button onclick="closePanel()" class="panel-close" title="Fechar o painel (Esc ou P)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-[10px] text-slate-400 mt-1">Clique em um ponto para ver o caminho do sinal e as correções. Selecione um componente ou cabo no mapa para editá-lo.</p>
          </div>

          <div class="grid ${isGpon() ? 'grid-cols-3' : 'grid-cols-4'} gap-1.5">${chips}</div>
          ${(() => { const mm = missingMinis(); return mm.length ? `<div class="text-[11px] leading-snug text-amber-200 bg-amber-950/70 border border-amber-600/70 rounded-lg px-2 py-1.5 space-y-1.5">
            <div><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <b>Use MINI ISOLATOR:</b> ${mm.length} equipamento${mm.length > 1 ? 's' : ''} sem MINI ISOLATOR (${esc(mm.map(n => n.name).join(', '))}). O MINI ISOLATOR fica sempre entre o cabo e o equipamento.</div>
            <button onclick="miniAllMissing()" class="w-full py-1 rounded-md bg-amber-500 hover:bg-amber-400 text-slate-950 text-[11px] font-bold"><i class="fa-solid fa-shield-halved"></i> Colocar MINI ISOLATOR ${mm.length > 1 ? 'nos ' + mm.length + ' equipamentos' : 'no ' + esc(mm[0].name)}</button>
          </div>` : ''; })()}
          ${(() => { const fp = freePassivePorts(); return fp.length ? `<div class="text-[11px] leading-snug text-amber-200 bg-amber-950/70 border border-amber-600/70 rounded-lg px-2 py-1.5 space-y-1.5">
            <div><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <b>Use TRAVA LOCK:</b> ${fp.length} saída${fp.length > 1 ? 's' : ''} de passivo sem cabo (${esc([...new Set(fp.map(f => f.node.name))].join(', '))}). Nenhum passivo pode ficar com saída livre.</div>
            <button onclick="lockAllFree()" class="w-full py-1 rounded-md bg-amber-500 hover:bg-amber-400 text-slate-950 text-[11px] font-bold"><i class="fa-solid fa-lock"></i> Colocar TRAVA LOCK ${fp.length > 1 ? 'nas ' + fp.length + ' saídas' : 'na saída'}</button>
          </div>` : ''; })()}
          ${originAlerts().map(a => `<div class="text-[11px] leading-snug text-amber-200 bg-amber-950/70 border border-amber-600/70 rounded-lg px-2 py-1.5"><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <b>Alerta na origem:</b> ${esc(a.text)}</div>`).join('')}

          ${nodes.some(isNetDev) ? `<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Pontos de TV e dispositivos</label>${nodes.filter(isNetDev).map(n => `<button data-id="${esc(n.id)}" onclick="selectNode(this.dataset.id)" class="w-full flex items-center justify-between gap-2 bg-slate-950 hover:bg-slate-800/70 border border-slate-800 rounded-lg px-2 py-1"><span class="text-[11px] font-bold text-slate-100 truncate">${esc(n.name)}</span><span class="net-chip net-${netState(n).st}">● ${netState(n).text.split(' · ')[0]}</span></button>`).join('')}</div>` : ''}
          ${eps.length ? `<ul class="space-y-1.5">${list}</ul>` : `<p class="text-xs text-slate-400 text-center py-4">Nenhum equipamento de cliente no projeto.</p>`}

          ${isGpon() ? gponLimitsHTML() : `<details class="niveis border-t border-slate-800 pt-1" ${limitsOpen ? 'open' : ''} ontoggle="limitsOpen = this.open">
            <summary class="text-sky-400"><span><i class="fa-solid fa-chevron-right chev"></i>Níveis padrão (dBmV)</span><span class="text-slate-400 normal-case font-medium"><i class="fa-solid fa-lock"></i> fixos</span></summary>
            <div class="space-y-2 pt-1">
            <div class="grid grid-cols-3 gap-1.5">
              ${lim('txMin', 'TX mín')}${lim('txMax', 'TX máx')}
              ${lim('rxMin', 'RX mín')}${lim('rxMax', 'RX máx')}
              ${lim('caMin', 'CA mín')}${lim('cbMin', 'CB mín')}
            </div>
            <p class="text-[10px] text-slate-400 leading-snug">Padrão fixo para todos os equipamentos (não pode ser alterado). Dentro do padrão = verde; fora = vermelho.</p>
            </div>
          </details>`}
        </div>
      `;
    }

    function renderProperties() {
      const panel = document.getElementById('properties-content');
      currentActions = [];

      if (selection.size > 1) {
        panel.innerHTML = multiPanelHTML();
      } else if (selectedNodeId && byId(selectedNodeId) && isDevice(byId(selectedNodeId))) {
        panel.innerHTML = deviceWindowHTML(byId(selectedNodeId));
      } else if (selectedNodeId && byId(selectedNodeId)) {
        const n = byId(selectedNodeId);

        panel.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <h3 class="font-bold text-sm text-slate-100">Editar Componente</h3>
              <div class="flex items-center gap-1">
                <button onclick="duplicateSelection()" class="text-slate-300 hover:text-white p-1" title="Duplicar (Ctrl+D)"><i class="fa-solid fa-clone"></i></button>
                <button onclick="deleteSelectedNode()" class="text-rose-400 hover:text-rose-300 p-1" title="Excluir componente (Delete)">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="closePanel()" class="panel-close ml-1" title="Fechar o painel (P)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>

            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Nome</label>
              <input type="text" value="${esc(n.name)}" onchange="updateNodeName(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-sky-500">
            </div>
            <!-- lado da conexão: sempre automático (sem seletor) -->

            ${isCTO(n) ? ctoPanelHTML(n) : n.type === 'tap' ? `
              <div class="space-y-2 border-t border-slate-800 pt-2">
                <label class="text-[10px] font-bold text-sky-400 uppercase tracking-wider block">Níveis de Sinal de Origem (TAP)</label>
                <div class="grid grid-cols-2 gap-1.5 text-xs">
                  <div>
                    <span class="text-slate-400 text-[10px] block">CA (dBmV)</span>
                    <input type="number" step="0.1" placeholder="—" value="${sigVal(n.signals.ca) == null ? '' : esc(n.signals.ca)}" onchange="updateTapSignal('ca', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-100 font-mono">
                  </div>
                  <div>
                    <span class="text-slate-400 text-[10px] block">CB (dBmV)</span>
                    <input type="number" step="0.1" placeholder="—" value="${sigVal(n.signals.cb) == null ? '' : esc(n.signals.cb)}" onchange="updateTapSignal('cb', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-100 font-mono">
                  </div>
                  <div>
                    <span class="text-slate-400 text-[10px] block">RX (dBmV)</span>
                    <input type="number" step="0.1" placeholder="—" value="${sigVal(n.signals.rx) == null ? '' : esc(n.signals.rx)}" onchange="updateTapSignal('rx', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-sky-400 font-mono font-bold">
                  </div>
                  <div>
                    <span class="text-slate-400 text-[10px] block">TX (dBmV) · ${ORIGIN_TX[isDG(n) ? 'dg' : 'tap'].min} a ${ORIGIN_TX[isDG(n) ? 'dg' : 'tap'].max}</span>
                    <input type="number" step="0.1" placeholder="—" value="${sigVal(n.signals.tx) == null ? '' : esc(n.signals.tx)}" onchange="updateTapSignal('tx', this.value)" class="w-full bg-slate-950 border ${originAlert(n) ? 'border-amber-500' : 'border-slate-700'} rounded-lg p-1.5 text-xs text-amber-400 font-mono font-bold">
                  </div>
                </div>
                ${originAlert(n) ? `<div class="text-[11px] leading-snug text-amber-200 bg-amber-950/70 border border-amber-600/70 rounded-lg px-2 py-1.5"><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <b>Alerta:</b> ${esc(originAlert(n).text)}</div>` : ''}
              </div>
              ${tapPanelHTML(n)}
            ` : ''}

            ${isEndpoint(n) ? endpointPropsHTML(n) : ''}
            ${isNetDev(n) ? netDevPanelHTML(n) : ''}
            ${TV_MODELS_BY[n.type] ? tvModelPanelHTML(n) : ''}
            ${isIpBox(n) ? ecoBoxPanelHTML(n) : ''}
            ${n.type === 'ont' ? ontModelPanelHTML(n) : ''}
            ${isEcoEquip(n) ? ecoPanelHTML(n) : ''}
            ${isGateway(n) ? iotPanelHTML(n) : ''}
            ${isOptPassive(n.type) ? splPropsHTML(n) : NODE_DEFS[n.type] ? passivePropsHTML(n) : ''}
          </div>
        `;
      } else if (selectedConnectionId && connById(selectedConnectionId) && isNetCable(connById(selectedConnectionId).cableType)) {
        panel.innerHTML = netLinkPanelHTML(connById(selectedConnectionId));
      } else if (selectedConnectionId && connById(selectedConnectionId) && isGponCable(connById(selectedConnectionId).cableType)) {
        panel.innerHTML = gponCablePanelHTML(connById(selectedConnectionId));
      } else if (selectedConnectionId && connById(selectedConnectionId)) {
        const c = connById(selectedConnectionId);
        const src = byId(c.from), dst = byId(c.to);
        const cab = cableAttenuation[c.cableType] || cableAttenuation.RG6;
        const portOpts = outPorts(src).filter(p => p.id === c.fromPort || p.multi || !portConn(src.id, p.id));

        panel.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <h3 class="font-bold text-sm text-slate-100">Editar Cabo</h3>
              <div class="flex items-center gap-1">
                <button onclick="deleteSelectedConnection()" class="text-rose-400 hover:text-rose-300 p-1" title="Excluir cabo">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="closePanel()" class="panel-close ml-1" title="Fechar o painel (P)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>

            <p class="text-[11px] text-slate-300"><b>${esc(src.name)}</b> <i class="fa-solid fa-arrow-right text-slate-400 mx-1"></i> <b>${esc(dst.name)}</b></p>

            ${numeradorEditorHTML(c, src)}

            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Tipo de Cabo</label>
              <select onchange="updateCableType(this.value)" ${isDG(src) ? 'disabled' : ''} class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-sky-500 disabled:opacity-60">
                <option value="RG6" ${c.cableType === 'RG6' ? 'selected' : ''}>RG6 Branco</option>
                <option value="RG6 Preto" ${c.cableType === 'RG6 Preto' ? 'selected' : ''}>RG6 Preto</option>
                <option value="RG11" ${c.cableType === 'RG11' ? 'selected' : ''} ${c.cableType !== 'RG11' && rg11Problem(src, c.length) ? 'disabled' : ''}>RG11${c.cableType !== 'RG11' && rg11Problem(src, c.length) ? ' (não permitido aqui)' : ''}</option>
              </select>
              <p class="text-[10px] text-slate-400 mt-1">RG11 só no cabo de entrada (saindo do TAP) acima de ${RG11_MIN} m.</p>
              ${isDG(src) ? `<p class="text-[10px] text-violet-300 mt-1">Cabo saindo do DG: só RG6 Branco.</p>` : ''}
            </div>

            <div>
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Distância (Metros)</label>
              <input id="cable-length-input" type="number" min="0" value="${esc(c.length)}" onchange="updateCableLength(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-sky-500">
            </div>

            <div class="border-t border-slate-800 pt-2">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Atenuação neste cabo (dB)</label>
              <div class="grid grid-cols-4 gap-1 font-mono text-[10px] text-center">
                ${['CA', 'CB', 'RX', 'TX'].map(k => `<div class="bg-slate-950 border border-slate-800 rounded p-1"><span class="block text-slate-400">${k}</span><strong class="text-slate-200">${(cab[k] * c.length).toFixed(1)}</strong></div>`).join('')}
              </div>
            </div>
          </div>
        `;
      } else {
        panel.innerHTML = diagnosticsPanelHTML();
      }
    }

    function updateNodeName(name) {
      const n = byId(selectedNodeId);
      if (n) {
        n.name = name;
        render();
      }
    }

    function updateNodeSide(side) {
      const n = byId(selectedNodeId);
      if (!n || NODE_DEFS[n.type]) return;
      if (n.type === 'tap') n.outSide = side; else n.inSide = side;
      render();
    }

    function rotateSelected(delta) {
      const list = selectedIds().map(byId).filter(n => n && NODE_DEFS[n.type] && !noRotate(n));
      if (!list.length) return;
      list.forEach(n => { n.rot = delta === 0 ? 0 : (((n.rot || 0) + delta) % 360 + 360) % 360; });
      render();
    }

    function updateNodeType(type) {
      if (!selectedNodeId) return;
      changeNodeType(selectedNodeId, type);
      refresh();
    }

    function tapPanelHTML(n) {
      const used = connections.filter(c => c.from === n.id).length;
      const ports = outPorts(n).map(p => {
        const c = portConn(n.id, p.id), dest = c ? byId(c.to) : null;
        return `<li class="flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
          <span class="text-[11px] font-semibold text-slate-200">${p.label}</span>
          ${c ? `<button data-id="${esc(c.id)}" onclick="selectConnection(this.dataset.id)" class="text-[10px] text-sky-300 hover:text-sky-200 font-semibold truncate max-w-[150px]" title="Selecionar cabo">→ ${esc(dest ? dest.name : '')} (${c.length} m)</button>`
              : `<button data-port="${p.id}" onclick="startLinkFromPanel(this.dataset.port)" class="px-2 py-0.5 rounded bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-700 text-emerald-300 text-[10px] font-bold">Ligar cabo</button>`}
        </li>`;
      }).join('');
      return `
        <div class="border-t border-slate-800 pt-2 space-y-1.5">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Tipo de origem e vias (cabos de instalação)</label>
          <div class="grid grid-cols-4 gap-1.5">
            ${TAP_VIAS.map(v => `<button onclick="updateOriginType('tap', ${v})" ${v < used ? 'disabled title="Há mais cabos ligados do que vias"' : ''} class="py-1 rounded-lg border text-[11px] font-bold disabled:opacity-40 disabled:cursor-not-allowed ${!isDG(n) && v === tapVias(n) ? 'bg-sky-950/70 border-sky-500 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}">TAP ${v}</button>`).join('')}
            <button onclick="updateOriginType('dg', 4)" ${used > 4 ? 'disabled title="Há mais de 4 cabos ligados"' : ''} class="py-1 rounded-lg border text-[11px] font-bold disabled:opacity-40 disabled:cursor-not-allowed ${isDG(n) ? 'bg-violet-950/70 border-violet-500 text-violet-300' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}">DG 4</button>
          </div>
          ${isDG(n) ? `<p class="text-[11px] text-violet-300 bg-violet-950/60 border border-violet-700/60 rounded-lg px-2 py-1">DG: 4 vias fixas. Só é permitido cabo RG6 Branco.</p>` : ''}
          <p class="text-[10px] text-slate-400">${used} de ${tapVias(n)} vias em uso. Cada via aceita um cabo.</p>
          <ul class="space-y-1">${ports}</ul>
        </div>`;
    }
    // Troca o tipo da origem (TAP 2/4/8 vias ou DG) mantendo os cabos
    function updateOriginType(model, v) {
      const n = byId(selectedNodeId);
      if (!n || n.type !== 'tap') return;
      const vias = model === 'dg' ? 4 : v;
      const cs = connections.filter(c => c.from === n.id);
      if (cs.length > vias) { showToast(`Há ${cs.length} cabos ligados: escolha uma origem com pelo menos ${cs.length} vias.`, 'warning'); return; }
      const wasDefault = n.name === 'DG' || isDefaultTapName(n.name);
      let changed = 0;
      if (model === 'dg') {
        n.model = 'dg';
        cs.forEach(c => { if (c.cableType !== DG_CABLE) { c.cableType = DG_CABLE; changed++; } });
      } else delete n.model;
      n.vias = vias;
      cs.forEach(c => { if (Number(String(c.fromPort).replace('out', '')) > vias) c.fromPort = null; });
      const usedP = new Set(cs.filter(c => c.fromPort).map(c => c.fromPort));
      cs.filter(c => !c.fromPort).forEach(c => { for (let i = 1; i <= vias; i++) if (!usedP.has('out' + i)) { c.fromPort = 'out' + i; usedP.add(c.fromPort); break; } });
      if (wasDefault) n.name = model === 'dg' ? 'DG' : tapName(vias);
      refresh();
      if (changed) showToast(`${changed} cabo${changed > 1 ? 's' : ''} da origem ${changed > 1 ? 'foram trocados' : 'foi trocado'} para RG6 Branco (regra do DG).`, 'warning');
    }
    function updateTapVias(v) {
      const n = byId(selectedNodeId);
      if (!n || n.type !== 'tap' || isDG(n) || !TAP_VIAS.includes(v)) return;
      const cs = connections.filter(c => c.from === n.id);
      if (cs.length > v) { showToast(`Há ${cs.length} cabos ligados: escolha um TAP com pelo menos ${cs.length} vias.`, 'warning'); return; }
      n.vias = v;
      // reacomoda os cabos nas primeiras vias, mantendo a ordem
      cs.sort((a, b) => Number(a.fromPort.replace('out', '')) - Number(b.fromPort.replace('out', '')))
        .forEach((c, i) => { if (Number(c.fromPort.replace('out', '')) > v) c.fromPort = null; });
      const usedP = new Set(cs.filter(c => c.fromPort).map(c => c.fromPort));
      cs.filter(c => !c.fromPort).forEach(c => { for (let i = 1; i <= v; i++) if (!usedP.has('out' + i)) { c.fromPort = 'out' + i; usedP.add(c.fromPort); break; } });
      if (isDefaultTapName(n.name)) n.name = tapName(v);
      refresh();
    }

    function updateTapSignal(key, val) {
      const n = byId(selectedNodeId);
      if (n && n.type === 'tap') {
        const v = parseFloat(String(val).replace(',', '.'));
        n.signals[key] = isNaN(v) ? '' : v;   // em branco = não informado
        refresh();
        const al = key === 'tx' ? originAlert(n) : null;
        if (al) showToast(`Alerta: ${al.msg}`, 'warning');
      }
    }

    function updateCableType(val) {
      const c = connById(selectedConnectionId);
      if (c && isNetCable(c.cableType) !== isNetCable(val)) {
        showToast('Fibra e ligação de rede não se trocam: a ligação de rede vai da ONT até o ponto de TV.', 'warning');
        renderProperties();
        return;
      }
      if (c && isNetCable(val)) { setNetLinkType(c, val); return; }
      if (c && val !== 'RG6' && byId(c.from) && byId(c.from).type === 'iso') {
        showToast('Depois do CABLE ISOLATOR o cabo é sempre RG6 Branco.', 'warning');
        renderProperties();
        return;
      }
      if (c && isGponCable(c.cableType) !== isGponCable(val)) { renderProperties(); return; }
      if (c && val === 'RG11' && rg11Problem(byId(c.from), c.length)) {
        showToast(rg11Problem(byId(c.from), c.length), 'warning');
        renderProperties();
        return;
      }
      if (c && isDG(byId(c.from)) && val !== DG_CABLE) {
        showToast('No DG só é permitido cabo RG6 Branco.', 'warning');
        renderProperties();
        return;
      }
      if (c) {
        c.cableType = val;
        refresh();
      }
    }

    function setNetLinkType(c, val) {
      const dev = byId(c.to), ont = byId(c.from);
      if (!dev || !ont) return;
      if (val === 'RJ45 1,5 m' && !allowsPatch(dev)) { showToast('O cabo RJ45 1,5 m é do Box TV, da TV APP e da Sound Box. Para os outros aparelhos use PONTO ULTRA.', 'warning'); renderProperties(); return; }
      if (val !== 'Wi-Fi' && NET_DEV[dev.type].wifiOnly) { showToast(`A ${NET_DEV[dev.type].label} só liga por Wi-Fi (rede 2,4 GHz).`, 'warning'); renderProperties(); return; }
      if (val === 'Wi-Fi') { c.fromPort = 'wifi'; c.length = 0; c.band = c.band || NET_DEV[dev.type].band || '5'; c.rssi = c.rssi == null ? '' : c.rssi; }
      else {
        let port = String(c.fromPort).startsWith('lan') ? c.fromPort : null;
        if (!port) { const free = gwPorts(ont).find(x => x.id.startsWith('lan') && !portConn(ont.id, x.id)); port = free && free.id; }
        if (!port) { showToast('Não há porta LAN livre na ONT.', 'warning'); renderProperties(); return; }
        c.fromPort = port;
        c.length = val === 'RJ45 1,5 m' ? PATCH_M : (c.cableType === 'RJ45' && Number(c.length) > 0 ? c.length : 5);
        delete c.band; delete c.rssi;
      }
      c.cableType = val;
      refresh();
      if (val === 'Wi-Fi' && dev.type === 'soundbox') showToast('Sound Box por Wi-Fi: não recomendado. Prefira PONTO ULTRA.', 'warning');
      else if (val === 'Wi-Fi') showToast(wifiRule(), 'info');
      else if (val === 'RJ45') showToast(`PONTO ULTRA de ${c.length} m: ajuste a metragem no painel.`, 'info');
    }
    function updateNetLength(val) {
      const c = connById(selectedConnectionId);
      if (!c || c.cableType !== 'RJ45') return;
      const v = parseFloat(String(val).replace(',', '.'));
      if (isNaN(v) || v <= 0 || v > RJ45_MAX) { showToast(`Comprimento do PONTO ULTRA: maior que zero e até ${RJ45_MAX} m.`, 'warning'); renderProperties(); return; }
      if (usesPatch(byId(c.to)) && v <= PATCH_M) { showToast(`No ${byId(c.to).name}, até 1,5 m use o cabo RJ45 1,5 m; o PONTO ULTRA é para distâncias maiores.`, 'warning'); renderProperties(); return; }
      c.length = v;
      refresh();
    }
    // Menu de conexão do aparelho offline: escolhe Cabo RJ45 1,5 m, Wi-Fi ou PONTO ULTRA e liga no EMTA/ONT
    function connectOptions(dev) {
      const ultra = { k: 'ultra', icon: 'fa-ethernet', t: 'PONTO ULTRA', sub: `RJ45 em metros · ${ultraCost(dev)}`, cls: dev.type === 'soundbox' ? 'cm-free' : 'cm-cost' };
      const patch = { k: 'patch', icon: 'fa-ethernet', t: 'Cabo RJ45 1,5 m', sub: 'porta LAN', cls: '' };
      const wifi = { k: dev.type === 'soundbox' ? 'wifi-confirm' : 'wifi', icon: 'fa-wifi', t: 'Wi-Fi', sub: dev.type === 'soundbox' ? 'não recomendado' : '5 GHz · RSSI até −60 dBm', cls: dev.type === 'soundbox' ? 'cm-warn' : '' };
      if (NET_DEV[dev.type].wifiOnly) return [{ k: 'wifi', icon: 'fa-wifi', t: 'Wi-Fi · rede IoT', sub: '2,4 GHz · habilitar a rede IoT no modem', cls: '' }];
      if (dev.type === 'soundbox') return [patch, ultra, wifi];
      if (usesPatch(dev)) return [patch, wifi, ultra];
      return [wifi, ultra];
    }
    function pickGateway(dev) {
      const gws = nodes.filter(isGateway);
      if (!gws.length) return { err: `Coloque ${isGpon() ? 'uma ONT' : 'um EMTA'} no projeto para conectar o ${dev.name}.` };
      const ok = gws.filter(g => !isTvPoint(dev) || netCount(g.id) < NET_MAX_TV);
      if (!ok.length) return { err: `${GW().A} aceita até ${NET_MAX_TV} pontos de TV.` };
      return { gw: ok.find(g => ['ok', 'warn'].includes(statusOf(g))) || ok[0] };
    }
    function setIoT(gwId, on) {
      const g = byId(gwId);
      if (!g || !isGateway(g)) return;
      g.iot = !!on;
      refresh();
      showToast(on ? `Rede IoT (2,4 GHz) habilitada ${g.type === 'modem' ? 'no' : 'na'} ${g.name}.` : `Rede IoT desabilitada ${g.type === 'modem' ? 'no' : 'na'} ${g.name}: câmeras Wi-Fi ficam offline.`, on ? 'success' : 'warning');
    }
    // --- ECOSSISTEMA: configuração do EMTA/ONT no Simulador de configuração EMTA ONT ---
    // O simulador do equipamento abre num painel (iframe) com #pro=<JSON em base64url> contendo os níveis
    // de sinal calculados aqui. Ele responde por postMessage ({type:'eco:state'}) com a rede configurada
    // (redes Wi-Fi e rede IoT), que fica salva no equipamento do projeto (n.ecoCfg).
    // Endereço do simulador: ?emta=<url> na barra de endereços (fica salvo) ou o site publicado.
    const ECO_EMTA_DEFAULT = 'https://simulador-emta-ont.pages.dev/';
    function ecoEmtaUrl() {
      try {
        const q = new URLSearchParams(location.search).get('emta');
        if (q) localStorage.setItem('ecoEmtaUrl', q);
        return q || localStorage.getItem('ecoEmtaUrl') || ECO_EMTA_DEFAULT;
      } catch (e) { return ECO_EMTA_DEFAULT; }
    }
    const isEcoEquip = n => !!n && (n.type === 'modem' || n.type === 'ont');
    // EMTA → F@ST3896 (HFC); ONT ZTE F8748Q → XGS-PON; ONT genérica → ZTE F6645P (G-PON)
    const ecoModel = n => n.type === 'modem' ? 'hfc' : n.model === 'f8748q' ? 'xgs' : 'gpon';
    const ECO_LABEL = { hfc: 'Sagemcom F@ST3896', gpon: 'ZTE ZXHN F6645P', xgs: 'ZTE ZXHN F8748Q' };
    const ecoRound = v => v == null || isNaN(v) ? null : Math.round(v * 100) / 100;
    function ecoPayload(n) {
      if (!n.ecoKey) n.ecoKey = uid('eco');
      const lv = n.lv || {}, model = ecoModel(n);
      const sig = model === 'hfc'
        ? { ca: ecoRound(lv.ca), cb: ecoRound(lv.cb), rx: ecoRound(lv.rx), tx: ecoRound(lv.tx) }
        : { rxMin: ecoRound(lv.min), rxMax: ecoRound(lv.max) };
      const o = /^https?:$/.test(location.protocol) ? location.origin : '*';
      // aparelhos do projeto ligados neste EMTA/ONT (cabo: porta e velocidade; Wi-Fi: rede, banda e RSSI)
      const devs = connections.filter(c => c.from === n.id && isNetDev(byId(c.to))).map(c => {
        const d = byId(c.to), wifi = c.cableType === 'Wi-Fi';
        if (wifi) {
          const j = wifiJoin(c, n);
          if (j && j.err) return null;   // não conectou (rede ou senha erradas): não aparece no modem
          return { n: d.name, t: d.type, via: 'wifi', ssid: j ? j.w.ssid : '', band: c.band === '2.4' ? '2.4' : '5', ...(sigVal(c.rssi) != null ? { rssi: sigVal(c.rssi) } : {}), ...(j && j.w.iot ? { iot: true } : {}) };
        }
        const pt = gwPorts(n).find(x => x.id === c.fromPort);
        return { n: d.name, t: d.type, via: 'lan', port: Number(String(c.fromPort).replace('lan', '')) || 1, g: pt ? pt.gbps : 1 };
      }).filter(Boolean);
      return { v: 1, key: n.ecoKey, name: n.name, model, sig, iot: !!n.iot, devs, o };
    }
    const ecoB64 = obj => btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    function ecoLink(n) { return ecoEmtaUrl().replace(/#.*$/, '') + '#pro=' + ecoB64(ecoPayload(n)); }
    let ecoOpenId = null;
    function openEquipConfig(id) {
      const n = byId(id);
      if (!isEcoEquip(n)) return;
      const model = ecoModel(n);
      openEcoFrame(id, ecoLink(n), `Configurar ${n.name} · ${ECO_LABEL[model]}`, 'Níveis de sinal do projeto aplicados no equipamento. A rede Wi-Fi e a rede IoT voltam para o projeto ao salvar.');
    }
    function openEcoFrame(id, url, title, sub) {
      const n = byId(id);
      scheduleCommit();   // salva a ecoKey criada agora
      ecoOpenId = id;
      let ov = document.getElementById('eco-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.id = 'eco-overlay';
        ov.className = 'flex flex-col p-2';
        ov.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(2,6,23,.8)';
        document.body.appendChild(ov);
      }
      ov.innerHTML = `
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-3 py-2 text-slate-100" style="border-radius:12px 12px 0 0">
          <i class="fa-solid fa-sliders text-sky-400"></i>
          <div class="min-w-0 flex-1 leading-tight">
            <b class="text-sm block truncate">${esc(title)}</b>
            <span class="text-[11px] text-slate-400 block truncate">${esc(sub)}</span>
          </div>
          <a href="${esc(url)}" target="_blank" rel="noopener" class="text-xs text-sky-300 hover:text-sky-200 px-2 py-1 border border-slate-700 rounded-lg whitespace-nowrap" title="Abrir em nova aba"><i class="fa-solid fa-up-right-from-square"></i><span class="hidden sm:inline"> Nova aba</span></a>
          <button onclick="closeEquipConfig()" class="text-xs font-bold px-3 py-1 rounded-lg whitespace-nowrap" style="color:#0f172a;background:#38bdf8"><i class="fa-solid fa-check"></i> Concluir</button>
        </div>
        <iframe src="${esc(url)}" title="Configuração do ${esc(n.name)}" class="flex-1 w-full bg-white border border-slate-700" style="border-radius:0 0 12px 12px;border-top:0" allow="clipboard-write"></iframe>`;
      ov.style.display = 'flex';
    }
    function closeEquipConfig() {
      const ov = document.getElementById('eco-overlay');
      if (ov) { ov.style.display = 'none'; ov.innerHTML = ''; }
      ecoOpenId = null;
      refresh();
    }
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || typeof d !== 'object' || d.v !== 1) return;
      if (d.type === 'eco:close') { if (ecoOpenId) closeEquipConfig(); return; }
      if (d.type === 'eco:box' && typeof d.key === 'string') { ecoBoxMsg(d); return; }
      if (d.type !== 'eco:state' || typeof d.key !== 'string') return;
      const n = nodes.find(x => x.ecoKey === d.key);
      if (!isEcoEquip(n)) return;
      const nets = Array.isArray(d.nets) ? d.nets.slice(0, 16).map(w => ({ ssid: String(w.ssid || '').slice(0, 64), band: String(w.band || '').slice(0, 20), sec: String(w.sec || '').slice(0, 20), pass: String(w.pass || '').slice(0, 64), iot: !!w.iot, ...(w.hidden ? { hidden: true } : {}) })) : [];
      const prevIot = !!n.iot;
      n.ecoCfg = { nets, at: Date.now() };
      if (typeof d.iot === 'boolean') { if (d.iot) n.iot = true; else delete n.iot; }
      if (!ecoOpenId) refresh(); else scheduleCommit();
      if (typeof d.iot === 'boolean' && d.iot !== prevIot) showToast(`Rede IoT ${d.iot ? 'habilitada' : 'desabilitada'} na configuração ${n.type === 'modem' ? 'do' : 'da'} ${n.name}.`, d.iot ? 'success' : 'warning');
    });
    // --- ECOSSISTEMA: Box TV via IP no Simulador BOX_TV ---
    // O box abre com as redes do EMTA/ONT (n.ecoCfg do gateway), o tipo de ligação do projeto e se o
    // gateway tem sinal. Ele responde ({type:'eco:box'}) com a rede em que conectou e se concluiu a instalação.
    const ECO_BOX_DEFAULT = 'https://simulador-tv.pages.dev/box.html';
    function ecoBoxUrl() {
      try {
        const q = new URLSearchParams(location.search).get('box');
        if (q) localStorage.setItem('ecoBoxUrl', q);
        return q || localStorage.getItem('ecoBoxUrl') || ECO_BOX_DEFAULT;
      } catch (e) { return ECO_BOX_DEFAULT; }
    }
    // Box TV via HFC e Decoder (coaxial): o box recebe CA/CB/RX/TX do ponto; o Wi-Fi (apps) vem do EMTA do projeto, se houver
    const isCoaxTv = n => !!n && (n.type === 'box' || n.type === 'tv');
    const isBoxSim = n => isIpBox(n) || isCoaxTv(n);
    const TV_MODEL_DEFAULT = { boxtv: 'S4KCW3', box: 'S4KCW3', tv: 'SAG4KC363', soundbox: 'S4KCW4S' };   // genérico abre neste modelo no simulador do box
    function ecoCoaxPayload(n) {
      if (!n.ecoKey) n.ecoKey = uid('eco');
      const lv = n.lv || {}, g = nodes.find(isGateway), b = n.ecoBox || {}, nets = ecoNets(g);
      return { v: 1, key: n.ecoKey, name: n.name, modelo: tvModel(n) || TV_MODEL_DEFAULT[n.type],
        hfc: { ca: ecoRound(lv.ca), cb: ecoRound(lv.cb), rx: ecoRound(lv.rx), tx: ecoRound(lv.tx), mini: !needsMini(n) },
        link: 'hfc', gw: g ? g.name : '', gwOk: !!g && ['ok', 'warn'].includes(statusOf(g)),
        nets: nets ? nets.map(w => ({ ssid: w.ssid, band: w.band, sec: w.sec, pass: w.pass, iot: !!w.iot, ...(w.hidden ? { hidden: true } : {}) })) : null,
        ...(b.done ? { done: true, ...(b.conn ? { conn: b.conn } : {}), ...(b.conn === 'wifi' ? { ssid: b.ssid || '', pass: b.pass || '' } : {}) } : {}),
        o: /^https?:$/.test(location.protocol) ? location.origin : '*' };
    }
    function ecoBoxPayload(n) {
      if (isCoaxTv(n)) return ecoCoaxPayload(n);
      if (!n.ecoKey) n.ecoKey = uid('eco');
      const c = inputConn(n.id), g = c && byId(c.from), b = n.ecoBox || {};
      const nets = ecoNets(g);
      return { v: 1, key: n.ecoKey, name: n.name, ...(tvModel(n) || n.type === 'soundbox' ? { modelo: tvModel(n) || TV_MODEL_DEFAULT.soundbox } : {}), gw: g ? g.name : '', gwOk: !!g && ['ok', 'warn'].includes(statusOf(g)),
        link: c && c.cableType === 'Wi-Fi' ? 'wifi' : 'cabo', ...(c && c.cableType === 'Wi-Fi' && sigVal(c.rssi) != null ? { rssi: sigVal(c.rssi) } : {}), nets: nets ? nets.map(w => ({ ssid: w.ssid, band: w.band, sec: w.sec, pass: w.pass, iot: !!w.iot, ...(w.hidden ? { hidden: true } : {}) })) : null,
        ...(b.done && b.conn ? { done: true, conn: b.conn, ...(b.conn === 'wifi' ? { ssid: b.ssid || '', pass: b.pass || '' } : {}) } : {}),
        o: /^https?:$/.test(location.protocol) ? location.origin : '*' };
    }
    function openBoxTv(id) {
      const n = byId(id), c = n && inputConn(n.id), g = c && byId(c.from);
      if (isCoaxTv(n)) {
        const url = ecoBoxUrl().replace(/#.*$/, '') + '#pro=' + ecoB64(ecoBoxPayload(n)), lv = n.lv;
        openEcoFrame(id, url, `${n.name} · ${n.type === 'tv' ? 'Decoder' : 'Box TV via HFC'}`, lv && lv.rx != null ? `Sinal do projeto no ponto: CA ${fmt(lv.ca)} · CB ${fmt(lv.cb)}${n.type === 'tv' ? ` · RX ${fmt(lv.rx)} · TX ${fmt(lv.tx)}` : ''} dBmV.${n.type === 'box' ? ' A internet vem do EMTA (Wi-Fi ou cabo), escolhida no box.' : ''}` : 'Sem sinal no ponto: ligue o cabo coaxial no projeto.');
        return;
      }
      if (!n || !isGateway(g)) { showToast(`Ligue o ${n ? n.name : 'Box TV'} ${GW().na} primeiro (Wi-Fi ou cabo de rede).`, 'warning'); return; }
      const url = ecoBoxUrl().replace(/#.*$/, '') + '#pro=' + ecoB64(ecoBoxPayload(n));
      openEcoFrame(id, url, `${n.name} · Box TV`, ecoNets(g) ? `Redes ${g.type === 'modem' ? 'do' : 'da'} ${g.name} no box. A rede escolhida no box volta para o projeto.` : `${g.name} ainda não configurado: o box usa a rede de treino (REDE_CLIENTE).`);
    }
    function ecoBoxMsg(d) {
      const n = nodes.find(x => x.ecoKey === d.key && isBoxSim(x));
      if (!n) return;
      const conn = ['wifi', 'cabo', 'cm'].includes(d.conn) ? d.conn : null;
