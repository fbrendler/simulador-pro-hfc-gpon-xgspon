# Publica o simulador no Cloudflare Pages a cada envio para a main (ou pelo botão "Run workflow").
# Precisa de dois segredos no repositório (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  (permissão Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID
name: Publicar no Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar a pasta do site (só o simulador)
        run: |
          mkdir -p site
          cp index.html site/
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: nada foi publicado."
            exit 0
          fi
          npx --yes wrangler@3 pages deploy site --project-name simulador-pro-hfc-gpon-xgspon --branch main
